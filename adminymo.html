<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة مدارس الأحد - لوحة الأدمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f8ff;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-glass-hover: rgba(255, 255, 255, 0.75);
            --text-primary: #0a1a2f;
            --text-secondary: #1a3a5c;
            --text-muted: #5a7a9a;
            --sky-light: #e6f3ff;
            --sky-medium: #7ec8f0;
            --sky-dark: #2196f3;
            --sky-gradient: linear-gradient(145deg, #b3e0ff, #4fc3f7);
            --shadow: 0 8px 32px rgba(33, 150, 243, 0.15);
            --shadow-hover: 0 16px 48px rgba(33, 150, 243, 0.25);
            --border-glass: rgba(33, 150, 243, 0.2);
            --ok: #2e7d32;
            --bad: #c62828;
            --gold: #f9a825;
            --pending: #f57c00;
            --admin-gradient: linear-gradient(135deg, #6a1b9a, #4a148c);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a1628;
            --bg-secondary: #13203a;
            --bg-glass: rgba(20, 40, 80, 0.6);
            --bg-glass-hover: rgba(30, 60, 120, 0.75);
            --text-primary: #e8f4fd;
            --text-secondary: #b0d4f0;
            --text-muted: #7a9ab8;
            --sky-light: #1a2a4a;
            --sky-medium: #4a8ac8;
            --sky-dark: #64b5f6;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
            --border-glass: rgba(100, 181, 246, 0.2);
            --ok: #66bb6a;
            --bad: #ef5350;
            --gold: #ffd54f;
            --pending: #ffa726;
        }

        body {
            font-family: 'El Messiri', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(100, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(33, 150, 243, 0.06) 0%, transparent 50%);
            animation: floatBubbles 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBubbles {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-5%, 5%) scale(1.05);
            }
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Lalezar', cursive;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 0.4em;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 28px 32px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .glass:hover {
            background: var(--bg-glass-hover);
            border-color: var(--sky-dark);
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }

        .glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        header.top {
            padding: 12px 0;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        header.top .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: var(--transition);
        }

        .brand:hover {
            transform: scale(1.02);
        }

        .brand .mark {
            color: var(--sky-dark);
            font-size: 2.4rem;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(33, 150, 243, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 24px rgba(33, 150, 243, 0.6));
            }
        }

        .brand .sky-text {
            background: var(--sky-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand .admin-badge {
            font-size: 0.8rem;
            background: var(--admin-gradient);
            color: #fff;
            padding: 2px 16px;
            border-radius: 40px;
            -webkit-text-fill-color: #fff;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a,
        nav button.linklike {
            color: var(--text-secondary);
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a:hover,
        nav button.linklike:hover {
            background: var(--sky-dark);
            border-color: var(--sky-dark);
            color: #fff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(33, 150, 243, 0.3);
        }

        nav .who {
            color: var(--text-secondary);
            padding: 6px 18px;
            background: var(--bg-glass);
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            background: rgba(46, 125, 50, 0.2);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .status-badge.inactive {
            background: rgba(198, 40, 40, 0.2);
            color: var(--bad);
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .status-badge.pending {
            background: rgba(245, 124, 0, 0.2);
            color: var(--pending);
            border: 1px solid rgba(245, 124, 0, 0.3);
        }

        .status-badge.admin {
            background: rgba(106, 27, 154, 0.2);
            color: #6a1b9a;
            border: 1px solid rgba(106, 27, 154, 0.3);
        }

        .theme-toggle {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            background: var(--sky-dark);
            border-color: var(--sky-dark);
            color: #fff;
            transform: rotate(20deg);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 50px;
            border: none;
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            color: #fff;
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(33, 150, 243, 0.5);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
        }

        .btn-secondary:hover {
            background: var(--sky-dark);
            color: #fff;
            border-color: var(--sky-dark);
            transform: translateY(-3px);
        }

        .btn-admin {
            background: var(--admin-gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(106, 27, 154, 0.35);
        }

        .btn-admin:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(106, 27, 154, 0.5);
        }

        .btn-ok {
            background: rgba(46, 125, 50, 0.15);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .btn-ok:hover {
            background: var(--ok);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-bad {
            background: rgba(198, 40, 40, 0.15);
            color: var(--bad);
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .btn-bad:hover {
            background: var(--bad);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd54f, #f9a825);
            color: #0a1628;
            box-shadow: 0 4px 20px rgba(249, 168, 37, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(249, 168, 37, 0.5);
        }

        .btn-pending {
            background: rgba(245, 124, 0, 0.15);
            color: var(--pending);
            border: 1px solid rgba(245, 124, 0, 0.3);
        }

        .btn-pending:hover {
            background: var(--pending);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 0.8rem;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 18px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--sky-dark);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .num {
            font-size: 2.4rem;
            font-family: 'Lalezar', cursive;
            color: var(--sky-dark);
            line-height: 1;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .stat-card .icon {
            font-size: 1.5rem;
            color: var(--sky-dark);
            opacity: 0.3;
            margin-bottom: 4px;
        }

        /* ===== TAB SYSTEM ===== */
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: var(--bg-glass-hover);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--sky-dark);
            color: #fff;
            border-color: var(--sky-dark);
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FORMS ===== */
        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex: 1 1 180px;
        }

        input,
        select {
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-primary);
            transition: var(--transition);
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--sky-dark);
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.12);
            background: var(--bg-glass-hover);
        }

        /* ===== TABLE ===== */
        .table-wrap {
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px;
        }

        [data-theme="dark"] .table-wrap {
            background: rgba(255, 255, 255, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-glass);
            vertical-align: middle;
        }

        th {
            color: var(--sky-dark);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        tr:hover td {
            background: rgba(33, 150, 243, 0.04);
        }

        .badge {
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-ok {
            background: rgba(46, 125, 50, 0.15);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.2);
        }

        .badge-bad {
            background: rgba(198, 40, 40, 0.15);
            color: var(--bad);
            border: 1px solid rgba(198, 40, 40, 0.2);
        }

        .badge-pending {
            background: rgba(245, 124, 0, 0.15);
            color: var(--pending);
            border: 1px solid rgba(245, 124, 0, 0.2);
        }

        .badge-admin {
            background: rgba(106, 27, 154, 0.15);
            color: #6a1b9a;
            border: 1px solid rgba(106, 27, 154, 0.2);
        }

        .badge-servant {
            background: rgba(33, 150, 243, 0.15);
            color: var(--sky-dark);
            border: 1px solid rgba(33, 150, 243, 0.2);
        }

        .code-pill {
            background: rgba(33, 150, 243, 0.1);
            color: var(--sky-dark);
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(33, 150, 243, 0.15);
            font-size: 0.8rem;
            font-family: monospace;
        }

        .empty {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
            font-size: 1rem;
        }

        /* ===== ALERTS ===== */
        .alert {
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(46, 125, 50, 0.12);
            border: 1px solid rgba(46, 125, 50, 0.2);
            color: var(--ok);
        }

        .alert-error {
            background: rgba(198, 40, 40, 0.12);
            border: 1px solid rgba(198, 40, 40, 0.2);
            color: var(--bad);
        }

        .alert-warning {
            background: rgba(245, 124, 0, 0.12);
            border: 1px solid rgba(245, 124, 0, 0.2);
            color: var(--pending);
        }

        .alert-info {
            background: rgba(33, 150, 243, 0.12);
            border: 1px solid rgba(33, 150, 243, 0.2);
            color: var(--sky-dark);
        }

        /* ===== FOOTER ===== */
        footer.site {
            text-align: center;
            padding: 30px 0 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-glass);
            margin-top: 50px;
        }

        footer.site strong {
            color: var(--sky-dark);
        }

        .loading {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-size: 1.3rem;
        }

        .admin-login-icon {
            font-size: 4rem;
            color: #6a1b9a;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .notification-badge {
            background: var(--bad);
            color: #fff;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 22px;
            text-align: center;
            line-height: 22px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .brand {
                font-size: 1.4rem;
            }
            .glass {
                padding: 16px 18px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-card .num {
                font-size: 2rem;
            }
            .tabs {
                gap: 4px;
            }
            .tab-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            nav a,
            nav button.linklike {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stat-card .num {
                font-size: 1.6rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-glass);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--sky-dark);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--sky-medium);
        }
    </style>
</head>
<body>

    <header class="top">
        <div class="container row">
            <a href="#" class="brand" onclick="go('home');return false;">
                <span class="mark"><i class="fas fa-cross"></i></span>
                <span class="sky-text">منصة مدارس الأحد</span>
                <span class="admin-badge">أدمن</span>
            </a>
            <nav id="nav">
                <button class="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="container" id="app">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> جارِ تحميل لوحة الأدمن...</div>

        <div class="container">

            منصة مدارس الأحد - Developed by: <strong>Keroles Ayman, Arsany Moftah</strong>
        </div>
    </footer>

    <script type="module">

        // بيانات الأدمن الافتراضية
        const DEFAULT_ADMIN = {

            passwordHash: "",
            isActive: true,
            isAdmin: true,
            isPending: false,
            assignedClass: null
        };

        const ADMIN_PASSWORD = "Admin@123";

        let db = { servants: [], children: [], attendance: [] };
        let session = null;
        let route = 'home';
        let routeParam = null;
        let flash = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let activeTab = 'pending';

        // ============ SESSION MANAGEMENT ============
        function saveSession(username, name, isAdmin) {
            localStorage.setItem('session', JSON.stringify({ username, name, isAdmin }));
        }

        function loadSession() {
            try {
                const saved = localStorage.getItem('session');
                if (saved) {
                    const data = JSON.parse(saved);
                    return data;
                }
            } catch (e) {}
            return null;
        }

        function clearSession() {
            localStorage.removeItem('session');
        }

        // ============ DB FUNCTIONS ============
        async function loadDB() {
            try {
                const snap = await getDoc(dataDocRef);
                if (snap.exists()) {
                    db = snap.data().payload;
                } else {
                    const passwordHash = await sha256(ADMIN_PASSWORD);
                    const adminData = { ...DEFAULT_ADMIN, passwordHash };
                    db = { servants: [adminData], children: [], attendance: [] };
                    await saveDB();
                }
                db.servants = db.servants.map(s => ({
                    ...s,
                    isActive: s.isActive !== undefined ? s.isActive : false,
                    isAdmin: s.isAdmin || false,
                    isPending: s.isPending !== undefined ? s.isPending : false,
                    assignedClass: s.assignedClass || null,
                    pendingSince: s.pendingSince || null
                }));
            } catch (e) {
                console.error('❌ تعذر تحميل البيانات', e);
                alert('تعذر الاتصال بقاعدة البيانات.');
            }
        }

        async function saveDB() {
            try {
                await setDoc(dataDocRef, { payload: db });
            } catch (e) {
                console.error('❌ تعذر حفظ البيانات', e);
                alert('حدث خطأ أثناء حفظ البيانات.');
            }
        }

        function watchDB() {
            onSnapshot(dataDocRef, (snap) => {
                if (snap.exists()) {
                    db = snap.data().payload;
                    db.servants = db.servants.map(s => ({
                        ...s,
                        isActive: s.isActive !== undefined ? s.isActive : false,
                        isAdmin: s.isAdmin || false,
                        isPending: s.isPending !== undefined ? s.isPending : false,
                        assignedClass: s.assignedClass || null,
                        pendingSince: s.pendingSince || null
                    }));
                    render();
                }
            });
        }

        // ============ THEME ============
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            localStorage.setItem('theme', theme);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        // ============ HELPERS ============
        function esc(s) {
            return (s ?? '').toString()
                .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
        }

        async function sha256(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function todayDate() {
            return new Date().toISOString().slice(0, 10);
        }

        function setFlash(msg, type = 'success') { flash = { msg, type }; }

        function go(r, param = null) {
            route = r;
            routeParam = param;
            render();
        }

        function isAdmin() {
            return session && session.isAdmin === true;
        }

        function getPendingCount() {
            return db.servants.filter(s => s.isPending === true).length;
        }

        // ============ RENDER NAV ============
        function renderNav() {
            const nav = document.getElementById('nav');
            let html = `
                <button class="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع">
                    <i class="fas ${currentTheme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i>
                </button>
            `;
            if (session) {
                const isActive = session.isAdmin ? true : false;
                const isAdminUser = session.isAdmin || false;
                const pendingCount = getPendingCount();
                html += `
                    <span class="who">
                        <i class="fas fa-user-circle"></i> ${esc(session.name)}
                        <span class="status-badge admin">أدمن</span>
                    </span>
                    <a href="#" onclick="go('admin');return false;"><i class="fas fa-shield-alt"></i> لوحة الأدمن ${pendingCount > 0 ? `<span class="notification-badge">${pendingCount}</span>` : ''}</a>
                    <button class="linklike" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
                `;
            } else {
                html += `
                    <a href="#" onclick="go('adminLogin');return false;"><i class="fas fa-shield-alt"></i> دخول الأدمن</a>
                    <a href="#" onclick="go('home');return false;"><i class="fas fa-home"></i> الصفحة الرئيسية</a>
                `;
            }
            nav.innerHTML = html;
        }

        function logout() {
            session = null;
            clearSession();
            go('home');
        }

        // ============ ALERT ============
        function alertHtml() {
            if (!flash) return '';
            const icon = flash.type === 'success' ? 'fa-check-circle' :
                flash.type === 'warning' ? 'fa-exclamation-triangle' :
                flash.type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle';
            const html =
                `<div class="alert alert-${flash.type || 'success'}"><i class="fas ${icon}"></i> ${esc(flash.msg)}</div>`;
            flash = null;
            return html;
        }

        // ============ PAGES ============
        function viewHome() {
            return `
                ${alertHtml()}
                <section style="text-align:center;padding:40px 0;">
                    <div style="font-size:4rem;color:#6a1b9a;animation:float 6s ease-in-out infinite;display:inline-block;">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1 style="font-size:3rem;background:var(--admin-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
                        لوحة تحكم الأدمن
                    </h1>
                    <p style="color:var(--text-muted);max-width:600px;margin:10px auto 28px;font-size:1.15rem;">
                        إدارة الخدام، الموافقة على الطلبات الجديدة، وتعيين الخدام للصفوف.
                    </p>
                    <div class="actions" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                        <button class="btn btn-admin" onclick="go('adminLogin')"><i class="fas fa-sign-in-alt"></i> دخول الأدمن</button>
                    </div>
                </section>
                <section class="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:30px;">
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--pending);display:block;margin-bottom:12px;"><i class="fas fa-user-clock"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">طلبات التسجيل</h3>
                        <p style="color:var(--text-muted);">مراجعة طلبات الخدام الجدد والموافقة عليها.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-layer-group"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">تعيين الصفوف</h3>
                        <p style="color:var(--text-muted);">تحديد الصف الذي سيديره كل خادم.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-users"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">إدارة الخدام</h3>
                        <p style="color:var(--text-muted);">تفعيل، إيقاف، حذف الخدام.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-clipboard-list"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">التقارير</h3>
                        <p style="color:var(--text-muted);">مشاهدة جميع سجلات الحضور والغياب.</p>
                    </div>
                </section>`;
        }

        // ---- ADMIN LOGIN ----
        function viewAdminLogin() {
            return `
                <section class="panel" style="max-width:520px;margin:0 auto;">
                    <div class="glass">
                        <div class="admin-login-icon"><i class="fas fa-shield-alt"></i></div>
                        <h2 style="color:#6a1b9a;text-align:center;font-size:2rem;">دخول الأدمن</h2>
                        <p style="color:var(--text-muted);text-align:center;margin-bottom:20px;">هذه الصفحة خاصة بمدير النظام فقط</p>
                        ${alertHtml()}
                        <div id="formMsg"></div>
                        <form class="form" onsubmit="return submitAdminLogin(event)">
                            <label><i class="fas fa-user"></i> اسم المستخدم <input name="username" required autofocus placeholder="أدخل اسم المستخدم" /></label>
                            <label><i class="fas fa-lock"></i> كلمة المرور <input type="password" name="password" required placeholder="أدخل كلمة المرور" /></label>
                            <button class="btn btn-admin" type="submit"><i class="fas fa-shield-alt"></i> دخول الأدمن</button>
                        </form>
                        <p style="margin-top:14px;color:var(--text-muted);text-align:center;">
                            <i class="fas fa-arrow-left"></i> <a href="#" onclick="go('home');return false;">العودة للصفحة الرئيسية</a>
                        </p>
                    </div>
                </section>`;
        }

        async function submitAdminLogin(ev) {
            ev.preventDefault();
            const f = ev.target;
            const username = f.username.value.trim();
            const password = f.password.value;
            const msgBox = document.getElementById('formMsg');

            const servant = db.servants.find(s => s.username === username);
            const hash = await sha256(password);

            if (!servant || servant.passwordHash !== hash) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;
                return false;
            }

            if (!servant.isAdmin) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> هذا الحساب ليس لديه صلاحية أدمن.</div>`;
                return false;
            }

            if (servant.isActive === false) {
                msgBox.innerHTML =
                    `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ⚠️ هذا الحساب موقوف.</div>`;
                return false;
            }

            session = { username: servant.username, name: servant.name, isAdmin: true };
            saveSession(session.username, session.name, session.isAdmin);
            setFlash('✅ تم تسجيل الدخول بنجاح! مرحبًا بك في لوحة الأدمن.');
            go('admin');
            return false;
        }

        // ==============================================================
        // ============ ADMIN PANEL ============
        // ==============================================================
        function viewAdmin() {
            if (!session || !session.isAdmin) {
                setFlash('⛔ هذه الصفحة مخصصة للأدمن فقط.', 'error');
                go('home');
                return '';
            }

            const totalServants = db.servants.length;
            const totalChildren = db.children.length;
            const totalAttendance = db.attendance.length;
            const activeServants = db.servants.filter(s => s.isActive === true && !s.isPending).length;
            const inactiveServants = db.servants.filter(s => s.isActive === false && !s.isPending).length;
            const pendingCount = getPendingCount();
            const adminCount = db.servants.filter(s => s.isAdmin).length;

            return `
                <section>
                    ${alertHtml()}
                    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                        <h2 style="margin:0;"><i class="fas fa-shield-alt" style="color:#6a1b9a;"></i> لوحة تحكم الأدمن</h2>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn btn-admin btn-sm" onclick="exportData()"><i class="fas fa-download"></i> تصدير البيانات</button>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="stats-grid">
                        <div class="stat-card" style="border-color:var(--pending);">
                            <div class="icon" style="color:var(--pending);"><i class="fas fa-user-clock"></i></div>
                            <div class="num" style="color:var(--pending);">${pendingCount}</div>
                            <div class="label">⏳ بانتظار الموافقة</div>
                        </div>
                        <div class="stat-card" style="border-color:var(--ok);">
                            <div class="icon" style="color:var(--ok);"><i class="fas fa-check-circle"></i></div>
                            <div class="num" style="color:var(--ok);">${activeServants}</div>
                            <div class="label">🟢 خدام نشطين</div>
                        </div>
                        <div class="stat-card" style="border-color:var(--bad);">
                            <div class="icon" style="color:var(--bad);"><i class="fas fa-times-circle"></i></div>

                            <div class="label">🔴 خدام موقوفين</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon"><i class="fas fa-users"></i></div>
                            <div class="num">${totalServants}</div>
                            <div class="label">👨‍🏫 إجمالي الخدام</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon"><i class="fas fa-child"></i></div>
                            <div class="num">${totalChildren}</div>
                            <div class="label">🧒 إجمالي الأطفال</div>
                        </div>
                        <div class="stat-card" style="border-color:#6a1b9a;">
                            <div class="icon" style="color:#6a1b9a;"><i class="fas fa-star"></i></div>
                            <div class="num" style="color:#6a1b9a;">${adminCount}</div>
                            <div class="label">⭐ عدد الأدمن</div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab-btn ${activeTab === 'pending' ? 'active' : ''}" onclick="switchTab('pending')">
                            <i class="fas fa-user-clock"></i> طلبات التسجيل ${pendingCount > 0 ? `<span class="notification-badge">${pendingCount}</span>` : ''}
                        </button>
                        <button class="tab-btn ${activeTab === 'servants' ? 'active' : ''}" onclick="switchTab('servants')">
                            <i class="fas fa-users"></i> الخدام
                        </button>
                        <button class="tab-btn ${activeTab === 'children' ? 'active' : ''}" onclick="switchTab('children')">
                            <i class="fas fa-child"></i> الأطفال
                        </button>
                        <button class="tab-btn ${activeTab === 'attendance' ? 'active' : ''}" onclick="switchTab('attendance')">
                            <i class="fas fa-clipboard-list"></i> سجلات الحضور
                        </button>
                    </div>

                    <!-- Pending Tab -->
                    <div class="tab-content ${activeTab === 'pending' ? 'active' : ''}" id="tab-pending">
                        ${renderPendingTab()}

                    <div class="tab-content ${activeTab === 'servants' ? 'active' : ''}" id="tab-servants">

                    <!-- Children Tab -->
                    <div class="tab-content ${activeTab === 'children' ? 'active' : ''}" id="tab-children">
                        ${renderChildrenTab()}
                    </div>

                    <!-- Attendance Tab -->
                    <div class="tab-content ${activeTab === 'attendance' ? 'active' : ''}" id="tab-attendance">
                        ${renderAttendanceTab()}
                    </div>
                </section>
            `;
        }

        // ===== PENDING TAB =====
        function renderPendingTab() {
            const pendingServants = db.servants.filter(s => s.isPending === true);

            if (pendingServants.length === 0) {
                return `
                    <div class="glass">
                        <h3><i class="fas fa-check-circle" style="color:var(--ok);"></i> لا توجد طلبات تسجيل معلقة</h3>
                        <p style="color:var(--text-muted);">جميع الطلبات تمت مراجعتها.</p>

                `;

                return `
                    <tr>
                        <td><i class="fas fa-user-circle" style="color:var(--pending);"></i> ${esc(s.name)}</td>
                        <td><code style="background:var(--bg-glass);padding:2px 12px;border-radius:12px;">${esc(s.username)}</code></td>

                                    ${CLASSES.map(c => `<option value="${c}">${c}</option>`).join('')}

                                <button class="btn btn-sm btn-ok" onclick="approveServant('${s.username}')">

                                </button>
                                <button class="btn btn-sm btn-bad" onclick="rejectServant('${s.username}')">
                                    <i class="fas fa-times"></i> رفض
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="glass">
                    <h3><i class="fas fa-user-clock" style="color:var(--pending);"></i> طلبات التسجيل المعلقة (${pendingServants.length})</h3>

                            <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الحالة</th><th>انتظار</th><th>إجراءات</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>

        // ===== SERVANTS TAB =====
        function renderServantsTab() {
            const servants = db.servants.filter(s => !s.isPending);

            const rows = servants.map(s => {
                const childCount = db.children.filter(c => c.servantUsername === s.username).length;
                const isActive = s.isActive === true;
                const isAdminUser = s.isAdmin || false;
                const assignedClass = s.assignedClass || 'غير محدد';
                return `
                    <tr>
                        <td><i class="fas fa-user-circle" style="color:var(--sky-dark);"></i> ${esc(s.name)}</td>
                        <td><code style="background:var(--bg-glass);padding:2px 12px;border-radius:12px;">${esc(s.username)}</code></td>

                                ${isActive ? '🟢 نشط' : '🔴 موقوف'}

                                    <option value="">تغيير الصف</option>
                                    ${CLASSES.map(c => `<option value="${c}" ${c === s.assignedClass ? 'selected' : ''}>${c}</option>`).join('')}

                                <button class="btn btn-sm btn-secondary" onclick="updateServantClass('${s.username}')"><i class="fas fa-save"></i></button>

                                ${!isAdminUser ? `<button class="btn btn-sm btn-gold" onclick="makeAdmin('${s.username}')"><i class="fas fa-star"></i></button>` : ''}

                        </table>

        function renderChildrenTab() {
            const rows = db.children.map(c => {
                const servant = db.servants.find(s => s.username === c.servantUsername);
                const attendanceCount = db.attendance.filter(a => a.childId === c.id).length;

                    <tr>
                        <td><i class="fas fa-user-graduate" style="color:var(--sky-dark);"></i> ${esc(c.name)}</td>
                        <td>${esc(c.className)}</td>
                        <td><code class="code-pill">${esc(c.code)}</code></td>
                        <td>${servant ? esc(servant.name) + ' (' + esc(servant.assignedClass || 'غير محدد') + ')' : '❓ غير معروف'}</td>
                        <td>${attendanceCount} سجل</td>
                        <td>
                            <button class="btn btn-sm btn-bad" onclick="adminDeleteChild('${c.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="glass">
                    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
                        <h3 style="margin:0;"><i class="fas fa-child"></i> قائمة جميع الأطفال (${db.children.length})</h3>
                    </div>
                    ${db.children.length === 0 ? `<p class="empty"><i class="fas fa-inbox"></i> لا يوجد أطفال</p>` : `
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>الاسم</th><th>الفصل</th><th>الكود</th><th>الخادم المسؤول</th><th>سجلات الحضور</th><th>إجراءات</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`}
                </div>
            `;
        }

        // ===== ATTENDANCE TAB =====
        function renderAttendanceTab() {
            const records = db.attendance.slice().sort((a, b) => b.weekDate.localeCompare(a.weekDate)).slice(0, 100);
            const rows = records.map(a => {
                const child = db.children.find(c => c.id === a.childId);
                const servant = child ? db.servants.find(s => s.username === child.servantUsername) : null;
                return `
                    <tr>
                        <td>${child ? esc(child.name) : '❓ محذوف'}</td>
                        <td>${child ? esc(child.className) : '—'}</td>
                        <td>${servant ? esc(servant.name) : '—'}</td>
                        <td>${esc(a.weekDate)}</td>
                        <td><span class="badge ${a.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(a.status)}</span></td>
                        <td>${esc(a.note || '—')}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="glass">
                    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
                        <h3 style="margin:0;"><i class="fas fa-clipboard-list"></i> سجلات الحضور (آخر 100)</h3>
                    </div>
                    ${db.attendance.length === 0 ? `<p class="empty"><i class="fas fa-inbox"></i> لا يوجد سجلات حضور</p>` : `
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>الطفل</th><th>الفصل</th><th>الخادم</th><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`}
                </div>
            `;
        }

        // ===== ADMIN ACTIONS =====

        // Approve a servant
        async function approveServant(username) {
            if (!session || !session.isAdmin) return;

            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;

            const classSelect = document.getElementById(`classSelect_${username}`);
            const assignedClass = classSelect ? classSelect.value : '';

            if (!assignedClass) {
                setFlash('⚠️ يرجى اختيار الصف للخادم.', 'warning');
                render();
                return;
            }

            servant.isPending = false;
            servant.isActive = true;
            servant.assignedClass = assignedClass;
            await saveDB();
            setFlash(`✅ تمت الموافقة على "${servant.name}" وتعيينه لصف "${assignedClass}".`);
            render();
        }

        // Reject a servant
        async function rejectServant(username) {
            if (!session || !session.isAdmin) return;

            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;

            if (!confirm(`⚠️ هل أنت متأكد من رفض طلب "${servant.name}"؟ سيتم حذف حسابه.`)) return;

            db.servants = db.servants.filter(s => s.username !== username);
            await saveDB();
            setFlash(`🗑️ تم رفض طلب "${servant.name}" وحذف حسابه.`);
            render();
        }

        // Update servant's assigned class
        async function updateServantClass(username) {
            if (!session || !session.isAdmin) return;

            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;

            const classSelect = document.getElementById(`classEdit_${username}`);
            const assignedClass = classSelect ? classSelect.value : '';

            if (!assignedClass) {
                setFlash('⚠️ يرجى اختيار الصف.', 'warning');
                render();
                return;
            }

            servant.assignedClass = assignedClass;
            await saveDB();
            setFlash(`✅ تم تحديث صف "${servant.name}" إلى "${assignedClass}".`);
            render();
        }

        // Toggle servant status
        async function toggleServantStatus(username) {
            if (!session || !session.isAdmin) return;
            if (username === 'admin') {
                setFlash('⚠️ لا يمكن تغيير حالة الأدمن الأساسي.', 'warning');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;
            if (servant.isAdmin) {
                setFlash('⚠️ لا يمكن تغيير حالة الأدمن.', 'warning');
                render();
                return;
            }

            servant.isActive = !servant.isActive;
            await saveDB();
            setFlash(`✅ تم ${servant.isActive ? 'تفعيل' : 'إيقاف'} حساب "${servant.name}".`);
            render();
        }

        // Delete servant
        async function deleteServant(username) {
            if (!session || !session.isAdmin) return;
            if (username === 'admin') {
                setFlash('⚠️ لا يمكن حذف الأدمن الأساسي.', 'warning');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;
            if (servant.isAdmin) {
                setFlash('⚠️ لا يمكن حذف الأدمن.', 'warning');
                render();
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من حذف الخادم "${servant.name}" وجميع أطفاله وسجلاتهم؟ لا يمكن التراجع.`)) return;

            const childIds = db.children.filter(c => c.servantUsername === username).map(c => c.id);
            db.children = db.children.filter(c => c.servantUsername !== username);
            db.attendance = db.attendance.filter(a => !childIds.includes(a.childId));
            db.servants = db.servants.filter(s => s.username !== username);
            await saveDB();
            setFlash(`🗑️ تم حذف الخادم "${servant.name}" وجميع بياناته.`);
            render();
        }

        // Make admin
        async function makeAdmin(username) {
            if (!session || !session.isAdmin) return;
            if (username === 'admin') {
                setFlash('⚠️ هذا الأدمن الأساسي بالفعل.', 'info');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) return;
            if (servant.isAdmin) {
                setFlash('⚠️ هذا الخادم أدمن بالفعل.', 'info');
                render();
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من ترقية "${servant.name}" إلى أدمن؟ سيحصل على صلاحية التحكم الكامل.`)) return;

            servant.isAdmin = true;
            await saveDB();
            setFlash(`✅ تم ترقية "${servant.name}" إلى أدمن.`);
            render();
        }

        // Admin delete child
        async function adminDeleteChild(childId) {
            if (!session || !session.isAdmin) return;
            const child = db.children.find(c => c.id === childId);
            if (!child) return;
            if (!confirm(`⚠️ هل أنت متأكد من حذف "${child.name}"؟ سيتم حذف سجلات حضوره.`)) return;

            db.children = db.children.filter(c => c.id !== childId);
            db.attendance = db.attendance.filter(a => a.childId !== childId);
            await saveDB();
            setFlash(`🗑️ تم حذف "${child.name}" بنجاح.`);
            render();
        }

        // Switch tab
        function switchTab(tab) {
            activeTab = tab;
            render();
        }

        // Export data
        function exportData() {
            const data = JSON.stringify(db, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `data-export-${todayDate()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            setFlash('✅ تم تصدير البيانات بنجاح.', 'success');
            setTimeout(() => render(), 500);
        }

        // ============ RENDER ENGINE ============
        function render() {
            renderNav();
            const app = document.getElementById('app');

            if (session) {
                const servant = db.servants.find(s => s.username === session.username);
                if (!servant || servant.isActive === false) {
                    setFlash('⚠️ تم إيقاف حسابك.', 'warning');
                    session = null;
                    clearSession();
                    route = 'home';
                } else {
                    session.isAdmin = servant.isAdmin || false;
                }
            }

            if (route === 'admin' && (!session || !session.isAdmin)) {
                setFlash('⛔ هذه الصفحة مخصصة للأدمن فقط.', 'error');
                route = 'home';
            }

            switch (route) {
                case 'home':
                    app.innerHTML = viewHome();
                    break;
                case 'adminLogin':
                    app.innerHTML = viewAdminLogin();
                    break;
                case 'admin':
                    app.innerHTML = viewAdmin();
                    break;
                default:
                    app.innerHTML = viewHome();
            }
        }

        // ============ INIT ============
        (async function init() {
            await loadDB();
            applyTheme(currentTheme);

            const savedSession = loadSession();
            if (savedSession) {
                const servant = db.servants.find(s => s.username === savedSession.username);
                if (servant && servant.isActive !== false && servant.isAdmin) {
                    session = {
                        username: servant.username,
                        name: servant.name,
                        isAdmin: true
                    };
                    if (route === 'home' || route === 'adminLogin') {
                        route = 'admin';
                    }
                } else {
                    clearSession();
                }
            }

            render();
            watchDB();
        })();

        // ============ EXPOSE FUNCTIONS ============
        Object.assign(window, {
            go,
            logout,
            submitAdminLogin,
            toggleTheme,
            switchTab,
            exportData,
            approveServant,
            rejectServant,
            toggleServantStatus,
            deleteServant,
            makeAdmin,
            adminDeleteChild,
            updateServantClass,
        });
    </script>
</body>
</html>
