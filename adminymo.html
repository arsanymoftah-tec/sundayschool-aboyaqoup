<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة مدارس الأحد - لوحة الأدمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f0f8ff;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-glass-hover: rgba(255, 255, 255, 0.75);
            --text-primary: #0a1a2f;
            --text-secondary: #1a3a5c;
            --text-muted: #5a7a9a;
            --sky-dark: #2196f3;
            --sky-gradient: linear-gradient(145deg, #b3e0ff, #4fc3f7);
            --shadow: 0 8px 32px rgba(33, 150, 243, 0.15);
            --shadow-hover: 0 16px 48px rgba(33, 150, 243, 0.25);
            --border-glass: rgba(33, 150, 243, 0.2);
            --ok: #2e7d32;
            --bad: #c62828;
            --gold: #f9a825;
            --pending: #f57c00;
            --admin-gradient: linear-gradient(135deg, #6a1b9a, #4a148c);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            --sidebar-width: 280px;
            --sidebar-collapsed: 0px;
        }

        [data-theme="dark"] {
            --bg-primary: #0a1628;
            --bg-secondary: #13203a;
            --bg-glass: rgba(20, 40, 80, 0.6);
            --bg-glass-hover: rgba(30, 60, 120, 0.75);
            --text-primary: #e8f4fd;
            --text-secondary: #b0d4f0;
            --text-muted: #7a9ab8;
            --sky-dark: #64b5f6;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
            --border-glass: rgba(100, 181, 246, 0.2);
            --ok: #66bb6a;
            --bad: #ef5350;
            --gold: #ffd54f;
            --pending: #ffa726;
        }

        body {
            font-family: 'El Messiri', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(100, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(33, 150, 243, 0.06) 0%, transparent 50%);
            animation: floatBubbles 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBubbles {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-5%, 5%) scale(1.05);
            }
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Lalezar', cursive;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 0.4em;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 28px 32px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .glass:hover {
            background: var(--bg-glass-hover);
            border-color: var(--sky-dark);
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }

        .glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ===== SIDEBAR ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--border-glass);
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            padding: 24px 20px;
            transition: right 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
        }

        .sidebar-header .brand-text {
            font-family: 'Lalezar', cursive;
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .sidebar-header .brand-text .mark {
            color: var(--sky-dark);
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sidebar-close:hover {
            transform: rotate(90deg);
            color: var(--bad);
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 4px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 16px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.95rem;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: var(--bg-glass-hover);
            color: var(--sky-dark);
            border: 1px solid var(--border-glass);
        }

        .sidebar-menu a i {
            width: 24px;
            text-align: center;
            font-size: 1.1rem;
        }

        .sidebar-menu .badge-count {
            background: var(--bad);
            color: #fff;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 22px;
            text-align: center;
            line-height: 22px;
            margin-right: auto;
        }

        .sidebar-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-glass);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ===== HEADER ===== */
        header.top {
            padding: 12px 0;
            margin-bottom: 24px;
            position: relative;
            z-index: 2;
        }

        header.top .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            font-family: 'Lalezar', cursive;
            font-size: 2rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: var(--transition);
        }

        .brand:hover {
            transform: scale(1.02);
        }

        .brand .mark {
            color: var(--sky-dark);
            font-size: 2.4rem;
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(33, 150, 243, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 24px rgba(33, 150, 243, 0.6));
            }
        }

        .brand .sky-text {
            background: var(--sky-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand .admin-badge {
            font-size: 0.8rem;
            background: var(--admin-gradient);
            color: #fff;
            padding: 2px 16px;
            border-radius: 40px;
            -webkit-text-fill-color: #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-toggle {
            display: none;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 40px;
            padding: 8px 14px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .menu-toggle:hover {
            background: var(--sky-dark);
            border-color: var(--sky-dark);
            color: #fff;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a,
        nav button.linklike {
            color: var(--text-secondary);
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a:hover,
        nav button.linklike:hover {
            background: var(--sky-dark);
            border-color: var(--sky-dark);
            color: #fff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(33, 150, 243, 0.3);
        }

        nav .who {
            color: var(--text-secondary);
            padding: 6px 18px;
            background: var(--bg-glass);
            border-radius: 40px;
            font-weight: 600;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.active {
            background: rgba(46, 125, 50, 0.2);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .status-badge.admin {
            background: rgba(106, 27, 154, 0.2);
            color: #6a1b9a;
            border: 1px solid rgba(106, 27, 154, 0.3);
        }

        .theme-toggle {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.2rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            background: var(--sky-dark);
            border-color: var(--sky-dark);
            color: #fff;
            transform: rotate(20deg);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 50px;
            border: none;
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4fc3f7, #2196f3);
            color: #fff;
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(33, 150, 243, 0.5);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(8px);
        }

        .btn-secondary:hover {
            background: var(--sky-dark);
            color: #fff;
            border-color: var(--sky-dark);
            transform: translateY(-3px);
        }

        .btn-admin {
            background: var(--admin-gradient);
            color: #fff;
            box-shadow: 0 4px 20px rgba(106, 27, 154, 0.35);
        }

        .btn-admin:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(106, 27, 154, 0.5);
        }

        .btn-ok {
            background: rgba(46, 125, 50, 0.15);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .btn-ok:hover {
            background: var(--ok);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-bad {
            background: rgba(198, 40, 40, 0.15);
            color: var(--bad);
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .btn-bad:hover {
            background: var(--bad);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd54f, #f9a825);
            color: #0a1628;
            box-shadow: 0 4px 20px rgba(249, 168, 37, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 32px rgba(249, 168, 37, 0.5);
        }

        .btn-pending {
            background: rgba(245, 124, 0, 0.15);
            color: var(--pending);
            border: 1px solid rgba(245, 124, 0, 0.3);
        }

        .btn-pending:hover {
            background: var(--pending);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 0.8rem;
        }

        .btn-xs {
            padding: 3px 10px;
            font-size: 0.7rem;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 18px;
            text-align: center;
            transition: var(--transition);
            cursor: default;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--sky-dark);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .num {
            font-size: 2.4rem;
            font-family: 'Lalezar', cursive;
            color: var(--sky-dark);
            line-height: 1;
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .stat-card .icon {
            font-size: 1.5rem;
            color: var(--sky-dark);
            opacity: 0.3;
            margin-bottom: 4px;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'El Messiri', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: var(--bg-glass-hover);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--sky-dark);
            color: #fff;
            border-color: var(--sky-dark);
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ===== FORMS ===== */
        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex: 1 1 180px;
        }

        input,
        select {
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(8px);
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-primary);
            transition: var(--transition);
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--sky-dark);
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.12);
            background: var(--bg-glass-hover);
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ===== TABLE ===== */
        .table-wrap {
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px;
        }

        [data-theme="dark"] .table-wrap {
            background: rgba(255, 255, 255, 0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border-glass);
            vertical-align: middle;
        }

        th {
            color: var(--sky-dark);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        tr:hover td {
            background: rgba(33, 150, 243, 0.04);
        }

        .badge {
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-ok {
            background: rgba(46, 125, 50, 0.15);
            color: var(--ok);
            border: 1px solid rgba(46, 125, 50, 0.2);
        }

        .badge-bad {
            background: rgba(198, 40, 40, 0.15);
            color: var(--bad);
            border: 1px solid rgba(198, 40, 40, 0.2);
        }

        .badge-pending {
            background: rgba(245, 124, 0, 0.15);
            color: var(--pending);
            border: 1px solid rgba(245, 124, 0, 0.2);
        }

        .badge-admin {
            background: rgba(106, 27, 154, 0.15);
            color: #6a1b9a;
            border: 1px solid rgba(106, 27, 154, 0.2);
        }

        .badge-servant {
            background: rgba(33, 150, 243, 0.15);
            color: var(--sky-dark);
            border: 1px solid rgba(33, 150, 243, 0.2);
        }

        .badge-info {
            background: rgba(33, 150, 243, 0.15);
            color: var(--sky-dark);
            border: 1px solid rgba(33, 150, 243, 0.2);
        }

        .code-pill {
            background: rgba(33, 150, 243, 0.1);
            color: var(--sky-dark);
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(33, 150, 243, 0.15);
            font-size: 0.8rem;
            font-family: monospace;
        }

        .empty {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
            font-size: 1rem;
        }

        /* ===== ALERTS ===== */
        .alert {
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(46, 125, 50, 0.12);
            border: 1px solid rgba(46, 125, 50, 0.2);
            color: var(--ok);
        }

        .alert-error {
            background: rgba(198, 40, 40, 0.12);
            border: 1px solid rgba(198, 40, 40, 0.2);
            color: var(--bad);
        }

        .alert-warning {
            background: rgba(245, 124, 0, 0.12);
            border: 1px solid rgba(245, 124, 0, 0.2);
            color: var(--pending);
        }

        .alert-info {
            background: rgba(33, 150, 243, 0.12);
            border: 1px solid rgba(33, 150, 243, 0.2);
            color: var(--sky-dark);
        }

        footer.site {
            text-align: center;
            padding: 30px 0 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-glass);
            margin-top: 50px;
        }

        footer.site strong {
            color: var(--sky-dark);
        }

        .loading {
            text-align: center;
            padding: 80px 0;
            color: var(--text-muted);
            font-size: 1.3rem;
        }

        .admin-login-icon {
            font-size: 4rem;
            color: #6a1b9a;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .notification-badge {
            background: var(--bad);
            color: #fff;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 22px;
            text-align: center;
            line-height: 22px;
            display: inline-block;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .class-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            transition: var(--transition);
            cursor: pointer;

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);

            border: none;

        .modal-close:hover {
            transform: rotate(90deg);
            color: var(--bad);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .menu-toggle {
                display: block;
            }

            nav a,
            nav button.linklike {
                display: none;

            nav .who {

                display: none;

        @media (max-width: 768px) {

                width: 260px;

            .form-row {
                flex-direction: column;
            }
            .form-row label {

        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .stat-card .num {
                font-size: 1.6rem;

                grid-template-columns: 1fr;
            }

                width: 100%;
                border-radius: 0;

        ::-webkit-scrollbar {

        ::-webkit-scrollbar-track {

        }

        ::-webkit-scrollbar-thumb:hover {

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);

        .toast-info {
            background: rgba(33, 150, 243, 0.15);
            color: var(--sky-dark);
            border-color: rgba(33, 150, 243, 0.2);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

    <script type="module">
        /* ============================================================
           Firebase Config
           ============================================================ */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, doc, getDoc, setDoc, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuGob9_AWGsDiAaJgB6XWWye-eEhMBVOo",
            authDomain: "sunday-school-platform-8a08a.firebaseapp.com",
            projectId: "sunday-school-platform-8a08a",
            storageBucket: "sunday-school-platform-8a08a.firebasestorage.app",
            messagingSenderId: "137098154880",
            appId: "1:137098154880:web:c0731bcedfe384aba72765"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const firestore = getFirestore(firebaseApp);
        const dataDocRef = doc(firestore, "sunday-school", "data");

        /* ============ STATE ============ */
        let db = { servants: [], children: [], attendance: [], classes: [] };
        let session = null;
        let route = 'home';
        let routeParam = null;
        let flash = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let activeTab = 'classes';

        // ============ SESSION MANAGEMENT ============
        function saveSession(username, name, isAdmin) {
            localStorage.setItem('session', JSON.stringify({ username, name, isAdmin }));
        }

        function loadSession() {
            try {
                const saved = localStorage.getItem('session');
                if (saved) {
                    const data = JSON.parse(saved);
                    return data;
                }
            } catch (e) {}
            return null;
        }

        function clearSession() {
            localStorage.removeItem('session');
        }

        // ============ DB FUNCTIONS ============
        async function loadDB() {
            try {
                const snap = await getDoc(dataDocRef);
                if (snap.exists()) {
                    db = snap.data().payload;
                } else {
                    db = { servants: [], children: [], attendance: [], classes: [] };
                    await saveDB();
                }
                db.servants = db.servants.map(s => ({
                    ...s,
                    isActive: s.isActive !== undefined ? s.isActive : false,
                    isAdmin: s.isAdmin || false,
                    isPending: s.isPending !== undefined ? s.isPending : false,
                    assignedClass: s.assignedClass || null,
                    pendingSince: s.pendingSince || null
                }));
                if (!db.classes) db.classes = [];
            } catch (e) {
                console.error('❌ تعذر تحميل البيانات', e);
                showToast('تعذر الاتصال بقاعدة البيانات.', 'error');
            }
        }

        async function saveDB() {
            try {
                await setDoc(dataDocRef, { payload: db });
            } catch (e) {
                console.error('❌ تعذر حفظ البيانات', e);
                showToast('حدث خطأ أثناء حفظ البيانات.', 'error');
            }
        }

        function watchDB() {
            onSnapshot(dataDocRef, (snap) => {
                if (snap.exists()) {
                    db = snap.data().payload;
                    db.servants = db.servants.map(s => ({
                        ...s,
                        isActive: s.isActive !== undefined ? s.isActive : false,
                        isAdmin: s.isAdmin || false,
                        isPending: s.isPending !== undefined ? s.isPending : false,
                        assignedClass: s.assignedClass || null,
                        pendingSince: s.pendingSince || null
                    }));
                    if (!db.classes) db.classes = [];
                    render();
                }
            });
        }

        // ============ THEME ============
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            localStorage.setItem('theme', theme);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function toggleTheme() {
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        // ============ TOAST ============
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        // ============ SIDEBAR ============
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============ HELPERS ============
        function esc(s) {
            return (s ?? '').toString()
                .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
        }

        async function sha256(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function genCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code;
            do {
                code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            } while (db.children.some(c => c.code === code));
            return code;
        }

        function todayDate() {
            return new Date().toISOString().slice(0, 10);
        }

        function setFlash(msg, type = 'success') { flash = { msg, type }; }

        function go(r, param = null) {
            route = r;
            routeParam = param;
            render();
        }

        function isAdmin() {
            return session && session.isAdmin === true;
        }

        function getPendingCount() {
            return db.servants.filter(s => s.isPending === true).length;
        }

        function getClassChildren(classId) {
            return db.children.filter(c => c.classId === classId);
        }

        function getClassServants(classId) {
            return db.servants.filter(s => s.assignedClass === classId && !s.isPending);
        }

        function hasAdmin() {
            return db.servants.some(s => s.isAdmin === true);
        }

        // ============ RENDER NAV ============
        function renderNav() {
            const nav = document.getElementById('nav');
            let html = `
                <button class="theme-toggle" onclick="window.toggleTheme()" title="تبديل الوضع">
                    <i class="fas ${currentTheme === 'dark' ? 'fa-sun' : 'fa-moon'}"></i>
                </button>
            `;
            if (session) {
                const pendingCount = getPendingCount();
                html += `
                    <span class="who">
                        <i class="fas fa-user-circle"></i> ${esc(session.name)}
                        <span class="status-badge admin">أدمن</span>
                        ${pendingCount > 0 ? `<span class="notification-badge">${pendingCount}</span>` : ''}
                    </span>
                    <a href="#" onclick="window.go('admin');return false;"><i class="fas fa-shield-alt"></i> لوحة الأدمن</a>
                    <button class="linklike" onclick="window.logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
                `;
            } else {
                html += `
                    <a href="#" onclick="window.go('adminLogin');return false;"><i class="fas fa-shield-alt"></i> دخول الأدمن</a>
                    <a href="#" onclick="window.go('home');return false;"><i class="fas fa-home"></i> الصفحة الرئيسية</a>
                `;
            }
            nav.innerHTML = html;

            // تحديث القائمة الجانبية
            const sidebarMenu = document.getElementById('sidebarMenu');
            if (sidebarMenu && session) {
                const pendingCount = getPendingCount();
                const links = sidebarMenu.querySelectorAll('a');
                links.forEach(link => {
                    link.classList.remove('active');
                });
                // تحديث شارة الإشعارات
                const pendingItem = sidebarMenu.querySelector('a[onclick*="pending"]');
                if (pendingItem) {
                    const badge = pendingItem.querySelector('.badge-count');
                    if (badge) {
                        badge.textContent = pendingCount;
                        badge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
                    }
                }
            }
        }

        function logout() {
            session = null;
            clearSession();
            go('home');
            closeSidebar();
        }

        // ============ ALERT ============
        function alertHtml() {
            if (!flash) return '';
            const icon = flash.type === 'success' ? 'fa-check-circle' :
                flash.type === 'warning' ? 'fa-exclamation-triangle' :
                flash.type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle';
            const html =
                `<div class="alert alert-${flash.type || 'success'}"><i class="fas ${icon}"></i> ${esc(flash.msg)}</div>`;
            flash = null;
            return html;
        }

        // ==============================================================
        // ============ PAGES ============
        // ==============================================================

        function viewHome() {
            const adminExists = hasAdmin();

            return `
                ${alertHtml()}
                <section style="text-align:center;padding:40px 0;">
                    <div style="font-size:4rem;color:#6a1b9a;animation:float 6s ease-in-out infinite;display:inline-block;">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1 style="font-size:3rem;background:var(--admin-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
                        لوحة تحكم الأدمن
                    </h1>
                    <p style="color:var(--text-muted);max-width:600px;margin:10px auto 28px;font-size:1.15rem;">
                        إدارة الصفوف، الخدام، الموافقة على الطلبات، ومتابعة الحضور والغياب.
                    </p>
                    <div class="actions" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                        ${adminExists ? `<button class="btn btn-admin" onclick="window.go('adminLogin')"><i class="fas fa-sign-in-alt"></i> دخول الأدمن</button>` :
                            `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ⚠️ لا يوجد أدمن في النظام. يرجى إضافة أدمن أولاً.</div>`}
                    </div>
                </section>

                <section style="margin-top:40px;">
                    <h2><i class="fas fa-layer-group" style="color:var(--sky-dark);"></i> الصفوف الدراسية</h2>
                    <p style="color:var(--text-muted);">عرض جميع الصفوف مع إحصائياتها</p>
                    ${renderClassesGrid()}
                </section>

                <section class="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:30px;">
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-layer-group"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">إدارة الصفوف</h3>
                        <p style="color:var(--text-muted);">إضافة، تعديل، حذف الصفوف.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--pending);display:block;margin-bottom:12px;"><i class="fas fa-user-clock"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">طلبات التسجيل</h3>
                        <p style="color:var(--text-muted);">مراجعة طلبات الخدام الجدد والموافقة عليها.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-users"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">إدارة الخدام</h3>
                        <p style="color:var(--text-muted);">تفعيل، إيقاف، حذف الخدام وتعيين الصفوف.</p>
                    </div>
                    <div class="card" style="background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:28px;padding:24px;text-align:center;transition:var(--transition);">
                        <span class="icon" style="font-size:2.8rem;color:var(--sky-dark);display:block;margin-bottom:12px;"><i class="fas fa-clipboard-list"></i></span>
                        <h3 style="color:var(--text-primary);font-size:1.4rem;">التقارير</h3>
                        <p style="color:var(--text-muted);">مشاهدة جميع سجلات الحضور والغياب.</p>
                    </div>
                </section>`;
        }

        // ===== عرض الصفوف في شبكة =====
        function renderClassesGrid() {
            const classes = db.classes.sort((a, b) => a.order - b.order);

            if (classes.length === 0) {
                return `<p class="empty"><i class="fas fa-inbox"></i> لا توجد صفوف</p>`;
            }

            return `
                <div class="class-grid">
                    ${classes.map(cls => {
                        const children = getClassChildren(cls.id);
                        const servants = getClassServants(cls.id);
                        const attCount = db.attendance.filter(a => {
                            const child = db.children.find(c => c.id === a.childId);
                            return child && child.classId === cls.id;
                        }).length;
                        return `
                            <div class="class-card" onclick="window.go('classDetail','${cls.id}')">
                                <div class="class-name">${esc(cls.name)}</div>
                                <div class="class-stats">
                                    <i class="fas fa-child"></i> ${children.length} طفل
                                    <i class="fas fa-chalkboard-teacher"></i> ${servants.length} خادم
                                    <i class="fas fa-clipboard-check"></i> ${attCount}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // ===== ADMIN LOGIN =====
        function viewAdminLogin() {
            return `
                <section class="panel" style="max-width:520px;margin:0 auto;">
                    <div class="glass">

        async function submitAdminLogin(ev) {
            ev.preventDefault();
            const f = ev.target;
            const username = f.username.value.trim();
            const password = f.password.value;
            const msgBox = document.getElementById('formMsg');

            const servant = db.servants.find(s => s.username === username);
            const hash = await sha256(password);

            if (!servant || servant.passwordHash !== hash) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;
                return false;
            }

            if (!servant.isAdmin) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> هذا الحساب ليس لديه صلاحية أدمن.</div>`;
                return false;
            }

            if (servant.isActive === false) {
                msgBox.innerHTML =
                    `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ⚠️ هذا الحساب موقوف.</div>`;
                return false;
            }

            session = { username: servant.username, name: servant.name, isAdmin: true };
            saveSession(session.username, session.name, session.isAdmin);
            showToast('✅ تم تسجيل الدخول بنجاح! مرحبًا بك في لوحة الأدمن.', 'success');
            go('admin');
            return false;
        }

        // ===== MODAL: تعديل الصف =====
        function openEditClassModal(classId) {
            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return;

            const modal = document.getElementById('editClassModal');
            document.getElementById('editClassId').value = cls.id;
            document.getElementById('editClassName').value = cls.name;
            document.getElementById('editClassOrder').value = cls.order;
            modal.classList.add('active');
        }

        function closeEditClassModal() {
            document.getElementById('editClassModal').classList.remove('active');
        }

        async function submitEditClass(ev) {
            ev.preventDefault();
            const f = ev.target;
            const classId = f.classId.value;
            const name = f.className.value.trim();
            const order = parseInt(f.classOrder.value);

            if (!name) {
                showToast('⚠️ أدخل اسم الصف.', 'warning');
                return false;
            }

            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return false;

            // التحقق من عدم تكرار الاسم
            const duplicate = db.classes.some(c => c.name === name && c.id !== classId);
            if (duplicate) {
                showToast('⚠️ هذا الصف موجود بالفعل.', 'warning');
                return false;
            }

            cls.name = name;
            cls.order = order;
            await saveDB();
            closeEditClassModal();
            showToast(`✅ تم تحديث الصف "${name}" بنجاح.`, 'success');
            render();
            return false;
        }

        async function submitAddServant(ev) {
            ev.preventDefault();
            if (!session || !session.isAdmin) return false;

            const f = ev.target;
            const name = f.name.value.trim();
            const username = f.username.value.trim();
            const password = f.password.value;
            const confirm = f.confirm.value;
            const classId = f.classId.value || null;
            const isActive = f.isActive.checked;
            const isAdmin = f.isAdmin.checked;
            const msgBox = document.getElementById('addServantMsg');

            if (!name || !username || !password) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أكمل جميع الحقول.</div>`;
                return false;
            }
            if (password !== confirm) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> كلمتا المرور غير متطابقتين.</div>`;
                return false;
            }
            if (password.length < 6) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> كلمة المرور 6 أحرف على الأقل.</div>`;
                return false;
            }
            if (db.servants.some(s => s.username === username)) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> اسم المستخدم مستخدم بالفعل.</div>`;
                return false;
            }

            const passwordHash = await sha256(password);
            db.servants.push({
                name,
                username,
                passwordHash,
                isActive: isActive,
                isAdmin: isAdmin,
                isPending: false,
                assignedClass: classId,
                pendingSince: null
            });
            await saveDB();
            const statusMsg = isActive ? 'مفعل' : 'موقوف';
            const roleMsg = isAdmin ? 'أدمن' : 'خادم';
            msgBox.innerHTML =
                `<div class="alert alert-success"><i class="fas fa-check-circle"></i> ✅ تم إضافة "${name}" كـ ${roleMsg} (${statusMsg}) بنجاح.</div>`;
            showToast(`✅ تم إضافة "${name}" كـ ${roleMsg}`, 'success');
            setTimeout(() => { window.switchTab('servants');
                render(); }, 1500);
            return false;
        }

            const classId = f.classId.value;

        // ==============================================================
        // ===== ADMIN ACTIONS =====
        // ==============================================================

        window.approveServant = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }

            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }

            const classSelect = document.getElementById(`classSelect_${username}`);
            const assignedClassId = classSelect ? classSelect.value : '';

            if (!assignedClassId) {
                showToast('⚠️ يرجى اختيار الصف للخادم.', 'warning');
                render();
                return;
            }

            try {
                servant.isPending = false;
                servant.isActive = true;
                servant.assignedClass = assignedClassId;
                await saveDB();
                const cls = db.classes.find(c => c.id === assignedClassId);
                showToast(`✅ تمت الموافقة على "${servant.name}" وتعيينه لصف "${cls ? cls.name : 'غير محدد'}"`, 'success');
                activeTab = 'pending';
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء الموافقة.', 'error');
                render();
            }
        };

        window.rejectServant = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }

            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من رفض طلب "${servant.name}"؟ سيتم حذف حسابه.`)) return;

            try {
                db.servants = db.servants.filter(s => s.username !== username);
                await saveDB();
                showToast(`🗑️ تم رفض طلب "${servant.name}" وحذف حسابه.`, 'success');
                activeTab = 'pending';
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء الرفض.', 'error');
                render();
            }
        };

        window.updateServantClass = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }

            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }

            const classSelect = document.getElementById(`classEdit_${username}`);
            const assignedClassId = classSelect ? classSelect.value : '';

            if (!assignedClassId) {
                showToast('⚠️ يرجى اختيار الصف.', 'warning');
                render();
                return;
            }

            try {
                servant.assignedClass = assignedClassId;
                await saveDB();
                const cls = db.classes.find(c => c.id === assignedClassId);
                showToast(`✅ تم تحديث صف "${servant.name}" إلى "${cls ? cls.name : 'غير محدد'}"`, 'success');
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء التحديث.', 'error');
                render();
            }
        };

        window.toggleServantStatus = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }
            if (username === 'admin') {
                showToast('⚠️ لا يمكن تغيير حالة الأدمن الأساسي.', 'warning');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }
            if (servant.isAdmin) {
                showToast('⚠️ لا يمكن تغيير حالة الأدمن.', 'warning');
                render();
                return;
            }

            try {
                servant.isActive = !servant.isActive;
                await saveDB();
                showToast(`✅ تم ${servant.isActive ? 'تفعيل' : 'إيقاف'} حساب "${servant.name}".`, 'success');
                render();
            } catch (e) {
                showToast('❌ حدث خطأ.', 'error');
                render();
            }
        };

        window.deleteServant = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }
            if (username === 'admin') {
                showToast('⚠️ لا يمكن حذف الأدمن الأساسي.', 'warning');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }
            if (servant.isAdmin) {
                showToast('⚠️ لا يمكن حذف الأدمن.', 'warning');
                render();
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من حذف الخادم "${servant.name}" وجميع أطفاله وسجلاتهم؟ لا يمكن التراجع.`)) return;

            try {
                const childIds = db.children.filter(c => c.servantUsername === username).map(c => c.id);
                db.children = db.children.filter(c => c.servantUsername !== username);
                db.attendance = db.attendance.filter(a => !childIds.includes(a.childId));
                db.servants = db.servants.filter(s => s.username !== username);
                await saveDB();
                showToast(`🗑️ تم حذف الخادم "${servant.name}" وجميع بياناته.`, 'success');
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء الحذف.', 'error');
                render();
            }
        };

        window.makeAdmin = async function(username) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }
            if (username === 'admin') {
                showToast('⚠️ هذا الأدمن الأساسي بالفعل.', 'info');
                render();
                return;
            }
            const servant = db.servants.find(s => s.username === username);
            if (!servant) {
                showToast('❌ الخادم غير موجود.', 'error');
                render();
                return;
            }
            if (servant.isAdmin) {
                showToast('⚠️ هذا الخادم أدمن بالفعل.', 'info');
                render();
                return;
            }

            if (!confirm(`⚠️ هل أنت متأكد من ترقية "${servant.name}" إلى أدمن؟ سيحصل على صلاحية التحكم الكامل.`)) return;

            try {
                servant.isAdmin = true;
                await saveDB();
                showToast(`✅ تم ترقية "${servant.name}" إلى أدمن.`, 'success');
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء الترقية.', 'error');
                render();
            }
        };

        window.adminDeleteChild = async function(childId) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                render();
                return;
            }
            const child = db.children.find(c => c.id === childId);
            if (!child) {
                showToast('❌ الطفل غير موجود.', 'error');
                render();
                return;
            }
            if (!confirm(`⚠️ هل أنت متأكد من حذف "${child.name}"؟ سيتم حذف سجلات حضوره.`)) return;

            try {
                db.children = db.children.filter(c => c.id !== childId);
                db.attendance = db.attendance.filter(a => a.childId !== childId);
                await saveDB();
                showToast(`🗑️ تم حذف "${child.name}" بنجاح.`, 'success');
                render();
            } catch (e) {
                showToast('❌ حدث خطأ أثناء الحذف.', 'error');
                render();
            }
        };

        window.switchTab = function(tab) {
            activeTab = tab;
            render();
            // إغلاق القائمة الجانبية في الأجهزة الصغيرة
            if (window.innerWidth <= 992) {
                closeSidebar();
            }
        };

        window.exportData = function() {
            const data = JSON.stringify(db, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `data-export-${todayDate()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ تم تصدير البيانات بنجاح.', 'success');
        };

        // ==============================================================
        // ===== ADD CLASS =====
        // ==============================================================
        window.submitAddClass = async function(ev) {
            ev.preventDefault();
            if (!session || !session.isAdmin) return false;

            const f = ev.target;
            const name = f.className.value.trim();
            const order = parseInt(f.order.value) || db.classes.length + 1;
            const msgBox = document.getElementById('addClassMsg');

            if (!name) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أدخل اسم الصف.</div>`;
                return false;
            }

            if (db.classes.some(c => c.name === name)) {
                msgBox.innerHTML =
                    `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> هذا الصف موجود بالفعل.</div>`;
                return false;
            }

            db.classes.push({
                id: 'c' + Date.now(),
                name,
                order
            });
            await saveDB();
            msgBox.innerHTML =
                `<div class="alert alert-success"><i class="fas fa-check-circle"></i> ✅ تم إضافة الصف "${name}" بنجاح.</div>`;
            showToast(`✅ تم إضافة الصف "${name}" بنجاح.`, 'success');
            setTimeout(() => { render(); }, 1000);
            return false;
        };

        // ==============================================================
        // ===== DELETE CLASS =====
        // ==============================================================
        window.deleteClass = async function(classId) {
            if (!session || !session.isAdmin) return;
            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return;

            const children = getClassChildren(classId);
            const servants = getClassServants(classId);

            if (children.length > 0 || servants.length > 0) {
                if (!confirm(`⚠️ هذا الصف يحتوي على ${children.length} طفل و ${servants.length} خادم. هل أنت متأكد من الحذف؟`)) return;
            } else {
                if (!confirm(`⚠️ هل أنت متأكد من حذف الصف "${cls.name}"؟`)) return;
            }

            if (children.length > 0) {
                const otherClass = db.classes.find(c => c.id !== classId);
                if (otherClass) {
                    children.forEach(c => { c.classId = otherClass.id; });
                } else {
                    db.children = db.children.filter(c => c.classId !== classId);
                }
            }

            servants.forEach(s => { s.assignedClass = null; });

            db.classes = db.classes.filter(c => c.id !== classId);
            await saveDB();
            showToast(`🗑️ تم حذف الصف "${cls.name}" بنجاح.`, 'success');
            render();
        };

        // ==============================================================
        // ===== RENDER ENGINE =====
        // ==============================================================
        function render() {
            renderNav();
            const app = document.getElementById('app');

            if (session) {
                const servant = db.servants.find(s => s.username === session.username);
                if (!servant || servant.isActive === false) {
                    if (!servant?.isAdmin) {
                        showToast('⚠️ تم إيقاف حسابك.', 'warning');
                        session = null;
                        clearSession();
                        route = 'home';
                    }
                } else {
                    session.isAdmin = servant?.isAdmin || false;
                }
            }

            if (route === 'admin' && (!session || !session.isAdmin)) {
                showToast('⛔ هذه الصفحة مخصصة للأدمن فقط.', 'error');
                route = 'home';
            }

            if (route === 'classDetail' && routeParam) {
                app.innerHTML = viewClassDetail(routeParam);
                return;
            }

            if (route === 'childReport' && routeParam) {
                app.innerHTML = viewChildReport(routeParam);
                return;
            }

            switch (route) {
                case 'home':
                    app.innerHTML = viewHome();
                    break;
                case 'adminLogin':
                    app.innerHTML = viewAdminLogin();
                    break;
                case 'admin':
                    app.innerHTML = viewAdmin();
                    break;
                default:
                    app.innerHTML = viewHome();
            }
        }

        // ==============================================================
        // ===== INIT =====
        // ==============================================================
        (async function init() {
            await loadDB();
            applyTheme(currentTheme);

            const savedSession = loadSession();
            if (savedSession) {
                const servant = db.servants.find(s => s.username === savedSession.username);
                if (servant && servant.isActive !== false && servant.isAdmin) {
                    session = {
                        username: servant.username,
                        name: servant.name,
                        isAdmin: true
                    };
                    if (route === 'home' || route === 'adminLogin') {
                        route = 'admin';
                    }
                } else {
                    clearSession();
                }
            }

            render();
            watchDB();
        })();

        // ==============================================================
        // ===== EXPOSE ALL FUNCTIONS TO WINDOW =====
        // ==============================================================
        window.go = go;
        window.toggleTheme = toggleTheme;
        window.logout = logout;
        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        window.submitAdminLogin = submitAdminLogin;
        window.submitAddClass = submitAddClass;
        window.submitAddServant = submitAddServant;
        window.submitAdminAddChild = submitAdminAddChild;
        window.submitEditClass = submitEditClass;
        window.openEditClassModal = openEditClassModal;
        window.closeEditClassModal = closeEditClassModal;
        window.approveServant = approveServant;
        window.rejectServant = rejectServant;
        window.updateServantClass = updateServantClass;
        window.toggleServantStatus = toggleServantStatus;
        window.deleteServant = deleteServant;
        window.makeAdmin = makeAdmin;
        window.adminDeleteChild = adminDeleteChild;
        window.deleteClass = deleteClass;
        window.switchTab = switchTab;
        window.exportData = exportData;
        window.showToast = showToast;
        window.viewClassDetail = viewClassDetail;
        window.viewChildReport = viewChildReport;
    </script>

    <!-- ===== MODAL: EDIT CLASS ===== -->
    <div class="modal-overlay" id="editClassModal">
        <div class="modal glass">
            <div class="modal-header">
                <h3><i class="fas fa-edit" style="color:var(--sky-dark);"></i> تعديل الصف</h3>
                <button class="modal-close" onclick="window.closeEditClassModal()"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return window.submitEditClass(event)">
                <input type="hidden" name="classId" id="editClassId" />
                <div class="form-row">
                    <label>اسم الصف <input type="text" name="className" id="editClassName" required /></label>
                    <label>الترتيب <input type="number" name="classOrder" id="editClassOrder" min="1" required /></label>
                </div>
                <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> حفظ التغييرات</button>
            </form>
        </div>
    </div>
</body>
</html>
