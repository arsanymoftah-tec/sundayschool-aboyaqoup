                        <td>${lastAtt ? esc(lastAtt.weekDate) + ' (' + esc(lastAtt.status) + ')' : 'لا يوجد'}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="window.viewStudentExams('${c.id}')"><i class="fas fa-pencil-alt"></i></button>
                            <button class="btn btn-sm btn-secondary" onclick="window.go('childReport','${c.id}')"><i class="fas fa-eye"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            const servantsRows = servants.map(s => {
                const childCount = db.children.filter(c => c.servantUsername === s.username).length;
                return `
                    <tr>
                        <td><i class="fas fa-user-circle" style="color:#6a1b9a;"></i> ${esc(s.name)}</td>
                        <td><code>${esc(s.username)}</code></td>
                        <td>${childCount} طفل</td>
                        <td><span class="badge ${s.isActive ? 'badge-ok' : 'badge-bad'}">${s.isActive ? '🟢 نشط' : '🔴 موقوف'}</span></td>
                    </tr>
                `;
            }).join('');

            const attCount = db.attendance.filter(a => {
                const child = db.children.find(c => c.id === a.childId);
                return child && child.classId === cls.id;
            }).length;

            return `
                <section>
                    <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="window.go('admin')"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <div class="glass" style="border-color:#6a1b9a;">
                        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
                            <div>
                                <h2 style="font-size:1.3rem;margin:0;"><i class="fas fa-layer-group" style="color:#6a1b9a;"></i> ${esc(cls.name)}</h2>
                                <p style="color:var(--text-muted);font-size:0.8rem;">الترتيب: ${cls.order}</p>
                            </div>
                            <div>
                                <span class="badge badge-info"><i class="fas fa-child"></i> ${children.length} طفل</span>
                                <span class="badge badge-info"><i class="fas fa-chalkboard-teacher"></i> ${servants.length} خادم</span>
                                <span class="badge badge-info"><i class="fas fa-clipboard-check"></i> ${attCount} حضور</span>
                            </div>
                        </div>
                    </div>

                    <h3 style="font-size:1.1rem;margin-top:16px;"><i class="fas fa-child"></i> أطفال الصف</h3>
                    ${children.length === 0 ? `<p class="empty">لا يوجد أطفال</p>` : `
                    <div class="glass table-wrap">
                        <table>
                            <thead><tr><th>الاسم</th><th>الكود</th><th>سجلات</th><th>آخر حضور</th><th></th></tr></thead>
                            <tbody>${childrenRows}</tbody>
                        </table>
                    </div>`}

                    <h3 style="font-size:1.1rem;margin-top:16px;"><i class="fas fa-chalkboard-teacher"></i> الخدام المسؤولين</h3>
                    ${servants.length === 0 ? `<p class="empty">لا يوجد خدام</p>` : `
                    <div class="glass table-wrap">
                        <table>
                            <thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الأطفال</th><th>الحالة</th></tr></thead>
                            <tbody>${servantsRows}</tbody>
                        </table>
                    </div>`}
                </section>
            `;
        }

        // CHILD REPORT
        function viewChildReport(childId) {
            const child = db.children.find(c => c.id === childId);
            if (!child) { showToast('❌ الطفل غير موجود.', 'error'); go('admin'); return ''; }

            const records = db.attendance.filter(a => a.childId === child.id).sort((a, b) => b.weekDate.localeCompare(a.weekDate));
            const presentDates = records.filter(r => r.status === 'حاضر').map(r => r.weekDate);
            const absentDates = records.filter(r => r.status === 'غائب').map(r => r.weekDate);
            const cls = db.classes.find(c => c.id === child.classId);
            const servant = db.servants.find(s => s.username === child.servantUsername);

            const rows = records.map(r => `
                <tr>
                    <td>${esc(r.weekDate)}</td>
                    <td><span class="badge ${r.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(r.status)}</span></td>
                    <td>${esc(r.note || '—')}</td>
                </tr>`).join('');

            return `
                <section>
                    <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="window.go('admin')"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <div class="glass">
                        <h2 style="font-size:1.3rem;"><i class="fas fa-user-graduate" style="color:#6a1b9a;"></i> ${esc(child.name)}</h2>
                        <p style="font-size:0.85rem;"><i class="fas fa-layer-group"></i> الصف: ${cls ? esc(cls.name) : 'غير محدد'}</p>
                        <p style="font-size:0.85rem;"><i class="fas fa-user-circle"></i> الخادم: ${servant ? esc(servant.name) : 'غير معروف'}</p>
                        <p style="font-size:0.85rem;"><i class="fas fa-key"></i> الكود: <code class="code-pill">${esc(child.code)}</code></p>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                        <button class="btn btn-sm btn-secondary" onclick="window.viewStudentExams('${child.id}')"><i class="fas fa-pencil-alt"></i> الاختبارات</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--ok);font-size:0.9rem;"><i class="fas fa-check-circle"></i> الحضور (${presentDates.length})</h4>
                            <div style="font-size:0.8rem;">${presentDates.length ? presentDates.map(d => `<span class="badge badge-ok" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--bad);font-size:0.9rem;"><i class="fas fa-times-circle"></i> الغياب (${absentDates.length})</h4>
                            <div style="font-size:0.8rem;">${absentDates.length ? absentDates.map(d => `<span class="badge badge-bad" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                    </div>
                    <h3 style="font-size:1.1rem;margin-top:16px;"><i class="fas fa-history"></i> السجل التفصيلي</h3>
                    ${records.length === 0 ? `<p class="empty">لا يوجد سجلات</p>` : `
                    <div class="glass table-wrap">
                        <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
                    </div>`}
                </section>
            `;
        }

        // CHAT
        function viewChat() {
            if (!session || !session.isAdmin) { go('adminLogin'); return ''; }

            const user = getServantByUsername(session.username);
            const rooms = getChatRooms(user);
            const currentRoomId = routeParam || (rooms.length > 0 ? rooms[0].id : null);

            if (currentRoomId) markAsRead(currentRoomId, session.username);

            currentChat = currentRoomId;

            let chatListHtml = '';
            if (rooms.length === 0) {
                chatListHtml = `<div class="empty"><i class="fas fa-inbox" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>لا توجد محادثات</div>`;
            } else {
                rooms.forEach(room => {
                    const isActiveRoom = room.id === currentRoomId;
                    let displayName = room.name || 'محادثة';
                    let displayIcon = 'fas fa-user';
                    let avatarClass = '';

                    if (room.type === 'admin-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                        displayIcon = 'fas fa-chalkboard-teacher';
                    } else if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                    }

                    const unread = room.unreadCount ? (room.unreadCount[session.username] || 0) : 0;
                    const roomType = room.type === 'admin-admin' ? 'أدمن-أدمن' : 'أدمن-خادم';

                    chatListHtml += `
                        <div class="chat-item ${isActiveRoom ? 'active' : ''}" onclick="window.go('chat','${room.id}')">
                            <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                            <div class="chat-info">
                                <div class="chat-name">${esc(displayName)}</div>
                                <div class="chat-last-msg">${esc(room.lastMessage || 'لا توجد رسائل')}</div>
                            </div>
                            ${unread > 0 ? `<span class="chat-badge">${unread}</span>` : ''}
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                                <div class="chat-time">${new Date(room.lastMessageTime).toLocaleDateString('ar')}</div>
                                <span class="chat-type">${roomType}</span>
                            </div>
                        </div>
                    `;
                });
            }

            let chatAreaHtml = '';
            if (!currentRoomId) {
                chatAreaHtml = `
                    <div class="chat-empty">
                        <i class="fas fa-comments"></i>
                        <h3 style="font-size:1.1rem;">اختر محادثة</h3>
                        <p style="color:var(--text-muted);font-size:0.85rem;">اختر محادثة من القائمة الجانبية</p>
                    </div>
                `;
            } else {
                const room = db.chatRooms.find(r => r.id === currentRoomId);
                let displayName = 'المحادثة';
                let displayIcon = 'fas fa-user';
                let avatarClass = '';

                if (room) {
                    if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                    } else {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                        displayIcon = 'fas fa-chalkboard-teacher';
                    }
                }

                const messages = room ? getMessages(currentRoomId) : [];

                const messagesHtml = messages.map(msg => {
                    const isOwn = msg.from === session.username;
                    const sender = getServantByUsername(msg.from);
                    const senderName = sender ? sender.name : (msg.from === session.username ? 'أنت' : msg.from);

                    if (msg.type === 'poll' && msg.data) {
                        const poll = msg.data;
                        const totalVotes = poll.options.reduce((sum, o) => sum + o.votes, 0);
                        const hasVoted = poll.voters.includes(session.username);

                        return `
                            <div class="poll-message" style="align-self:${isOwn ? 'flex-end' : 'flex-start'};">
                                ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                                <div class="poll-question">📊 ${esc(poll.question)}</div>
                                ${poll.options.map((opt, idx) => {
                                    const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                                    const voted = hasVoted;
                                    return `
                                        <div class="poll-option ${voted ? 'voted' : ''}" onclick="${!voted ? `window.votePoll('${currentRoomId}','${poll.id}',${idx})` : ''}" style="${voted ? 'cursor:default;' : 'cursor:pointer;'}">
                                            <span style="min-width:16px;">${String.fromCharCode(65 + idx)}.</span>
                                            <span style="flex:1;">${esc(opt.text)}</span>
                                            <div class="poll-bar"><div class="poll-fill" style="width:${percent}%;"></div></div>
                                            <span class="poll-percent">${percent}% (${opt.votes})</span>
                                            ${voted ? '<i class="fas fa-check-circle" style="color:var(--ok);font-size:0.7rem;"></i>' : ''}
                                        </div>
                                    `;
                                }).join('')}
                                <div style="font-size:0.55rem;color:var(--text-muted);margin-top:4px;text-align:left;">
                                    ${totalVotes} صوت ${hasVoted ? '✅ تم التصويت' : ''}
                                    <span style="margin-right:6px;">${new Date(msg.timestamp).toLocaleString('ar')}</span>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="message ${isOwn ? 'own' : 'other'}">
                            ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                            <div class="msg-text">${esc(msg.text)}</div>
                            <div class="msg-time">${new Date(msg.timestamp).toLocaleString('ar')}</div>
                        </div>
                    `;
                }).join('');

                chatAreaHtml = `
                    <div class="chat-header">
                        <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                        <div class="chat-with">${esc(displayName)}</div>
                        <div style="margin-right:auto;display:flex;gap:4px;">
                            <button class="btn btn-sm btn-secondary" onclick="window.openPollModal()" title="استطلاع رأي"><i class="fas fa-poll"></i></button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        ${messagesHtml}
                    </div>
                    <div class="chat-input" style="position:relative;">
                        <div class="emoji-picker" id="emojiPicker">
                            <div class="emoji-grid">
                                ${EMOJIS.map(e => `<span onclick="window.insertEmoji('${e}')">${e}</span>`).join('')}
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <button class="emoji-btn" onclick="window.toggleEmojiPicker()" title="إيموجي"><i class="far fa-smile"></i></button>
                            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') window.sendChatMessage()" />
                            <button class="poll-btn" onclick="window.openPollModal()" title="استطلاع رأي"><i class="fas fa-poll"></i> استطلاع</button>
                            <button class="send-btn" onclick="window.sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
            }

            return `
                <section>
                    <h2 style="font-size:1.3rem;"><i class="fas fa-comment-dots" style="color:#6a1b9a;"></i> المحادثات</h2>
                    ${alertHtml()}
                    <div style="display:flex;gap:16px;height:60vh;min-height:400px;flex-wrap:wrap;">
                        <div style="width:260px;min-width:200px;flex:0 0 auto;overflow-y:auto;padding:4px;" class="glass">
                            <h4 style="padding:6px 10px;margin:0;font-size:0.8rem;color:var(--text-muted);"><i class="fas fa-users"></i> المحادثات (${rooms.length})</h4>
                            ${chatListHtml}
                        </div>
                        <div style="flex:1;min-width:0;display:flex;flex-direction:column;" class="glass">
                            ${chatAreaHtml}
                        </div>
                    </div>
                </section>
            `;
        }

        window.sendChatMessage = function() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;

            const text = input.value.trim();
            const roomId = routeParam || currentChat;
            if (!roomId) {
                showToast('⚠️ يرجى اختيار محادثة.', 'warning');
                return;
            }

            const room = db.chatRooms.find(r => r.id === roomId);
            if (!room) {
                showToast('⚠️ الغرفة غير موجودة.', 'error');
                return;
            }

            sendMessage(roomId, session.username, text, 'text', null);
            input.value = '';
            document.getElementById('emojiPicker').classList.remove('open');

            setTimeout(() => {
                const container = document.getElementById('chatMessages');
                if (container) container.scrollTop = container.scrollHeight;
            }, 100);
        };

        // EDIT CLASS FUNCTIONS
        window.openEditClassModal = function(classId) {
            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return;
            document.getElementById('editClassId').value = cls.id;
            document.getElementById('editClassName').value = cls.name;
            document.getElementById('editClassOrder').value = cls.order;
            document.getElementById('editClassModal').classList.add('active');
        };

        window.closeEditClassModal = function() {
            document.getElementById('editClassModal').classList.remove('active');
        };

        window.submitEditClass = async function(ev) {
            ev.preventDefault();
            const f = ev.target;
            const classId = f.classId.value;
            const name = f.className.value.trim();
            const order = parseInt(f.classOrder.value);

            if (!name) { showToast('⚠️ أدخل اسم الصف.', 'warning'); return false; }

            const cls = db.classes.find(c => c.id === classId);
            if (!cls) return false;

            const duplicate = db.classes.some(c => c.name === name && c.id !== classId);
            if (duplicate) { showToast('⚠️ هذا الصف موجود بالفعل.', 'warning'); return false; }

            cls.name = name;
            cls.order = order;
            await saveDB();
            window.closeEditClassModal();
            showToast(`✅ تم تحديث الصف "${name}"`, 'success');
            render();
            return false;
        };

        // RENDER ENGINE
        function render() {
            // إخفاء كل البيانات إذا لم يكن هناك جلسة نشطة
            if (!session) {
                const app = document.getElementById('app');
                // إذا كان المسار adminLogin، اعرض فورم تسجيل الدخول
                if (route === 'adminLogin') {
                    app.innerHTML = viewAdminLogin();
                } else {
                    app.innerHTML = viewHome();
                }
                renderNav();
                document.getElementById('chatFab').style.display = 'none';
                return;
            }

            renderNav();

            if (session) {
                const servant = db.servants.find(s => s.username === session.username);
                if (!servant || servant.isActive === false) {
                    if (!servant?.isAdmin) {
                        showToast('⚠️ تم إيقاف حسابك.', 'warning');
                        session = null;
                        clearSession();
                        route = 'home';
                        render();
                        return;
                    }
                } else {
                    session.isAdmin = servant?.isAdmin || false;
                }
            }

            if (route === 'admin' && (!session || !session.isAdmin)) {
                showToast('⛔ هذه الصفحة مخصصة للأدمن فقط.', 'error');
                route = 'adminLogin';
            }

            if (route === 'classDetail' && routeParam) {
                const app = document.getElementById('app');
                app.innerHTML = viewClassDetail(routeParam);
                return;
            }

            if (route === 'childReport' && routeParam) {
                const app = document.getElementById('app');
                app.innerHTML = viewChildReport(routeParam);
                return;
            }

            if (route === 'chat' && routeParam) {
                const app = document.getElementById('app');
                app.innerHTML = viewChat();
                return;
            }

            if (session && session.isAdmin) {
                document.getElementById('chatFab').style.display = 'flex';
                updateChatBadge();
            } else {
                document.getElementById('chatFab').style.display = 'none';
            }

            const app = document.getElementById('app');
            switch (route) {
                case 'home': app.innerHTML = viewHome(); break;
                case 'adminLogin': app.innerHTML = viewAdminLogin(); break;
                case 'admin': app.innerHTML = viewAdmin(); break;
                case 'chat': app.innerHTML = viewChat(); break;
                default: app.innerHTML = viewHome();
            }
        }

        // INIT
        (async function init() {
            await loadDB();
            applyTheme(currentTheme);

            const savedSession = loadSession();
            if (savedSession) {
                const servant = db.servants.find(s => s.username === savedSession.username);
                if (servant && servant.isActive !== false && servant.isAdmin) {
                    session = { username: servant.username, name: servant.name, isAdmin: true };
                    if (route === 'home' || route === 'adminLogin') route = 'admin';
                } else {
                    clearSession();
                }
            }

            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => Notification.requestPermission(), 3000);
            }

            render();
            watchDB();
        })();

        window.go = go;
        window.toggleTheme = toggleTheme;
        window.logout = logout;
        window.submitAdminLogin = submitAdminLogin;
        window.submitAddClass = submitAddClass;
        window.submitAddServant = submitAddServant;
        window.submitAdminAddChild = submitAdminAddChild;
        window.submitEditClass = submitEditClass;
        window.openEditClassModal = openEditClassModal;
        window.closeEditClassModal = closeEditClassModal;
        window.approveServant = approveServant;
        window.rejectServant = rejectServant;
        window.updateServantClass = updateServantClass;
        window.toggleServantStatus = toggleServantStatus;
        window.deleteServant = deleteServant;
        window.makeAdmin = makeAdmin;
        window.adminDeleteChild = adminDeleteChild;
        window.deleteClass = deleteClass;
        window.switchTab = switchTab;
        window.exportData = exportData;
        window.sendChatMessage = sendChatMessage;
        window.viewClassDetail = viewClassDetail;
        window.viewChildReport = viewChildReport;
        window.viewStudentExams = viewStudentExams;
        window.showExamResult = showExamResult;
        window.viewExamDetails = viewExamDetails;
        window.deleteExam = deleteExam;
        window.startExam = startExam;
        window.submitExamAnswers = submitExamAnswers;
        window.closeTakeExamModal = closeTakeExamModal;
        window.closeExamResultModal = closeExamResultModal;
        window.openExamModal = openExamModal;
        window.closeExamModal = closeExamModal;
        window.addQuestion = addQuestion;
        window.updateQuestionUI = updateQuestionUI;
        window.addOption = addOption;
        window.removeOption = removeOption;
        window.submitExam = submitExam;
        window.approveExamRetake = approveExamRetake;
        window.genCode = genCode;
        window.genExamCode = genExamCode;
        window.openResetPasswordModal = openResetPasswordModal;
        window.closeResetPasswordModal = closeResetPasswordModal;
        window.submitResetPassword = submitResetPassword;
        window.openResetPasswordFor = openResetPasswordFor;
        window.openPasswordModal = openPasswordModal;
        window.closePasswordModal = closePasswordModal;
        window.submitChangePassword = submitChangePassword;
        window.openPollModal = openPollModal;
        window.closePollModal = closePollModal;
        window.addPollOption = addPollOption;
        window.submitPoll = submitPoll;
        window.votePoll = votePoll;
        window.toggleEmojiPicker = toggleEmojiPicker;
        window.insertEmoji = insertEmoji;
        window.showToast = showToast;
        window.esc = esc;
        window.normalizeText = normalizeText;
        window.isAnswerCorrect = isAnswerCorrect;
        window.setServantSearch = setServantSearch;
        window.setServantStatusFilter = setServantStatusFilter;
        window.setChildSearch = setChildSearch;
        window.setChildClassFilter = setChildClassFilter;
        window.setExamSearch = setExamSearch;
        window.setExamStatusFilter = setExamStatusFilter;
        window.setAttendanceSearch = setAttendanceSearch;
        window.setAttendanceClassFilter = setAttendanceClassFilter;
        window.setPendingSearch = setPendingSearch;
        window.openBarcodeModal = openBarcodeModal;
        window.closeBarcodeModal = closeBarcodeModal;
    </script>
</body>
</html>
