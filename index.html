<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>منصة مدارس الأحد - الخادم</title>
    <meta name="theme-color" content="#2196f3" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#f0f8ff;--bg-secondary:#ffffff;--bg-glass:rgba(255,255,255,0.55);--bg-glass-hover:rgba(255,255,255,0.75);--text-primary:#0a1a2f;--text-secondary:#1a3a5c;--text-muted:#5a7a9a;--sky-dark:#2196f3;--sky-gradient:linear-gradient(145deg,#b3e0ff,#4fc3f7);--shadow:0 8px 32px rgba(33,150,243,0.15);--shadow-hover:0 16px 48px rgba(33,150,243,0.25);--border-glass:rgba(33,150,243,0.2);--ok:#2e7d32;--bad:#c62828;--gold:#f9a825;--pending:#f57c00;--admin-gradient:linear-gradient(135deg,#6a1b9a,#4a148c);--transition:all 0.4s cubic-bezier(0.23,1,0.32,1);--radius:32px;--radius-sm:16px;--chat-own:#e3f2fd;--chat-other:#f5f5f5;--correct:#4caf50;--wrong:#f44336}
        [data-theme=dark]{--bg-primary:#0a1628;--bg-secondary:#13203a;--bg-glass:rgba(20,40,80,0.6);--bg-glass-hover:rgba(30,60,120,0.75);--text-primary:#e8f4fd;--text-secondary:#b0d4f0;--text-muted:#7a9ab8;--sky-dark:#64b5f6;--shadow:0 8px 32px rgba(0,0,0,0.4);--shadow-hover:0 16px 48px rgba(0,0,0,0.6);--border-glass:rgba(100,181,246,0.2);--ok:#66bb6a;--bad:#ef5350;--gold:#ffd54f;--pending:#ffa726;--chat-own:#1a2a4a;--chat-other:#1a2a3a;--correct:#66bb6a;--wrong:#ef5350}
        body{font-family:'El Messiri',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:var(--transition);padding:12px;position:relative;overflow-x:hidden}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(100,200,255,0.06) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(33,150,243,0.04) 0%,transparent 50%);animation:floatBg 25s ease-in-out infinite alternate;z-index:0;pointer-events:none}
        @keyframes floatBg{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-5%,5%) scale(1.05)}}
        .container{max-width:1200px;margin:0 auto;padding:0 12px;position:relative;z-index:1}
        .glass{background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;transition:var(--transition);position:relative;overflow:hidden}
        .glass:hover{background:var(--bg-glass-hover);border-color:var(--sky-dark);box-shadow:var(--shadow-hover);transform:translateY(-3px)}
        header.top{padding:8px 0;margin-bottom:16px}
        header.top .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .brand{font-family:'Lalezar',cursive;font-size:1.8rem;color:var(--text-primary);display:flex;align-items:center;gap:10px;text-decoration:none;transition:var(--transition)}
        .brand:hover{transform:scale(1.02)}
        .brand .mark{color:var(--sky-dark);font-size:2rem;animation:pulseGlow 3s ease-in-out infinite}
        @keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(33,150,243,0.3))}50%{filter:drop-shadow(0 0 24px rgba(33,150,243,0.6))}}
        .brand .sky-text{background:var(--sky-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        nav a,nav button.linklike{color:var(--text-secondary);background:var(--bg-glass);backdrop-filter:blur(8px);padding:6px 16px;border-radius:40px;border:1px solid var(--border-glass);font-family:'El Messiri',sans-serif;font-size:0.85rem;cursor:pointer;transition:var(--transition);text-decoration:none;display:flex;align-items:center;gap:5px}
        nav a:hover,nav button.linklike:hover{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff;transform:translateY(-2px);box-shadow:0 8px 24px rgba(33,150,243,0.3)}
        nav .who{color:var(--text-secondary);padding:4px 14px;background:var(--bg-glass);border-radius:40px;font-weight:600;border:1px solid var(--border-glass);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;font-size:0.85rem}
        .status-badge{padding:2px 10px;border-radius:40px;font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
        .status-badge.active{background:rgba(46,125,50,0.2);color:var(--ok);border:1px solid rgba(46,125,50,0.3)}
        .status-badge.inactive{background:rgba(198,40,40,0.2);color:var(--bad);border:1px solid rgba(198,40,40,0.3)}
        .status-badge.pending{background:rgba(245,124,0,0.2);color:var(--pending);border:1px solid rgba(245,124,0,0.3)}
        .theme-toggle{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:40px;padding:6px 14px;cursor:pointer;color:var(--text-secondary);font-size:1.1rem;transition:var(--transition);backdrop-filter:blur(8px)}
        .theme-toggle:hover{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff;transform:rotate(20deg)}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:50px;border:none;font-family:'El Messiri',sans-serif;font-size:0.9rem;cursor:pointer;transition:var(--transition);font-weight:600;text-decoration:none;position:relative;overflow:hidden}
        .btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);opacity:0;transition:opacity 0.4s}
        .btn:hover::after{opacity:1}
        .btn-primary{background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#fff;box-shadow:0 4px 20px rgba(33,150,243,0.35)}
        .btn-primary:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 32px rgba(33,150,243,0.5)}
        .btn-secondary{background:var(--bg-glass);color:var(--text-secondary);border:1px solid var(--border-glass);backdrop-filter:blur(8px)}
        .btn-secondary:hover{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark);transform:translateY(-3px)}
        .btn-gold{background:linear-gradient(135deg,#ffd54f,#f9a825);color:#0a1628;box-shadow:0 4px 20px rgba(249,168,37,0.3)}
        .btn-gold:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 32px rgba(249,168,37,0.5)}
        .btn-sm{padding:5px 14px;font-size:0.75rem}
        .btn-ok{background:rgba(46,125,50,0.15);color:var(--ok);border:1px solid rgba(46,125,50,0.3)}
        .btn-ok:hover{background:var(--ok);color:#fff;transform:translateY(-2px)}
        .btn-bad{background:rgba(198,40,40,0.15);color:var(--bad);border:1px solid rgba(198,40,40,0.3)}
        .btn-bad:hover{background:var(--bad);color:#fff;transform:translateY(-2px)}
        .btn-add{background:rgba(33,150,243,0.15);color:var(--sky-dark);border:1px solid rgba(33,150,243,0.3)}
        .btn-add:hover{background:var(--sky-dark);color:#fff;transform:translateY(-2px)}
        .form{display:flex;flex-direction:column;gap:12px}
        .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
        label{display:flex;flex-direction:column;gap:4px;font-size:0.85rem;color:var(--text-secondary);flex:1 1 160px}
        input,select,textarea{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-glass);background:var(--bg-glass);backdrop-filter:blur(8px);font-size:0.95rem;font-family:inherit;color:var(--text-primary);transition:var(--transition)}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 4px rgba(33,150,243,0.12);background:var(--bg-glass-hover)}
        textarea{min-height:80px;resize:vertical}
        .table-wrap{overflow-x:auto;border-radius:var(--radius-sm);background:rgba(0,0,0,0.03);padding:4px}
        table{width:100%;border-collapse:collapse;font-size:0.85rem}
        th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--border-glass);vertical-align:middle}
        th{color:var(--sky-dark);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:1px}
        tr:hover td{background:rgba(33,150,243,0.04)}
        .badge{padding:2px 12px;border-radius:40px;font-size:0.7rem;font-weight:600;display:inline-block}
        .badge-ok{background:rgba(46,125,50,0.15);color:var(--ok);border:1px solid rgba(46,125,50,0.2)}
        .badge-bad{background:rgba(198,40,40,0.15);color:var(--bad);border:1px solid rgba(198,40,40,0.2)}
        .badge-pending{background:rgba(245,124,0,0.15);color:var(--pending);border:1px solid rgba(245,124,0,0.2)}
        .badge-correct{background:rgba(76,175,80,0.15);color:var(--correct);border:1px solid rgba(76,175,80,0.2)}
        .badge-wrong{background:rgba(244,67,54,0.15);color:var(--wrong);border:1px solid rgba(244,67,54,0.2)}
        .badge-info{background:rgba(33,150,243,0.15);color:var(--sky-dark);border:1px solid rgba(33,150,243,0.2)}
        .code-pill{background:rgba(33,150,243,0.1);color:var(--sky-dark);padding:2px 14px;border-radius:40px;font-weight:700;letter-spacing:1px;border:1px solid rgba(33,150,243,0.15);font-size:0.75rem;font-family:monospace}
        .copy-btn{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:30px;padding:2px 12px;color:var(--text-muted);cursor:pointer;transition:var(--transition);font-size:0.7rem}
        .copy-btn:hover{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark)}
        .alert{padding:10px 18px;border-radius:var(--radius-sm);margin-bottom:12px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;font-size:0.9rem}
        .alert-success{background:rgba(46,125,50,0.12);border:1px solid rgba(46,125,50,0.2);color:var(--ok)}
        .alert-error{background:rgba(198,40,40,0.12);border:1px solid rgba(198,40,40,0.2);color:var(--bad)}
        .alert-warning{background:rgba(245,124,0,0.12);border:1px solid rgba(245,124,0,0.2);color:var(--pending)}
        .alert-info{background:rgba(33,150,243,0.12);border:1px solid rgba(33,150,243,0.2);color:var(--sky-dark)}
        .empty{color:var(--text-muted);text-align:center;padding:30px 0;font-size:0.9rem}
        .panel{max-width:480px;margin:0 auto}
        .status-group{display:flex;gap:14px}
        .status-group label{flex-direction:row;align-items:center;gap:4px;color:var(--text-secondary);font-size:0.85rem;flex:0 1 auto}
        .status-group input[type=radio]{accent-color:var(--sky-dark);width:16px;height:16px}
        .chat-container{display:flex;gap:16px;height:60vh;min-height:400px}
        .chat-list{width:260px;min-width:200px;overflow-y:auto;padding:4px}
        .chat-list::-webkit-scrollbar{width:4px}
        .chat-list::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        .chat-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);margin-bottom:4px;border:1px solid transparent}
        .chat-item:hover{background:var(--bg-glass-hover);border-color:var(--border-glass)}
        .chat-item.active{background:var(--bg-glass-hover);border-color:var(--sky-dark)}
        .chat-item .avatar{width:32px;height:32px;border-radius:50%;background:var(--sky-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;flex-shrink:0}
        .chat-item .avatar.admin-avatar{background:var(--admin-gradient)}
        .chat-item .chat-info{flex:1;min-width:0}
        .chat-item .chat-name{font-weight:600;font-size:0.85rem;color:var(--text-primary)}
        .chat-item .chat-last-msg{font-size:0.7rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-item .chat-time{font-size:0.55rem;color:var(--text-muted);flex-shrink:0}
        .chat-item .chat-badge{background:var(--sky-dark);color:#fff;border-radius:50%;padding:0 5px;font-size:0.55rem;font-weight:700;min-width:16px;text-align:center;line-height:16px}
        .chat-item .chat-type{font-size:0.5rem;padding:1px 6px;border-radius:40px;background:var(--bg-glass);color:var(--text-muted);border:1px solid var(--border-glass)}
        .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
        .chat-header{padding:8px 12px;border-bottom:1px solid var(--border-glass);display:flex;align-items:center;gap:8px}
        .chat-header .avatar{width:30px;height:30px;border-radius:50%;background:var(--sky-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;flex-shrink:0}
        .chat-header .chat-with{font-weight:600;font-size:0.9rem}
        .chat-header .chat-type-badge{font-size:0.55rem;padding:1px 8px;border-radius:40px;background:var(--bg-glass);color:var(--text-muted);border:1px solid var(--border-glass)}
        .chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
        .chat-messages::-webkit-scrollbar{width:4px}
        .chat-messages::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        .message{max-width:75%;padding:6px 12px;border-radius:10px;animation:messageIn 0.3s ease;border:1px solid var(--border-glass);font-size:0.85rem}
        @keyframes messageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .message.own{align-self:flex-end;background:var(--chat-own);border-bottom-left-radius:4px}
        .message.other{align-self:flex-start;background:var(--chat-other);border-bottom-right-radius:4px}
        .message .msg-sender{font-size:0.65rem;font-weight:600;color:var(--sky-dark);margin-bottom:2px}
        .message .msg-text{font-size:0.85rem;line-height:1.6;word-wrap:break-word}
        .message .msg-time{font-size:0.5rem;color:var(--text-muted);margin-top:3px;text-align:left}
        .poll-message{background:var(--bg-glass);border:2px solid var(--sky-dark);border-radius:var(--radius-sm);padding:12px;max-width:85%;align-self:flex-start}
        .poll-message .poll-question{font-weight:600;font-size:0.9rem;margin-bottom:6px}
        .poll-message .poll-option{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:var(--transition);margin-bottom:3px;border:1px solid var(--border-glass);font-size:0.8rem}
        .poll-message .poll-option:hover{background:var(--bg-glass-hover)}
        .poll-message .poll-option.voted{border-color:var(--sky-dark);background:rgba(33,150,243,0.1)}
        .poll-message .poll-option .poll-bar{flex:1;height:4px;background:var(--bg-glass);border-radius:10px;overflow:hidden}
        .poll-message .poll-option .poll-bar .poll-fill{height:100%;background:var(--sky-gradient);border-radius:10px;transition:width 0.5s ease}
        .poll-message .poll-option .poll-percent{font-size:0.7rem;color:var(--text-muted);min-width:30px;text-align:left}
        .chat-input{padding:8px 12px;border-top:1px solid var(--border-glass);display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:relative}
        .chat-input .input-wrapper{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
        .chat-input input{flex:1;padding:8px 14px;border-radius:30px;border:1px solid var(--border-glass);background:var(--bg-glass);backdrop-filter:blur(8px);font-size:0.85rem;font-family:inherit;color:var(--text-primary);transition:var(--transition);min-width:0}
        .chat-input input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 4px rgba(33,150,243,0.12)}
        .chat-input .emoji-btn{padding:6px 10px;border-radius:50%;border:1px solid var(--border-glass);background:var(--bg-glass);cursor:pointer;font-size:1rem;transition:var(--transition)}
        .chat-input .emoji-btn:hover{background:var(--bg-glass-hover);transform:scale(1.05)}
        .chat-input .poll-btn{padding:6px 12px;border-radius:30px;border:1px solid var(--border-glass);background:var(--bg-glass);cursor:pointer;font-size:0.7rem;transition:var(--transition);display:flex;align-items:center;gap:4px}
        .chat-input .poll-btn:hover{background:var(--bg-glass-hover);transform:scale(1.02)}
        .chat-input .send-btn{padding:8px 16px;border-radius:30px;border:none;background:var(--sky-dark);color:#fff;font-size:0.9rem;cursor:pointer;transition:var(--transition)}
        .chat-input .send-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(33,150,243,0.3)}
        .emoji-picker{display:none;position:absolute;bottom:60px;left:10px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow-hover);z-index:100;width:240px;max-height:180px;overflow-y:auto}
        .emoji-picker.open{display:block}
        .emoji-picker .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
        .emoji-picker .emoji-grid span{font-size:1.2rem;cursor:pointer;text-align:center;padding:3px;border-radius:6px;transition:var(--transition)}
        .emoji-picker .emoji-grid span:hover{background:var(--bg-glass-hover);transform:scale(1.2)}
        .chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);text-align:center;padding:20px}
        .chat-empty i{font-size:2.5rem;color:var(--sky-dark);opacity:0.3;margin-bottom:10px}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:2000;display:none;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
        .modal-overlay.active{display:flex}
        .modal{max-width:700px;width:90%;max-height:90vh;overflow-y:auto;padding:24px}
        .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
        .modal-close{background:none;border:none;color:var(--text-secondary);font-size:1.3rem;cursor:pointer;transition:var(--transition)}
        .modal-close:hover{transform:rotate(90deg);color:var(--bad)}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .question-card{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;transition:var(--transition)}
        .question-card:hover{border-color:var(--sky-dark)}
        .question-card .question-text{font-weight:600;font-size:0.9rem;margin-bottom:6px}
        .question-card .question-options{display:flex;flex-direction:column;gap:4px}
        .question-card .question-options label{flex-direction:row;align-items:center;gap:6px;font-size:0.85rem;cursor:pointer}
        .question-card .question-options input[type=radio],.question-card .question-options input[type=checkbox]{accent-color:var(--sky-dark);width:16px;height:16px}
        .exam-result-correct{color:var(--correct)}
        .exam-result-wrong{color:var(--wrong)}
        .chat-fab{position:fixed;bottom:20px;right:20px;z-index:999;width:54px;height:54px;border-radius:50%;background:var(--sky-gradient);color:#fff;border:none;font-size:1.5rem;cursor:pointer;box-shadow:0 8px 32px rgba(33,150,243,0.4);transition:var(--transition);display:none;align-items:center;justify-content:center}
        .chat-fab:hover{transform:scale(1.1) rotate(-10deg)}
        .chat-fab .badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:50%;padding:0 5px;font-size:0.55rem;font-weight:700;min-width:18px;text-align:center;line-height:18px}
        .toast-container{position:fixed;bottom:80px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:320px}
        .toast{padding:10px 16px;border-radius:var(--radius-sm);backdrop-filter:blur(12px);border:1px solid var(--border-glass);box-shadow:var(--shadow-hover);animation:slideUp 0.4s ease;font-size:0.85rem;display:flex;align-items:center;gap:8px}
        .toast-success{background:rgba(46,125,50,0.15);color:var(--ok);border-color:rgba(46,125,50,0.2)}
        .toast-error{background:rgba(198,40,40,0.15);color:var(--bad);border-color:rgba(198,40,40,0.2)}
        .toast-warning{background:rgba(245,124,0,0.15);color:var(--pending);border-color:rgba(245,124,0,0.2)}
        .toast-info{background:rgba(33,150,243,0.15);color:var(--sky-dark);border-color:rgba(33,150,243,0.2)}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        footer.site{text-align:center;padding:20px 0 10px;color:var(--text-muted);border-top:1px solid var(--border-glass);margin-top:40px;font-size:0.8rem}
        footer.site strong{color:var(--sky-dark)}
        .loading{text-align:center;padding:60px 0;color:var(--text-muted);font-size:1.1rem}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:var(--bg-glass);border-radius:10px}
        ::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:var(--sky-dark);opacity:0.8}
        .option-item{display:flex;gap:8px;align-items:center;margin-bottom:4px}

        @media(max-width:768px){.chat-container{flex-direction:column;height:auto;min-height:auto}.chat-list{width:100%;min-width:unset;max-height:160px}.chat-area{height:50vh;min-height:300px}.brand{font-size:1.4rem}.glass{padding:16px}.message{max-width:85%}.chat-fab{width:48px;height:48px;font-size:1.2rem;bottom:16px;right:16px}.emoji-picker{left:10px;right:10px;width:auto}.modal{padding:16px}.form-row{flex-direction:column}.form-row label{flex:1 1 100%}}

<body>

    <header class="top">
        <div class="container row">
            <a href="#" class="brand" onclick="window.go('home');return false;">
                <span class="mark"><i class="fas fa-cross"></i></span>

            </a>
            <nav id="nav">
                <button class="theme-toggle" onclick="window.toggleTheme()" title="تبديل الوضع">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="container" id="app">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> جارِ تحميل المنصة...</div>
    </main>

    <button class="chat-fab" id="chatFab" onclick="window.openChat()" title="فتح المحادثات">

    <div class="toast-container" id="toastContainer"></div>

    <!-- POLL MODAL -->
    <div class="modal-overlay" id="pollModal">
        <div class="modal glass">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;"><i class="fas fa-poll" style="color:var(--sky-dark);"></i> إنشاء استطلاع رأي</h3>
                <button class="modal-close" onclick="window.closePollModal()"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return window.submitPoll(event)">
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">السؤال <input type="text" id="pollQuestion" required placeholder="ما هو سؤالك؟" /></label>
                </div>
                <div id="pollOptions">
                    <div class="form-row" style="margin-bottom:6px;">
                        <label style="flex:1;">الخيار 1 <input type="text" class="poll-option-input" required placeholder="الخيار الأول" /></label>
                    </div>
                    <div class="form-row" style="margin-bottom:6px;">
                        <label style="flex:1;">الخيار 2 <input type="text" class="poll-option-input" required placeholder="الخيار الثاني" /></label>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="window.addPollOption()" style="margin-bottom:10px;"><i class="fas fa-plus"></i> إضافة خيار</button>
                <button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane"></i> إرسال الاستطلاع</button>
            </form>
        </div>
    </div>

    <!-- CHANGE PASSWORD MODAL -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal glass">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;"><i class="fas fa-key" style="color:var(--sky-dark);"></i> تغيير كلمة المرور</h3>
                <button class="modal-close" onclick="window.closePasswordModal()"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return window.submitChangePassword(event)">
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">كلمة المرور الحالية <input type="password" id="oldPassword" required placeholder="أدخل كلمة المرور الحالية" /></label>
                </div>
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">كلمة المرور الجديدة <input type="password" id="newPassword" required placeholder="6 أحرف على الأقل" /></label>
                </div>
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">تأكيد كلمة المرور <input type="password" id="confirmPassword" required placeholder="أعد كتابة كلمة المرور" /></label>
                </div>
                <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> تغيير كلمة المرور</button>
            </form>
        </div>
    </div>

    <!-- EXAM MODAL -->
    <div class="modal-overlay" id="examModal">
        <div class="modal glass" style="max-width:750px;">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;"><i class="fas fa-pencil-alt" style="color:var(--sky-dark);"></i> <span id="examModalTitle">إنشاء اختبار جديد</span></h3>
                <button class="modal-close" onclick="window.closeExamModal()"><i class="fas fa-times"></i></button>
            </div>
            <form onsubmit="return window.submitExam(event)" id="examForm">
                <input type="hidden" id="editExamId" value="" />
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">اسم الاختبار <input type="text" id="examName" required placeholder="أدخل اسم الاختبار" /></label>
                </div>
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">الوصف <textarea id="examDescription" placeholder="وصف الاختبار" style="min-height:50px;"></textarea></label>
                </div>
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">المدة (دقائق) <input type="number" id="examDuration" value="30" min="1" required /></label>
                    <label style="flex:1;">عدد محاولات الدخول <input type="number" id="examAttempts" value="1" min="1" required /></label>
                </div>
                <div class="form-row" style="margin-bottom:10px;">
                    <label style="flex:1;">اختر الصف
                        <select id="examClass" required>
                            <option value="">اختر الصف</option>
                        </select>
                    </label>
                    <label style="flex:1;">حالة الاختبار
                        <select id="examStatus">
                            <option value="active">نشط</option>
                            <option value="draft">مسودة</option>
                            <option value="closed">مغلق</option>
                        </select>
                    </label>
                </div>
                <div id="examQuestions">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                        <h4 style="font-size:0.9rem;">الأسئلة</h4>
                        <button type="button" class="btn btn-sm btn-add" onclick="window.addQuestion()"><i class="fas fa-plus"></i> إضافة سؤال</button>
                    </div>
                    <div id="questionsContainer"></div>
                </div>
                <div style="display:flex;gap:8px;margin-top:12px;">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> <span id="examSubmitText">إنشاء الاختبار</span></button>
                    <button type="button" class="btn btn-secondary" onclick="window.closeExamModal()"><i class="fas fa-times"></i> إلغاء</button>

        </div>
    </div>

    <!-- TAKE EXAM MODAL -->
    <div class="modal-overlay" id="takeExamModal">
        <div class="modal glass" style="max-width:800px;">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;" id="takeExamTitle"><i class="fas fa-pencil-alt" style="color:var(--sky-dark);"></i> الاختبار</h3>
                <div>
                    <span id="takeExamTimer" style="color:var(--bad);font-weight:700;font-size:1.1rem;margin-left:12px;"></span>
                    <button class="modal-close" onclick="window.closeTakeExamModal()"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div id="takeExamContent"></div>
        </div>
    </div>

    <!-- EXAM RESULT MODAL -->
    <div class="modal-overlay" id="examResultModal">
        <div class="modal glass" style="max-width:800px;">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;"><i class="fas fa-chart-bar" style="color:var(--sky-dark);"></i> نتيجة الاختبار</h3>
                <button class="modal-close" onclick="window.closeExamResultModal()"><i class="fas fa-times"></i></button>
            </div>
            <div id="examResultContent"></div>
        </div>
    </div>

    <!-- BARCODE SCANNER MODAL -->
    <div class="modal-overlay" id="barcodeModal">
        <div class="modal glass" style="max-width:500px;">
            <div class="modal-header">
                <h3 style="font-size:1.1rem;"><i class="fas fa-barcode" style="color:var(--sky-dark);"></i> مسح الباركود</h3>
                <button class="modal-close" onclick="window.closeBarcodeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="barcode-scanner" id="barcodeScanner">
                <video id="barcodeVideo" autoplay playsinline></video>
            </div>
            <p style="text-align:center;color:var(--text-muted);font-size:0.85rem;margin-top:10px;">
                <i class="fas fa-info-circle"></i> وجّه الكاميرا نحو الباركود
            </p>
            <div id="barcodeResult" style="text-align:center;margin-top:8px;"></div>
        </div>
    </div>

    <footer class="site">
        <div class="container">
            <i class="fas fa-cross" style="color:var(--sky-dark);margin-left:6px;"></i>
            منصة مدارس الأحد Developed by: <strong>Keroles Ayman, Arsany Moftah</strong>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, doc, getDoc, setDoc, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuGob9_AWGsDiAaJgB6XWWye-eEhMBVOo",
            authDomain: "sunday-school-platform-8a08a.firebaseapp.com",
            projectId: "sunday-school-platform-8a08a",
            storageBucket: "sunday-school-platform-8a08a.firebasestorage.app",
            messagingSenderId: "137098154880",
            appId: "1:137098154880:web:c0731bcedfe384aba72765"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const firestore = getFirestore(firebaseApp);
        const dataDocRef = doc(firestore, "sunday-school", "data");

        const EMOJIS = ['😊','😂','❤️','👍','🙏','🌟','🔥','💪','🎉','✨','😍','🤗','😅','🤔','😢','😡','🥳','🤩','😎','🧡','💙','💚','💛','💜','🖤','🤍','💝','💖','💗','💓','💞','💕','💘','💟','☮️','✝️','☦️','🕊️','🙌','👏','🤝','✌️','👋','💯','🔥','⚡','⭐','🌙','☀️','🌈','☁️','❄️','🌊','🌺','🌸','🌹','🌷','🌻','🌼','🌿','🌱','🍀','🌳'];

        let db = { servants: [], children: [], attendance: [], classes: [], chatRooms: [], polls: [], exams: [], examResults: [] };
        let session = null;
        let route = 'home';
        let routeParam = null;
        let flash = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentChat = null;
        let examTimerInterval = null;
        let editingExamId = null;
        let barcodeStream = null;
        let barcodeDetector = null;
        let barcodeScanning = false;

        // ========== SEARCH & FILTER STATE ==========
        let childSearchQuery = '';
        let childClassFilter = '';
        let examSearchQuery = '';
        let examStatusFilter = '';
        let studentSearchQuery = '';
        let examResultsScoreFilter = '';

        function saveSession(username, name, isAdmin) {
            localStorage.setItem('session', JSON.stringify({ username, name, isAdmin }));
        }

        function loadSession() {
            try {
                const saved = localStorage.getItem('session');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return null;
        }

        function clearSession() { localStorage.removeItem('session'); }

        async function loadDB() {
            try {
                const snap = await getDoc(dataDocRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.payload) {
                        db = data.payload;
                    } else {
                        db = data;
                    }
                } else {
                    db = { servants: [], children: [], attendance: [], classes: [], chatRooms: [], polls: [], exams: [], examResults: [] };
                    await saveDB();
                }
                if (!db.servants) db.servants = [];
                if (!db.children) db.children = [];
                if (!db.attendance) db.attendance = [];
                if (!db.classes) db.classes = [];
                if (!db.chatRooms) db.chatRooms = [];
                if (!db.polls) db.polls = [];
                if (!db.exams) db.exams = [];
                if (!db.examResults) db.examResults = [];

                db.servants = db.servants.map(s => ({
                    ...s,
                    isActive: s.isActive !== undefined ? s.isActive : false,
                    isAdmin: s.isAdmin || false,
                    isPending: s.isPending !== undefined ? s.isPending : true,
                    assignedClass: s.assignedClass || null,
                    pendingSince: s.pendingSince || null
                }));
            } catch (e) {
                console.error('❌ تعذر تحميل البيانات', e);
                showToast('تعذر الاتصال بقاعدة البيانات.', 'error');
            }
        }

        async function saveDB() {
            try {
                await setDoc(dataDocRef, { payload: db });
            } catch (e) {
                console.error('❌ تعذر حفظ البيانات', e);
                showToast('حدث خطأ أثناء حفظ البيانات.', 'error');
            }
        }

        function watchDB() {
            onSnapshot(dataDocRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.payload) {
                        db = data.payload;
                    } else {
                        db = data;
                    }
                    if (!db.servants) db.servants = [];
                    if (!db.children) db.children = [];
                    if (!db.attendance) db.attendance = [];
                    if (!db.classes) db.classes = [];
                    if (!db.chatRooms) db.chatRooms = [];
                    if (!db.polls) db.polls = [];
                    if (!db.exams) db.exams = [];
                    if (!db.examResults) db.examResults = [];

                    db.servants = db.servants.map(s => ({
                        ...s,
                        isActive: s.isActive !== undefined ? s.isActive : false,
                        isAdmin: s.isAdmin || false,
                        isPending: s.isPending !== undefined ? s.isPending : true,
                        assignedClass: s.assignedClass || null,
                        pendingSince: s.pendingSince || null
                    }));
                    updateChatBadge();
                    render();
                }
            });
        }

        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            localStorage.setItem('theme', theme);
            const icon = document.querySelector('.theme-toggle i');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        function toggleTheme() { applyTheme(currentTheme === 'light' ? 'dark' : 'light'); }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        function esc(s) {
            return (s ?? '').toString()
                .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
        }

        async function sha256(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function genCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code;
            do {
                code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            } while (db.children.some(c => c.code === code));
            return code;
        }

        function genExamCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code;
            do {
                code = Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            } while (db.exams.some(e => e.code === code));
            return code;
        }

        function todayDate() {
            return new Date().toISOString().slice(0, 10);
        }

        function setFlash(msg, type = 'success') { flash = { msg, type }; }

        function go(r, param = null) {
            if ((r === 'dashboard' || r === 'attendance' || r === 'childReport' || r === 'chat' || r === 'exams') && !session) {
                r = 'login';
            }
            route = r;
            routeParam = param;
            // Reset search filters when navigating
            if (r !== 'exams') { examSearchQuery = ''; examStatusFilter = ''; }
            if (r !== 'student') { studentSearchQuery = ''; }
            render();
        }

        function isServantActive(username) {
            const servant = db.servants.find(s => s.username === username);
            return servant ? servant.isActive === true : false;
        }

        function isServantPending(username) {
            const servant = db.servants.find(s => s.username === username);
            return servant ? servant.isPending === true : false;
        }

        function hasAdmin() {
            return db.servants.some(s => s.isAdmin === true);
        }

        function getServantByUsername(username) {
            return db.servants.find(s => s.username === username);
        }

        function getClassById(id) {
            return db.classes.find(c => c.id === id);
        }

        function getActiveServants() {
            return db.servants.filter(s => s.isActive && !s.isPending);
        }

        function getAdmins() {
            return db.servants.filter(s => s.isAdmin && s.isActive);
        }

        function myChildren() {
            return db.children.filter(c => c.servantUsername === session?.username);
        }

        function getExamsForClass(classId) {
            return db.exams.filter(e => e.classId === classId);
        }

        function getExamResultsForStudent(childId) {
            return db.examResults.filter(r => r.childId === childId);
        }

        function getServantExams() {
            if (!session) return [];
            // الخادم يرى فقط اختباراته، الأدمن يرى الكل
            if (session.isAdmin) return db.exams;
            return db.exams.filter(e => e.servantUsername === session.username);
        }

        // ========== SEARCH FUNCTIONS ==========
        function filterChildren(list, query, classFilter) {
            let result = list;
            if (query) {
                const q = query.toLowerCase().trim();
                result = result.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    c.code.toLowerCase().includes(q)
                );
            }
            if (classFilter) {
                result = result.filter(c => c.classId === classFilter);
            }
            return result;
        }

        function filterExams(list, query, statusFilter) {
            let result = list;
            if (query) {
                const q = query.toLowerCase().trim();
                result = result.filter(e =>
                    e.name.toLowerCase().includes(q) ||
                    e.code.toLowerCase().includes(q)
                );
            }
            if (statusFilter) {
                result = result.filter(e => e.status === statusFilter);
            }
            return result;
        }

        // ============================================================
        // دالة تطبيع النصوص لتجاهل الأحرف المتشابهة
        // ============================================================
        function normalizeText(text) {
            if (!text) return '';
            return text.toString().trim()
                .replace(/[اآإ]/g, 'ا')
                .replace(/[ىئ]/g, 'ي')
                .replace(/[ؤ]/g, 'و')
                .replace(/[ة]/g, 'ه')
                .replace(/[گ]/g, 'ك')
                .replace(/\s+/g, ' ')
                .toLowerCase();
        }

        function isAnswerCorrect(userAnswer, modelAnswer) {
            if (!modelAnswer) return false;
            return normalizeText(userAnswer) === normalizeText(modelAnswer);
        }

        window.openBarcodeModal = async function() {
            document.getElementById('barcodeModal').classList.add('active');
            document.getElementById('barcodeResult').innerHTML = '';

            try {
                barcodeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('barcodeVideo').srcObject = barcodeStream;
                barcodeScanning = true;

                if ('BarcodeDetector' in window) {
                    barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'codabar', 'itf', 'upc_a', 'upc_e'] });
                    scanBarcode();
                } else {
                    document.getElementById('barcodeResult').innerHTML = `
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle"></i> المتصفح لا يدعم مسح الباركود. أدخل الكود يدوياً.
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById('barcodeResult').innerHTML = `
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i> لا يمكن الوصول إلى الكاميرا. تأكد من الأذونات.
                    </div>
                `;
            }
        };

        window.closeBarcodeModal = function() {
            barcodeScanning = false;
            if (barcodeStream) {
                barcodeStream.getTracks().forEach(t => t.stop());
                barcodeStream = null;
            }
            barcodeDetector = null;
            document.getElementById('barcodeModal').classList.remove('active');
        };

        async function scanBarcode() {
            const video = document.getElementById('barcodeVideo');
            if (!barcodeScanning || !barcodeDetector) return;

            try {
                const barcodes = await barcodeDetector.detect(video);
                if (barcodes.length > 0) {
                    const code = barcodes[0].rawValue.trim().toUpperCase();
                    barcodeScanning = false;
                    if (barcodeStream) {
                        barcodeStream.getTracks().forEach(t => t.stop());
                        barcodeStream = null;
                    }
                    document.getElementById('barcodeResult').innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> تم مسح الكود: <strong>${esc(code)}</strong>
                        </div>
                    `;
                    setTimeout(() => {
                        window.closeBarcodeModal();
                        go('student');
                        // Auto-fill and lookup
                        setTimeout(() => {
                            const input = document.querySelector('input[name="code"]');
                            if (input) {
                                input.value = code;
                                window.submitStudentLookup({ preventDefault: () => {}, target: { code: { value: code } } });
                            }
                        }, 300);
                    }, 800);
                    return;
                }
            } catch (e) {}
            requestAnimationFrame(scanBarcode);
        }

        function getChatRooms(user) {
            if (!user) return [];
            const rooms = [];

            db.chatRooms.forEach(room => {
                if (room.participants && room.participants.includes(user.username)) {
                    rooms.push(room);
                }
            });

            if (user.isAdmin) {
                const servants = getActiveServants().filter(s => !s.isAdmin);
                servants.forEach(servant => {
                    const roomId = `chat_admin_${user.username}_${servant.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = {
                            id: roomId,
                            type: 'admin-servant',
                            name: servant.name,
                            participants: [user.username, servant.username],
                            createdBy: user.username,
                            createdAt: new Date().toISOString(),
                            messages: [],
                            lastMessage: 'لا توجد رسائل بعد',
                            lastMessageTime: new Date().toISOString(),
                            unreadCount: {}
                        };
                        db.chatRooms.push(newRoom);
                        saveDB();
                        rooms.push(newRoom);
                    } else {
                        const existing = db.chatRooms.find(r => r.id === roomId);
                        if (existing) rooms.push(existing);
                    }
                });
            }

            if (!user.isAdmin) {
                const admins = getAdmins();
                admins.forEach(admin => {
                    const roomId = `chat_admin_${admin.username}_${user.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = {

                            participants: [admin.username, user.username],

                            messages: [],
                            lastMessage: 'لا توجد رسائل بعد',
                            lastMessageTime: new Date().toISOString(),
                            unreadCount: {}
                        };
                        db.chatRooms.push(newRoom);
                        saveDB();
                        rooms.push(newRoom);
                    } else {
                        const existing = db.chatRooms.find(r => r.id === roomId);
                        if (existing) rooms.push(existing);
                    }
                });

                const servants = getActiveServants().filter(s => !s.isAdmin && s.username !== user.username);
                servants.forEach(servant => {
                    const roomId = `chat_servant_${user.username}_${servant.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = {
                            id: roomId,
                            type: 'servant-servant',
                            name: servant.name,
                            participants: [user.username, servant.username],
                            createdBy: user.username,
                            createdAt: new Date().toISOString(),
                            messages: [],
                            lastMessage: 'لا توجد رسائل بعد',
                            lastMessageTime: new Date().toISOString(),
                            unreadCount: {}
                        };
                        db.chatRooms.push(newRoom);
                        saveDB();
                        rooms.push(newRoom);
                    } else {
                        const existing = db.chatRooms.find(r => r.id === roomId);
                        if (existing) rooms.push(existing);
                    }
                });
            }

            if (user.isAdmin) {
                const admins = getAdmins().filter(a => a.username !== user.username);
                admins.forEach(admin => {
                    const roomId = `chat_admin_${user.username}_${admin.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = {
                            id: roomId,
                            type: 'admin-admin',
                            name: admin.name,
                            participants: [user.username, admin.username],
                            createdBy: user.username,
                            createdAt: new Date().toISOString(),
                            messages: [],
                            lastMessage: 'لا توجد رسائل بعد',
                            lastMessageTime: new Date().toISOString(),
                            unreadCount: {}
                        };
                        db.chatRooms.push(newRoom);
                        saveDB();
                        rooms.push(newRoom);
                    } else {
                        const existing = db.chatRooms.find(r => r.id === roomId);
                        if (existing) rooms.push(existing);
                    }
                });
            }

            return rooms.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
        }

        function sendMessage(roomId, from, text, type = 'text', data = null) {
            const room = db.chatRooms.find(r => r.id === roomId);
            if (!room) return;

            const message = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                from: from,
                text: text.trim(),
                type: type,
                data: data,
                timestamp: new Date().toISOString(),
                readBy: [from]
            };

            room.messages.push(message);
            room.lastMessage = text.trim() || (type === 'poll' ? '📊 استطلاع رأي' : '');
            room.lastMessageTime = new Date().toISOString();

            room.participants.forEach(p => {
                if (p !== from) {
                    if (!room.unreadCount) room.unreadCount = {};
                    room.unreadCount[p] = (room.unreadCount[p] || 0) + 1;
                }
            });

            saveDB();
            render();
            updateChatBadge();

            if ('Notification' in window && Notification.permission === 'granted') {
                const sender = getServantByUsername(from);
                const name = sender ? sender.name : from;
                room.participants.forEach(p => {
                    if (p !== from) {
                        const other = getServantByUsername(p);
                        if (other) {
                            new Notification('رسالة جديدة من ' + name, {
                                body: text.trim() || '📊 استطلاع رأي',
                                icon: '/icons/icon-192x192.png',
                                badge: '/icons/icon-72x72.png',
                                vibrate: [200, 100, 200]
                            });
                        }
                    }
                });
            }
        }

        function getMessages(roomId) {
            const room = db.chatRooms.find(r => r.id === roomId);
            return room ? room.messages : [];
        }

        function markAsRead(roomId, username) {
            const room = db.chatRooms.find(r => r.id === roomId);
            if (room) {
                room.messages.forEach(msg => {
                    if (!msg.readBy.includes(username)) {
                        msg.readBy.push(username);
                    }
                });
                if (room.unreadCount) {
                    room.unreadCount[username] = 0;
                }
                saveDB();
                updateChatBadge();
            }
        }

        function getUnreadCount(username) {
            let total = 0;
            db.chatRooms.forEach(room => {
                if (room.participants && room.participants.includes(username) && room.unreadCount) {
                    total += (room.unreadCount[username] || 0);
                }
            });
            return total;
        }

        window.submitPoll = function(ev) {
            ev.preventDefault();
            if (!currentChat) {
                showToast('⚠️ يرجى اختيار محادثة أولاً.', 'warning');
                return false;
            }

            const question = document.getElementById('pollQuestion').value.trim();
            const inputs = document.querySelectorAll('.poll-option-input');
            const options = [];
            inputs.forEach(inp => {
                const val = inp.value.trim();
                if (val) options.push(val);
            });

            if (options.length < 2) {
                showToast('⚠️ يجب إضافة خيارين على الأقل.', 'warning');
                return false;
            }

            const pollData = {
                id: 'poll_' + Date.now(),
                question: question,
                options: options.map(opt => ({ text: opt, votes: 0 })),
                voters: [],
                createdBy: session.username,
                createdAt: new Date().toISOString()
            };

            sendMessage(currentChat, session.username, question, 'poll', pollData);
            window.closePollModal();
            showToast('✅ تم إرسال الاستطلاع بنجاح!', 'success');
            return false;
        };

        window.votePoll = function(roomId, pollId, optionIndex) {
            const room = db.chatRooms.find(r => r.id === roomId);
            if (!room) return;

            const msg = room.messages.find(m => m.data && m.data.id === pollId);
            if (!msg || !msg.data) return;

            if (msg.data.voters.includes(session.username)) {
                showToast('⚠️ لقد صوّت بالفعل.', 'warning');
                return;
            }

            msg.data.options[optionIndex].votes++;
            msg.data.voters.push(session.username);
            saveDB();
            render();
            showToast('✅ تم التصويت بنجاح!', 'success');
        };

        window.submitChangePassword = async function(ev) {
            ev.preventDefault();
            if (!session) return false;

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 6) {
                showToast('⚠️ كلمة المرور الجديدة 6 أحرف على الأقل.', 'warning');
                return false;
            }

            if (newPassword !== confirmPassword) {
                showToast('⚠️ كلمتا المرور غير متطابقتين.', 'warning');
                return false;
            }

            const servant = db.servants.find(s => s.username === session.username);
            if (!servant) {
                showToast('❌ المستخدم غير موجود.', 'error');
                return false;
            }

            const oldHash = await sha256(oldPassword);
            if (servant.passwordHash !== oldHash) {
                showToast('⚠️ كلمة المرور الحالية غير صحيحة.', 'warning');
                return false;
            }

            servant.passwordHash = await sha256(newPassword);
            await saveDB();
            window.closePasswordModal();
            showToast('✅ تم تغيير كلمة المرور بنجاح!', 'success');
            return false;
        };

                            <span class="q-correct-hint">${q.correct ? 'الإجابة الصحيحة: ' + esc(q.correct) : 'اختر الإجابة الصحيحة من الخيارات أعلاه'}</span>

        window.updateQuestionUI = function(select) {
            const card = select.closest('.question-card');
            const optionsContainer = card.querySelector('.q-options-container');
            const type = select.value;
            const correctContainer = card.querySelector('.q-correct-container');
            const modelAnswerContainer = card.querySelector('.q-model-answer-container');
            const optionsList = card.querySelector('.q-options-list');
            const addBtn = optionsContainer.querySelector('.btn-add');

            // إزالة جميع أحداث النقر السابقة من الخيارات
            optionsList.querySelectorAll('.q-option').forEach(inp => {
                inp.onclick = null;
                inp.style.borderColor = '';
                inp.style.background = '';
            });

            if (type === 'truefalse') {
                optionsList.innerHTML = `
                    <div class="option-item">
                        <input type="text" class="q-option" value="صح" readonly style="background:rgba(0,0,0,0.05);cursor:pointer;" />
                        <button type="button" class="btn-remove-option" disabled style="opacity:0.3;cursor:not-allowed;"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="option-item">
                        <input type="text" class="q-option" value="خطأ" readonly style="background:rgba(0,0,0,0.05);cursor:pointer;" />
                        <button type="button" class="btn-remove-option" disabled style="opacity:0.3;cursor:not-allowed;"><i class="fas fa-times"></i></button>
                    </div>
                `;
                if (addBtn) addBtn.style.display = 'none';
                correctContainer.style.display = 'block';
                // إضافة أحداث النقر للاختيار
                optionsList.querySelectorAll('.q-option').forEach(inp => {
                    inp.onclick = function() {
                        optionsList.querySelectorAll('.q-option').forEach(o => {
                            o.style.borderColor = '';
                            o.style.background = 'rgba(0,0,0,0.05)';
                        });
                        this.style.borderColor = 'var(--ok)';
                        this.style.background = 'rgba(46,125,50,0.1)';
                        const radio = correctContainer.querySelector('.q-correct-radio');
                        if (radio) radio.value = this.value;
                        correctContainer.querySelector('.q-correct-hint').textContent = 'الإجابة الصحيحة: ' + this.value;
                    };
                });
                // تعيين الإجابة الصحيحة إذا كانت موجودة
                const currentCorrect = correctContainer.querySelector('.q-correct-radio')?.value;
                if (currentCorrect) {
                    optionsList.querySelectorAll('.q-option').forEach(inp => {
                        if (inp.value === currentCorrect) {
                            inp.style.borderColor = 'var(--ok)';
                            inp.style.background = 'rgba(46,125,50,0.1)';
                        }
                    });
                }
            } else if (type === 'single' || type === 'multiple') {
                correctContainer.style.display = 'block';
                if (addBtn) addBtn.style.display = 'inline-flex';
                // إضافة أحداث النقر للاختيار
                optionsList.querySelectorAll('.q-option').forEach(inp => {
                    inp.onclick = function() {
                        if (type === 'single') {
                            optionsList.querySelectorAll('.q-option').forEach(o => {
                                o.style.borderColor = '';
                                o.style.background = '';
                            });
                        }
                        // Toggle
                        if (this.style.borderColor === 'var(--ok)') {
                            this.style.borderColor = '';
                            this.style.background = '';
                            if (type === 'single') {
                                const radio = correctContainer.querySelector('.q-correct-radio');
                                if (radio) radio.value = '';
                            }
                        } else {
                            this.style.borderColor = 'var(--ok)';
                            this.style.background = 'rgba(46,125,50,0.1)';
                            if (type === 'single') {
                                const radio = correctContainer.querySelector('.q-correct-radio');
                                if (radio) radio.value = this.value;
                            }
                        }
                        // Update hint
                        const selected = [];
                        optionsList.querySelectorAll('.q-option').forEach(o => {
                            if (o.style.borderColor === 'var(--ok)') selected.push(o.value);
                        });
                        const hint = correctContainer.querySelector('.q-correct-hint');
                        if (hint) hint.textContent = selected.length > 0 ? 'الإجابات الصحيحة: ' + selected.join('، ') : 'اختر الإجابة الصحيحة من الخيارات أعلاه';
                    };
                });
                // تعيين الإجابات الصحيحة إذا كانت موجودة
                const currentCorrect = correctContainer.querySelector('.q-correct-radio')?.value;
                if (currentCorrect) {
                    const correctValues = currentCorrect.split(',').map(s => s.trim());
                    optionsList.querySelectorAll('.q-option').forEach(inp => {
                        if (correctValues.includes(inp.value)) {
                            inp.style.borderColor = 'var(--ok)';
                            inp.style.background = 'rgba(46,125,50,0.1)';
                        }
                    });
                }
                correctContainer.querySelector('.q-correct-hint').textContent = 'انقر على الخيارات الصحيحة';
            } else if (type === 'essay' || type === 'complete') {
                optionsContainer.style.display = 'none';
                modelAnswerContainer.style.display = 'block';
                modelAnswerContainer.querySelector('.q-model-answer').placeholder = 'الإجابة النموذجية (سيتم تجاهل الأحرف المتشابهة)';
            }

            if (type !== 'essay' && type !== 'complete') {
                optionsContainer.style.display = 'block';
                modelAnswerContainer.style.display = 'none';
            }

            // تحديث النص الإرشادي
            if (type === 'truefalse' || type === 'single' || type === 'multiple') {
                const hint = correctContainer.querySelector('.q-correct-hint');
                if (hint && !hint.textContent.includes('الإجابة')) {
                    hint.textContent = type === 'truefalse' ? 'انقر على الإجابة الصحيحة (صح أو خطأ)' : 'انقر على الخيارات الصحيحة';
                }
            }
        };
