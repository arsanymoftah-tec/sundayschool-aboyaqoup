<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>منصة مدارس الأحد</title>
    <meta name="theme-color" content="#2196f3" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg-primary:#f0f8ff;--bg-secondary:#ffffff;--bg-glass:rgba(255,255,255,0.55);--bg-glass-hover:rgba(255,255,255,0.75);--text-primary:#0a1a2f;--text-secondary:#1a3a5c;--text-muted:#5a7a9a;--sky-dark:#2196f3;--sky-gradient:linear-gradient(145deg,#b3e0ff,#4fc3f7);--shadow:0 8px 32px rgba(33,150,243,0.15);--shadow-hover:0 16px 48px rgba(33,150,243,0.25);--border-glass:rgba(33,150,243,0.2);--ok:#2e7d32;--bad:#c62828;--gold:#f9a825;--pending:#f57c00;--admin-gradient:linear-gradient(135deg,#6a1b9a,#4a148c);--transition:all 0.4s cubic-bezier(0.23,1,0.32,1);--radius:32px;--radius-sm:16px;--chat-own:#e3f2fd;--chat-other:#f5f5f5;--correct:#4caf50;--wrong:#f44336;--sidebar-w:260px}
        [data-theme=dark]{--bg-primary:#0a1628;--bg-secondary:#13203a;--bg-glass:rgba(20,40,80,0.6);--bg-glass-hover:rgba(30,60,120,0.75);--text-primary:#e8f4fd;--text-secondary:#b0d4f0;--text-muted:#7a9ab8;--sky-dark:#64b5f6;--shadow:0 8px 32px rgba(0,0,0,0.4);--shadow-hover:0 16px 48px rgba(0,0,0,0.6);--border-glass:rgba(100,181,246,0.2);--ok:#66bb6a;--bad:#ef5350;--gold:#ffd54f;--pending:#ffa726;--chat-own:#1a2a4a;--chat-other:#1a2a3a;--correct:#66bb6a;--wrong:#ef5350}
        body{font-family:'El Messiri',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;transition:var(--transition);padding:0;position:relative;overflow-x:hidden}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(100,200,255,0.06) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(33,150,243,0.04) 0%,transparent 50%);animation:floatBg 25s ease-in-out infinite alternate;z-index:0;pointer-events:none}
        @keyframes floatBg{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-5%,5%) scale(1.05)}}
        .app-layout{display:flex;min-height:100vh;position:relative;z-index:1}
        .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border-glass);padding:16px 12px;display:flex;flex-direction:column;gap:6px;transition:var(--transition);position:sticky;top:0;height:100vh;overflow-y:auto}
        .sidebar::-webkit-scrollbar{width:4px}
        .sidebar::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        .sidebar .side-brand{font-family:'Lalezar',cursive;font-size:1.3rem;color:var(--text-primary);display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;text-decoration:none;border-radius:var(--radius-sm)}
        .sidebar .side-brand .mark{color:var(--sky-dark);font-size:1.6rem;animation:pulseGlow 3s ease-in-out infinite}
        @keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(33,150,243,0.3))}50%{filter:drop-shadow(0 0 24px rgba(33,150,243,0.6))}}
        .sidebar .sky-text{background:var(--sky-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .side-user{padding:10px 12px;background:var(--bg-glass-hover);border-radius:var(--radius-sm);margin-bottom:8px;border:1px solid var(--border-glass)}
        .side-user .name{font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:6px}
        .side-user .role{font-size:0.7rem;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:6px}
        .side-nav{display:flex;flex-direction:column;gap:4px;flex:1}
        .side-nav a{color:var(--text-secondary);padding:10px 14px;border-radius:var(--radius-sm);font-size:0.9rem;text-decoration:none;transition:var(--transition);display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid transparent}
        .side-nav a i{width:20px;text-align:center;font-size:1rem}
        .side-nav a:hover{background:var(--bg-glass-hover);color:var(--sky-dark);border-color:var(--border-glass);transform:translateX(-3px)}
        .side-nav a.active{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark);box-shadow:0 4px 20px rgba(33,150,243,0.3)}
        .side-nav a.active i{color:#fff}
        .side-nav .group-label{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;padding:10px 14px 4px;font-weight:700}
        .side-nav .badge{background:var(--bad);color:#fff;border-radius:50%;padding:0 6px;font-size:0.6rem;font-weight:700;min-width:18px;text-align:center;line-height:18px;margin-right:auto}
        .main-content{flex:1;min-width:0;padding:12px 16px 60px}
        .container{max-width:1300px;margin:0 auto;padding:0}
        .glass{background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;transition:var(--transition);position:relative;overflow:hidden}
        .glass:hover{background:var(--bg-glass-hover);border-color:var(--sky-dark);box-shadow:var(--shadow-hover)}
        .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
        .top-bar .page-title{font-family:'Lalezar',cursive;font-size:1.6rem;display:flex;align-items:center;gap:10px}
        .top-bar .page-title i{color:var(--sky-dark)}
        .top-bar .top-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .theme-toggle{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:40px;padding:6px 14px;cursor:pointer;color:var(--text-secondary);font-size:1.1rem;transition:var(--transition);backdrop-filter:blur(8px)}
        .theme-toggle:hover{background:var(--sky-dark);border-color:var(--sky-dark);color:#fff;transform:rotate(20deg)}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;border:none;font-family:'El Messiri',sans-serif;font-size:0.9rem;cursor:pointer;transition:var(--transition);font-weight:600;text-decoration:none;position:relative;overflow:hidden}
        .btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);opacity:0;transition:opacity 0.4s}
        .btn:hover::after{opacity:1}
        .btn-primary{background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#fff;box-shadow:0 4px 20px rgba(33,150,243,0.35)}
        .btn-primary:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 32px rgba(33,150,243,0.5)}
        .btn-secondary{background:var(--bg-glass);color:var(--text-secondary);border:1px solid var(--border-glass);backdrop-filter:blur(8px)}
        .btn-secondary:hover{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark);transform:translateY(-3px)}
        .btn-gold{background:linear-gradient(135deg,#ffd54f,#f9a825);color:#0a1628;box-shadow:0 4px 20px rgba(249,168,37,0.3)}
        .btn-gold:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 32px rgba(249,168,37,0.5)}
        .btn-sm{padding:5px 12px;font-size:0.75rem}
        .btn-ok{background:rgba(46,125,50,0.15);color:var(--ok);border:1px solid rgba(46,125,50,0.3)}
        .btn-ok:hover{background:var(--ok);color:#fff}
        .btn-bad{background:rgba(198,40,40,0.15);color:var(--bad);border:1px solid rgba(198,40,40,0.3)}
        .btn-bad:hover{background:var(--bad);color:#fff}
        .btn-add{background:rgba(33,150,243,0.15);color:var(--sky-dark);border:1px solid rgba(33,150,243,0.3)}
        .btn-add:hover{background:var(--sky-dark);color:#fff}
        .form{display:flex;flex-direction:column;gap:12px}
        .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
        label{display:flex;flex-direction:column;gap:4px;font-size:0.85rem;color:var(--text-secondary);flex:1 1 160px}
        input,select,textarea{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-glass);background:var(--bg-glass);backdrop-filter:blur(8px);font-size:0.95rem;font-family:inherit;color:var(--text-primary);transition:var(--transition)}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 4px rgba(33,150,243,0.12);background:var(--bg-glass-hover)}
        textarea{min-height:80px;resize:vertical}
        .table-wrap{overflow-x:auto;border-radius:var(--radius-sm);background:rgba(0,0,0,0.03);padding:4px}
        table{width:100%;border-collapse:collapse;font-size:0.85rem}
        th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--border-glass);vertical-align:middle}
        th{color:var(--sky-dark);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:1px}
        tr:hover td{background:rgba(33,150,243,0.04)}
        .badge{padding:2px 12px;border-radius:40px;font-size:0.7rem;font-weight:600;display:inline-block}
        .badge-ok{background:rgba(46,125,50,0.15);color:var(--ok);border:1px solid rgba(46,125,50,0.2)}
        .badge-bad{background:rgba(198,40,40,0.15);color:var(--bad);border:1px solid rgba(198,40,40,0.2)}
        .badge-pending{background:rgba(245,124,0,0.15);color:var(--pending);border:1px solid rgba(245,124,0,0.2)}
        .badge-correct{background:rgba(76,175,80,0.15);color:var(--correct);border:1px solid rgba(76,175,80,0.2)}
        .badge-wrong{background:rgba(244,67,54,0.15);color:var(--wrong);border:1px solid rgba(244,67,54,0.2)}
        .badge-info{background:rgba(33,150,243,0.15);color:var(--sky-dark);border:1px solid rgba(33,150,243,0.2)}
        .code-pill{background:rgba(33,150,243,0.1);color:var(--sky-dark);padding:2px 14px;border-radius:40px;font-weight:700;letter-spacing:1px;border:1px solid rgba(33,150,243,0.15);font-size:0.75rem;font-family:monospace}
        .copy-btn{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:30px;padding:3px 10px;color:var(--text-muted);cursor:pointer;transition:var(--transition);font-size:0.7rem;display:inline-flex;align-items:center;gap:4px}
        .copy-btn:hover{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark)}
        .alert{padding:10px 18px;border-radius:var(--radius-sm);margin-bottom:12px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;font-size:0.9rem}
        .alert-success{background:rgba(46,125,50,0.12);border:1px solid rgba(46,125,50,0.2);color:var(--ok)}
        .alert-error{background:rgba(198,40,40,0.12);border:1px solid rgba(198,40,40,0.2);color:var(--bad)}
        .alert-warning{background:rgba(245,124,0,0.12);border:1px solid rgba(245,124,0,0.2);color:var(--pending)}
        .alert-info{background:rgba(33,150,243,0.12);border:1px solid rgba(33,150,243,0.2);color:var(--sky-dark)}
        .empty{color:var(--text-muted);text-align:center;padding:30px 0;font-size:0.9rem}
        .panel{max-width:480px;margin:0 auto}
        .status-group{display:flex;gap:14px}
        .status-group label{flex-direction:row;align-items:center;gap:4px;color:var(--text-secondary);font-size:0.85rem;flex:0 1 auto}
        .status-group input[type=radio]{accent-color:var(--sky-dark);width:16px;height:16px}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
        .stat-card{background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:16px;text-align:center;transition:var(--transition)}
        .stat-card:hover{transform:translateY(-4px);border-color:var(--sky-dark);box-shadow:var(--shadow-hover)}
        .stat-card .num{font-size:2rem;font-family:'Lalezar',cursive;color:var(--sky-dark);line-height:1}
        .stat-card .label{color:var(--text-muted);font-size:0.75rem;margin-top:4px}
        .stat-card .icon{font-size:1.4rem;color:var(--sky-dark);opacity:0.4;margin-bottom:6px}
        .chart-bar-row{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 0;border-bottom:2px solid var(--border-glass);margin-bottom:8px}
        .chart-bar{flex:1;background:var(--sky-gradient);border-radius:8px 8px 0 0;min-height:4px;position:relative;transition:var(--transition);cursor:pointer}
        .chart-bar:hover{filter:brightness(1.15);transform:scaleY(1.03)}
        .chart-bar .val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:0.7rem;font-weight:700;color:var(--sky-dark);white-space:nowrap}
        .chart-bar .lbl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:0.65rem;color:var(--text-muted);white-space:nowrap}
        .dist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.85rem}
        .dist-row .name{min-width:120px;font-weight:600;color:var(--text-secondary)}
        .dist-row .bar{flex:1;height:22px;background:var(--bg-glass);border-radius:20px;overflow:hidden;border:1px solid var(--border-glass)}
        .dist-row .fill{height:100%;background:var(--sky-gradient);border-radius:20px;transition:width 0.6s ease;display:flex;align-items:center;justify-content:flex-end;padding-left:8px;color:#fff;font-size:0.75rem;font-weight:700}
        .dist-row .count{min-width:60px;text-align:left;color:var(--sky-dark);font-weight:700}
        .search-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:8px 12px;backdrop-filter:blur(8px)}
        .search-bar input,.search-bar select{flex:1 1 140px;padding:8px 14px;border-radius:30px;border:1px solid var(--border-glass);background:var(--bg-secondary);font-size:0.85rem;color:var(--text-primary);font-family:inherit}
        .search-bar input:focus,.search-bar select:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 4px rgba(33,150,243,0.12)}
        .search-bar .search-icon{color:var(--text-muted);font-size:1rem;padding:0 6px}
        .barcode-btn{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:30px;padding:6px 14px;color:var(--sky-dark);cursor:pointer;transition:var(--transition);font-size:0.8rem;display:flex;align-items:center;gap:6px}
        .barcode-btn:hover{background:var(--sky-dark);color:#fff;border-color:var(--sky-dark)}
        .chat-container{display:flex;gap:16px;height:65vh;min-height:420px}
        .chat-list{width:260px;min-width:200px;overflow-y:auto;padding:4px}
        .chat-list::-webkit-scrollbar{width:4px}
        .chat-list::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        .chat-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);margin-bottom:4px;border:1px solid transparent}
        .chat-item:hover{background:var(--bg-glass-hover);border-color:var(--border-glass)}
        .chat-item.active{background:var(--bg-glass-hover);border-color:var(--sky-dark)}
        .chat-item .avatar{width:32px;height:32px;border-radius:50%;background:var(--sky-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.8rem;flex-shrink:0}
        .chat-item .avatar.admin-avatar{background:var(--admin-gradient)}
        .chat-item .chat-info{flex:1;min-width:0}
        .chat-item .chat-name{font-weight:600;font-size:0.85rem;color:var(--text-primary)}
        .chat-item .chat-last-msg{font-size:0.7rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-item .chat-time{font-size:0.55rem;color:var(--text-muted);flex-shrink:0}
        .chat-item .chat-badge{background:var(--sky-dark);color:#fff;border-radius:50%;padding:0 5px;font-size:0.55rem;font-weight:700;min-width:16px;text-align:center;line-height:16px}
        .chat-item .chat-type{font-size:0.5rem;padding:1px 6px;border-radius:40px;background:var(--bg-glass);color:var(--text-muted);border:1px solid var(--border-glass)}
        .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
        .chat-header{padding:8px 12px;border-bottom:1px solid var(--border-glass);display:flex;align-items:center;gap:8px}
        .chat-header .avatar{width:30px;height:30px;border-radius:50%;background:var(--sky-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;flex-shrink:0}
        .chat-header .chat-with{font-weight:600;font-size:0.9rem}
        .chat-header .chat-type-badge{font-size:0.55rem;padding:1px 8px;border-radius:40px;background:var(--bg-glass);color:var(--text-muted);border:1px solid var(--border-glass)}
        .chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
        .chat-messages::-webkit-scrollbar{width:4px}
        .chat-messages::-webkit-scrollbar-thumb{background:var(--sky-dark);border-radius:10px}
        .message{max-width:75%;padding:6px 12px;border-radius:10px;animation:messageIn 0.3s ease;border:1px solid var(--border-glass);font-size:0.85rem}
        @keyframes messageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .message.own{align-self:flex-end;background:var(--chat-own);border-bottom-left-radius:4px}
        .message.other{align-self:flex-start;background:var(--chat-other);border-bottom-right-radius:4px}
        .message .msg-sender{font-size:0.65rem;font-weight:600;color:var(--sky-dark);margin-bottom:2px}
        .message .msg-text{font-size:0.85rem;line-height:1.6;word-wrap:break-word}
        .message .msg-time{font-size:0.5rem;color:var(--text-muted);margin-top:3px;text-align:left}
        .poll-message{background:var(--bg-glass);border:2px solid var(--sky-dark);border-radius:var(--radius-sm);padding:12px;max-width:85%;align-self:flex-start}
        .poll-message .poll-question{font-weight:600;font-size:0.9rem;margin-bottom:6px}
        .poll-message .poll-option{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:var(--transition);margin-bottom:3px;border:1px solid var(--border-glass);font-size:0.8rem}
        .poll-message .poll-option:hover{background:var(--bg-glass-hover)}
        .poll-message .poll-option.voted{border-color:var(--sky-dark);background:rgba(33,150,243,0.1)}
        .poll-message .poll-option .poll-bar{flex:1;height:4px;background:var(--bg-glass);border-radius:10px;overflow:hidden}
        .poll-message .poll-option .poll-bar .poll-fill{height:100%;background:var(--sky-gradient);border-radius:10px;transition:width 0.5s ease}
        .poll-message .poll-option .poll-percent{font-size:0.7rem;color:var(--text-muted);min-width:30px;text-align:left}
        .chat-input{padding:8px 12px;border-top:1px solid var(--border-glass);display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:relative}
        .chat-input .input-wrapper{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
        .chat-input input{flex:1;padding:8px 14px;border-radius:30px;border:1px solid var(--border-glass);background:var(--bg-glass);backdrop-filter:blur(8px);font-size:0.85rem;font-family:inherit;color:var(--text-primary);transition:var(--transition);min-width:0}
        .chat-input input:focus{outline:none;border-color:var(--sky-dark);box-shadow:0 0 0 4px rgba(33,150,243,0.12)}
        .chat-input .emoji-btn{padding:6px 10px;border-radius:50%;border:1px solid var(--border-glass);background:var(--bg-glass);cursor:pointer;font-size:1rem;transition:var(--transition)}
        .chat-input .emoji-btn:hover{background:var(--bg-glass-hover);transform:scale(1.05)}
        .chat-input .poll-btn{padding:6px 12px;border-radius:30px;border:1px solid var(--border-glass);background:var(--bg-glass);cursor:pointer;font-size:0.7rem;transition:var(--transition);display:flex;align-items:center;gap:4px}
        .chat-input .poll-btn:hover{background:var(--bg-glass-hover);transform:scale(1.02)}
        .chat-input .send-btn{padding:8px 16px;border-radius:30px;border:none;background:var(--sky-dark);color:#fff;font-size:0.9rem;cursor:pointer;transition:var(--transition)}
        .chat-input .send-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(33,150,243,0.3)}
        .emoji-picker{display:none;position:absolute;bottom:60px;left:10px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-sm);padding:10px;box-shadow:var(--shadow-hover);z-index:100;width:240px;max-height:180px;overflow-y:auto}
        .emoji-picker.open{display:block}
        .emoji-picker .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
        .emoji-picker .emoji-grid span{font-size:1.2rem;cursor:pointer;text-align:center;padding:3px;border-radius:6px;transition:var(--transition)}
        .emoji-picker .emoji-grid span:hover{background:var(--bg-glass-hover);transform:scale(1.2)}

        .mobile-menu-btn{display:none;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:40px;padding:6px 12px;cursor:pointer;color:var(--text-secondary);font-size:1.1rem}
        .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(2px);z-index:1500}
        .backdrop.active{display:block}
        /* Exam Focus Mode */

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuGob9_AWGsDiAaJgB6XWWye-eEhMBVOo",
            authDomain: "sunday-school-platform-8a08a.firebaseapp.com",
            projectId: "sunday-school-platform-8a08a",
            storageBucket: "sunday-school-platform-8a08a.firebasestorage.app",
            messagingSenderId: "137098154880",
            appId: "1:137098154880:web:c0731bcedfe384aba72765"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const firestore = getFirestore(firebaseApp);
        const dataDocRef = doc(firestore, "sunday-school", "data");

        const EMOJIS = ['😊','😂','❤️','👍','🙏','🌟','🔥','💪','🎉','✨','😍','🤗','😅','🤔','😢','😡','🥳','🤩','😎','🧡','💙','💚','💛','💜','🖤','🤍','💝','💖','💗','💓','💞','💕','💘','💟','☮️','✝️','☦️','🕊️','🙌','👏','🤝','✌️','👋','💯','🔥','⚡','⭐','🌙','☀️','🌈','☁️','❄️','🌊','🌺','🌸','🌹','🌷','🌻','🌼','🌿','🌱','🍀','🌳'];

        let db = { servants: [], children: [], attendance: [], classes: [], chatRooms: [], polls: [], exams: [], examResults: [] };
        let session = null;
        let route = 'home';
        let routeParam = null;
        let flash = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentChat = null;
        let examTimerInterval = null;
        let editingExamId = null;
        let barcodeStream = null;
        let barcodeDetector = null;
        let barcodeScanning = false;
        let barcodeMode = 'lookup'; // 'lookup' | 'attendance'
        let sidebarOpen = false;
        let lastPendingCount = 0;

        let childSearchQuery = '';
        let childClassFilter = '';
        let examSearchQuery = '';
        let examStatusFilter = '';

        function saveSession(username, name, isAdmin) { localStorage.setItem('session', JSON.stringify({ username, name, isAdmin })); }
        function loadSession() { try { const s = localStorage.getItem('session'); if (s) return JSON.parse(s); } catch (e) {} return null; }
        function clearSession() { localStorage.removeItem('session'); }

        async function loadDB() {
            try {
                const snap = await getDoc(dataDocRef);
                if (snap.exists()) {
                    const data = snap.data();
                    db = data.payload ? data.payload : data;
                } else {
                    db = { servants: [], children: [], attendance: [], classes: [], chatRooms: [], polls: [], exams: [], examResults: [] };
                    await saveDB();
                }
                ['servants','children','attendance','classes','chatRooms','polls','exams','examResults'].forEach(k => { if (!db[k]) db[k] = []; });
                db.servants = db.servants.map(s => ({ ...s, isActive: s.isActive !== undefined ? s.isActive : false, isAdmin: s.isAdmin || false, isPending: s.isPending !== undefined ? s.isPending : true, assignedClass: s.assignedClass || null, pendingSince: s.pendingSince || null }));
            } catch (e) { console.error('❌ تحميل:', e); showToast('تعذر الاتصال بقاعدة البيانات.', 'error'); }
        }
        async function saveDB() { try { await setDoc(dataDocRef, { payload: db }); } catch (e) { console.error('❌ حفظ:', e); showToast('حدث خطأ أثناء حفظ البيانات.', 'error'); } }
        function watchDB() {
            onSnapshot(dataDocRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    db = data.payload ? data.payload : data;
                    ['servants','children','attendance','classes','chatRooms','polls','exams','examResults'].forEach(k => { if (!db[k]) db[k] = []; });
                    db.servants = db.servants.map(s => ({ ...s, isActive: s.isActive !== undefined ? s.isActive : false, isAdmin: s.isAdmin || false, isPending: s.isPending !== undefined ? s.isPending : true, assignedClass: s.assignedClass || null, pendingSince: s.pendingSince || null }));
                    updateChatBadge();
                    render();
                }
            });
        }
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            localStorage.setItem('theme', theme);
            document.querySelectorAll('.theme-toggle i').forEach(i => i.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon');
        }
        function toggleTheme() { applyTheme(currentTheme === 'light' ? 'dark' : 'light'); }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };

        // ==== FIXED: Comprehensive Arabic text normalization ====
        function normalizeText(text) {
            if (text === null || text === undefined) return '';
            let t = text.toString();
            t = t.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');
            t = t.replace(/\s+/g, ' ').trim();
            t = t.replace(/[أإآٱا]/g, 'ا');
            t = t.replace(/[ىئي]/g, 'ي');
            t = t.replace(/[ؤو]/g, 'و');
            t = t.replace(/[ةه]/g, 'ه');
            t = t.replace(/[کگ]/g, 'ك');
            t = t.replace(/[.,،؛;:!?؟"'`«»\-\_\(\)\[\]\{\}]/g, '');
            t = t.replace(/\s+/g, '');
            return t.toLowerCase();
        }
        function isAnswerCorrect(userAnswer, modelAnswer) {
            if (!modelAnswer || !userAnswer) return false;
            if (normalizeText(userAnswer) === normalizeText(modelAnswer)) return true;
            const uWords = userAnswer.toString().trim().split(/\s+/).map(normalizeText).filter(Boolean).sort();
            const mWords = modelAnswer.toString().trim().split(/\s+/).map(normalizeText).filter(Boolean).sort();
            if (uWords.length === mWords.length && uWords.length > 0 && uWords.join('|') === mWords.join('|')) return true;
            return false;
        }

        // ==== REAL Code128 barcode ====
        function generateBarcodeSVG(text, opts = {}) {
            const code = (text || '').toUpperCase().trim();
            const height = opts.height || 80;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            svg.style.background = '#fff';
            try {
                JsBarcode(svg, code, {
                    format: 'CODE128',
                    width: 2,
                    height: Math.max(30, height - 20),
                    displayValue: true,
                    fontSize: 14,
                    font: 'monospace',
                    fontOptions: 'bold',
                    textMargin: 4,
                    margin: 8,
                    background: '#ffffff',
                    lineColor: '#000000'
                });
                const bbox = svg.getBBox();
                if (bbox.width && bbox.height) {
                    svg.setAttribute('viewBox', `0 0 ${Math.ceil(bbox.width)} ${Math.ceil(bbox.height)}`);
                    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                }
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.style.display = 'block';
                svg.style.maxWidth = '100%';
                svg.style.height = 'auto';
                return svg.outerHTML;
            } catch (e) {
                console.error('Barcode failed:', e);
                return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" style="background:#fff;">
                    <text x="150" y="45" text-anchor="middle" font-family="monospace" font-size="14" fill="#000">${esc(code)}</text>
                </svg>`;
            }
        }

        async function scanBarcodeLoop() {
            const video = document.getElementById('barcodeVideo');
            if (!barcodeScanning || !barcodeDetector) return;

                const barcodes = await barcodeDetector.detect(video);
                if (barcodes.length > 0) {

                        return requestAnimationFrame(scanBarcodeLoop);

                        resultBox.innerHTML = `<div class="alert alert-success"><i class="fas fa-check-circle"></i> تم مسح الكود: <strong>${esc(code)}</strong></div>`;

        function getChatRooms(user) {
            if (!user) return [];
            const rooms = [];
            db.chatRooms.forEach(room => { if (room.participants && room.participants.includes(user.username)) rooms.push(room); });
            if (user.isAdmin) {
                getActiveServants().filter(s => !s.isAdmin).forEach(servant => {

                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = { id: roomId, type: 'admin-servant', name: servant.name, participants: [user.username, servant.username], createdBy: user.username, createdAt: new Date().toISOString(), messages: [], lastMessage: 'لا توجد رسائل بعد', lastMessageTime: new Date().toISOString(), unreadCount: {} };
                        db.chatRooms.push(newRoom); saveDB(); rooms.push(newRoom);
                    } else { const e = db.chatRooms.find(r => r.id === roomId); if (e) rooms.push(e); }
                });
            }
            if (!user.isAdmin) {
                getAdmins().forEach(admin => {
                    const roomId = `chat_admin_${admin.username}_${user.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = { id: roomId, type: 'admin-servant', name: admin.name, participants: [admin.username, user.username], createdBy: admin.username, createdAt: new Date().toISOString(), messages: [], lastMessage: 'لا توجد رسائل بعد', lastMessageTime: new Date().toISOString(), unreadCount: {} };
                        db.chatRooms.push(newRoom); saveDB(); rooms.push(newRoom);
                    } else { const e = db.chatRooms.find(r => r.id === roomId); if (e) rooms.push(e); }
                });
                getActiveServants().filter(s => !s.isAdmin && s.username !== user.username).forEach(servant => {
                    const roomId = `chat_servant_${user.username}_${servant.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = { id: roomId, type: 'servant-servant', name: servant.name, participants: [user.username, servant.username], createdBy: user.username, createdAt: new Date().toISOString(), messages: [], lastMessage: 'لا توجد رسائل بعد', lastMessageTime: new Date().toISOString(), unreadCount: {} };
                        db.chatRooms.push(newRoom); saveDB(); rooms.push(newRoom);
                    } else { const e = db.chatRooms.find(r => r.id === roomId); if (e) rooms.push(e); }
                });
            }
            if (user.isAdmin) {
                getAdmins().filter(a => a.username !== user.username).forEach(admin => {
                    const roomId = `chat_admin_${user.username}_${admin.username}`;
                    if (!db.chatRooms.some(r => r.id === roomId)) {
                        const newRoom = { id: roomId, type: 'admin-admin', name: admin.name, participants: [user.username, admin.username], createdBy: user.username, createdAt: new Date().toISOString(), messages: [], lastMessage: 'لا توجد رسائل بعد', lastMessageTime: new Date().toISOString(), unreadCount: {} };
                        db.chatRooms.push(newRoom); saveDB(); rooms.push(newRoom);
                    } else { const e = db.chatRooms.find(r => r.id === roomId); if (e) rooms.push(e); }
                });
            }
            return rooms.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
        }
        function sendMessage(roomId, from, text, type = 'text', data = null) {
            const room = db.chatRooms.find(r => r.id === roomId);

            const message = { id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6), from, text: text.trim(), type, data, timestamp: new Date().toISOString(), readBy: [from] };
            room.messages.push(message);
            room.lastMessage = text.trim() || (type === 'poll' ? '📊 استطلاع رأي' : '');
            room.lastMessageTime = new Date().toISOString();
            room.participants.forEach(p => { if (p !== from) { if (!room.unreadCount) room.unreadCount = {}; room.unreadCount[p] = (room.unreadCount[p] || 0) + 1; } });
            saveDB(); render(); updateChatBadge();
        }

            if (!servant) { showToast('❌ المستخدم غير موجود.', 'error'); return false; }
            const oldHash = await sha256(oldP);
            if (servant.passwordHash !== oldHash) { showToast('⚠️ كلمة المرور الحالية غير صحيحة.', 'warning'); return false; }
            servant.passwordHash = await sha256(newP);
            await saveDB();
            window.closePasswordModal();
            showToast('✅ تم تغيير كلمة المرور بنجاح!', 'success');
            return false;
        };

        window.updateQuestionUI = function(select) {

            optionsList.querySelectorAll('.q-option-radio:checked').forEach(r => existingCorrect.push(r.value));

                addBtn.style.display = 'none';

                    const checked = existingCorrect.includes(opt) ? 'checked' : '';
                    item.innerHTML = `
                        <input type="radio" class="q-option-radio" name="correct_${qidx}" value="${opt}" ${checked} style="width:18px;height:18px;accent-color:var(--ok);cursor:pointer;flex-shrink:0;" />

                });
            } else if (type === 'single' || type === 'multiple') {
                addBtn.style.display = 'inline-flex';
                optionsContainer.style.display = 'block';
                modelAnswerContainer.style.display = 'none';
                const opts = existingOptions.length ? existingOptions : ['أ', 'ب', 'ج', 'د'];
                opts.forEach((opt, i) => {
                    const item = document.createElement('div');
                    item.className = 'option-item';
                    const radioType = type === 'single' ? 'radio' : 'checkbox';
                    const checked = existingCorrect.includes(opt) ? 'checked' : '';
                    item.innerHTML = `
                        <input type="${radioType}" class="q-option-radio" name="correct_${qidx}" value="${esc(opt)}" ${checked} style="width:18px;height:18px;accent-color:var(--ok);cursor:pointer;flex-shrink:0;" />
                        <input type="text" class="q-option" value="${esc(opt)}" placeholder="الخيار ${i + 1}" />

        window.submitExam = async function(ev) {
            ev.preventDefault();
            if (!session) return false;
            const editId = document.getElementById('editExamId').value;
            const name = document.getElementById('examName').value.trim();
            const description = document.getElementById('examDescription').value.trim();
            const duration = parseInt(document.getElementById('examDuration').value);
            const attempts = parseInt(document.getElementById('examAttempts').value);
            const classId = document.getElementById('examClass').value;
            const status = document.getElementById('examStatus').value;
            if (!name || !classId) { showToast('⚠️ أكمل جميع الحقول المطلوبة.', 'warning'); return false; }
            const questionCards = document.querySelectorAll('#questionsContainer .question-card');
            const questions = [];
            let valid = true;
            questionCards.forEach((card, idx) => {
                const text = card.querySelector('.q-text').value.trim();
                const type = card.querySelector('.q-type').value;
                const points = parseInt(card.querySelector('.q-points').value) || 1;
                let options = [];
                let correct = '';
                let modelAnswer = '';
                if (type === 'multiple' || type === 'single' || type === 'truefalse') {
                    const optionInputs = card.querySelectorAll('.q-option');
                    optionInputs.forEach(inp => { const v = inp.value.trim(); if (v) options.push(v); });
                    const checkedRadios = card.querySelectorAll('.q-option-radio:checked');
                    const vals = Array.from(checkedRadios).map(r => r.value.trim()).filter(v => v);
                    if (vals.length) correct = vals.join(',');
                } else if (type === 'essay' || type === 'complete') {
                    modelAnswer = card.querySelector('.q-model-answer').value.trim();
                }
                if (!text) { showToast(`⚠️ السؤال ${idx + 1} لا يحتوي على نص.`, 'warning'); valid = false; return; }
                if ((type === 'multiple' || type === 'single') && options.length < 2) { showToast(`⚠️ السؤال ${idx + 1} يحتاج إلى خيارين على الأقل.`, 'warning'); valid = false; return; }
                if ((type === 'single' || type === 'truefalse') && !correct) { showToast(`⚠️ السؤال ${idx + 1} يحتاج إلى إجابة صحيحة (اضغط على الدائرة).`, 'warning'); valid = false; return; }
                questions.push({ id: 'q_' + Date.now() + '_' + idx, text, type, points, options, correct, modelAnswer });
            });
            if (!valid || questions.length === 0) {
                if (questions.length === 0) showToast('⚠️ أضف سؤالاً واحداً على الأقل.', 'warning');
                return false;
            }
            const totalPoints = questions.reduce((s, q) => s + q.points, 0);
            if (editId) {
                const exam = db.exams.find(e => e.id === editId);
                if (exam) {
                    exam.name = name; exam.description = description; exam.duration = duration;
                    exam.attempts = attempts; exam.classId = classId; exam.status = status;
                    exam.questions = questions; exam.totalPoints = totalPoints;
                    exam.updatedAt = new Date().toISOString();
                }
                await saveDB();
                window.closeExamModal();
                showToast(`✅ تم تعديل الاختبار "${name}" بنجاح!`, 'success');
            } else {
                const examCode = genExamCode();
                const exam = { id: 'exam_' + Date.now(), code: examCode, name, description, duration, attempts, classId, status, servantUsername: session.username, questions, createdAt: new Date().toISOString(), totalPoints, startTime: null, endTime: null };
                db.exams.push(exam);
                await saveDB();
                window.closeExamModal();
                showToast(`✅ تم إنشاء الاختبار "${name}" بنجاح! كود: ${examCode}`, 'success');
            }
            render();
            return false;
        };
        window.deleteExam = async function(examId) {
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) return;
            if (!confirm(`⚠️ هل أنت متأكد من حذف الاختبار "${exam.name}" وجميع نتائجه؟`)) return;
            db.exams = db.exams.filter(e => e.id !== examId);
            db.examResults = db.examResults.filter(r => r.examId !== examId);
            await saveDB();
            showToast(`🗑️ تم حذف الاختبار "${exam.name}"`, 'success');
            render();
        };
        window.startExam = function(examId, childId) {
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) { showToast('❌ الاختبار غير موجود.', 'error'); return; }
            if (exam.status === 'closed') { showToast('⚠️ هذا الاختبار مغلق.', 'warning'); return; }
            const results = db.examResults.filter(r => r.examId === examId && r.childId === childId);
            const completedCount = results.filter(r => r.status === 'completed').length;
            if (completedCount >= exam.attempts) { showToast('⚠️ لقد استهلكت جميع محاولاتك.', 'warning'); return; }
            const pendingResult = results.find(r => r.status === 'in-progress');
            if (pendingResult) { renderExamQuestions(exam, childId, pendingResult); return; }
            const result = {
                id: 'result_' + Date.now(), examId, childId,
                startedAt: new Date().toISOString(), status: 'in-progress',
                answers: {}, score: 0, totalPoints: exam.totalPoints,
                attempts: completedCount + 1
            };
            db.examResults.push(result);
            saveDB();
            renderExamQuestions(exam, childId, result);
        };
        function renderExamQuestions(exam, childId, result) {
            document.body.classList.add('exam-focus-mode');
            const modal = document.getElementById('takeExamModal');
            document.getElementById('takeExamTitle').textContent = `📝 ${exam.name}`;
            const startTime = new Date(result.startedAt);
            const endTime = new Date(startTime.getTime() + exam.duration * 60000);
            const now = new Date();
            let timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));
            if (examTimerInterval) clearInterval(examTimerInterval);
            const timerDisplay = document.getElementById('takeExamTimer');
            examTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) { clearInterval(examTimerInterval); timerDisplay.textContent = '⏰ انتهى الوقت!'; submitExamAnswers(exam.id, childId, true); return; }
                const mins = Math.floor(timeLeft / 60); const secs = timeLeft % 60;
                timerDisplay.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                timerDisplay.style.color = timeLeft < 60 ? 'var(--bad)' : 'var(--ok)';
            }, 1000);
            const container = document.getElementById('takeExamContent');
            let html = `
                <div style="margin-bottom:12px;">
                    <p style="color:var(--text-muted);font-size:0.85rem;">${esc(exam.description || '')}</p>
                    <p style="color:var(--text-muted);font-size:0.8rem;">الدرجة الكلية: ${exam.totalPoints} | عدد الأسئلة: ${exam.questions.length}</p>
                    <p style="color:var(--text-muted);font-size:0.8rem;">المحاولة رقم ${result.attempts} من ${exam.attempts}</p>
                </div>
                <form id="examForm" onsubmit="event.preventDefault();">
            `;
            exam.questions.forEach((q, idx) => {
                const savedAnswer = result.answers[q.id] || '';
                const isEssay = q.type === 'essay' || q.type === 'complete';
                html += `
                    <div class="question-card">
                        <div class="question-text">
                            ${idx + 1}. ${esc(q.text)} 
                            <span style="font-size:0.7rem;color:var(--text-muted);">(${q.points} درجة)</span>
                            <span style="font-size:0.6rem;color:var(--text-muted);margin-right:6px;">[${q.type === 'truefalse' ? 'صح/خطأ' : q.type === 'single' ? 'اختيار واحد' : q.type === 'multiple' ? 'اختيار متعدد' : q.type === 'essay' ? 'مقالي' : 'أكمل'}]</span>
                        </div>
                        <div class="question-options">
                `;
                if (q.type === 'truefalse') {
                    html += `<label><input type="radio" name="q_${q.id}" value="صح" ${savedAnswer === 'صح' ? 'checked' : ''} /> صح</label>
                             <label><input type="radio" name="q_${q.id}" value="خطأ" ${savedAnswer === 'خطأ' ? 'checked' : ''} /> خطأ</label>`;
                } else if (q.type === 'single') {
                    q.options.forEach(opt => { html += `<label><input type="radio" name="q_${q.id}" value="${esc(opt)}" ${savedAnswer === opt ? 'checked' : ''} /> ${esc(opt)}</label>`; });
                } else if (q.type === 'multiple') {
                    const savedAnswers = savedAnswer ? savedAnswer.split(',') : [];
                    q.options.forEach(opt => {
                        const checked = savedAnswers.includes(opt) ? 'checked' : '';
                        html += `<label><input type="checkbox" name="q_${q.id}" value="${esc(opt)}" ${checked} /> ${esc(opt)}</label>`;
                    });
                } else if (isEssay) {
                    html += `<textarea name="q_${q.id}" style="width:100%;min-height:60px;" placeholder="اكتب إجابتك هنا...">${esc(savedAnswer)}</textarea>`;
                }
                html += `</div></div>`;
            });
            html += `
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button type="button" class="btn btn-primary" onclick="window.submitExamAnswers('${exam.id}','${childId}',false)"><i class="fas fa-check"></i> تسليم الاختبار</button>
                        <button type="button" class="btn btn-secondary" onclick="window.closeTakeExamModal()"><i class="fas fa-times"></i> إلغاء</button>
                    </div>
                </form>
            `;
            container.innerHTML = html;
            modal.classList.add('active');
        }
        // ==== FIXED submit & scoring ====
        window.submitExamAnswers = async function(examId, childId, autoSubmit = false) {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) { showToast('❌ الاختبار غير موجود.', 'error'); return; }
            const result = db.examResults.find(r => r.examId === examId && r.childId === childId && r.status === 'in-progress');
            if (!result) { showToast('❌ لا توجد محاولة نشطة.', 'error'); return; }
            const answers = {};
            let totalScore = 0;
            if (!autoSubmit) {
                const form = document.getElementById('examForm');
                if (!form) autoSubmit = true;
                if (form) {
                    form.querySelectorAll('input, textarea').forEach(input => {
                        const key = input.name.replace('q_', '');
                        if (input.type === 'radio') {
                            if (input.checked) answers[key] = input.value;
                        } else if (input.type === 'checkbox') {
                            if (input.checked) { if (!answers[key]) answers[key] = []; answers[key].push(input.value); }
                        } else if (input.type === 'text' || input.type === 'textarea') {
                            const v = input.value.trim();
                            if (v) answers[key] = v;
                        }
                    });
                    Object.keys(answers).forEach(k => { if (Array.isArray(answers[k])) answers[k] = answers[k].join(','); });
                }
            } else { Object.assign(answers, result.answers || {}); }
            // Scoring with comprehensive normalization
            exam.questions.forEach(q => {
                const userAnswer = (answers[q.id] || '').toString();
                let isCorrect = false;
                if (q.type === 'truefalse') {
                    isCorrect = userAnswer.trim() === (q.correct || '').trim();
                } else if (q.type === 'single') {
                    isCorrect = normalizeText(userAnswer) === normalizeText(q.correct);
                } else if (q.type === 'multiple') {
                    const uA = userAnswer.split(',').map(a => a.trim()).filter(Boolean).map(normalizeText).sort();
                    const cA = (q.correct || '').split(',').map(a => a.trim()).filter(Boolean).map(normalizeText).sort();
                    isCorrect = uA.length === cA.length && uA.length > 0 && uA.every((a, i) => a === cA[i]);
                } else if (q.type === 'essay' || q.type === 'complete') {
                    isCorrect = isAnswerCorrect(userAnswer, q.modelAnswer);
                }
                if (isCorrect) totalScore += q.points;
            });
            result.status = 'completed';
            result.endedAt = new Date().toISOString();
            result.answers = answers;
            result.score = totalScore;
            result.isCorrect = totalScore >= exam.totalPoints * 0.5;
            await saveDB();
            window.closeTakeExamModal();
            showExamResult(examId, childId);
        };

        window.handleRetakeAttempt = function(examId, childId) {
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) return;
            const allResults = db.examResults.filter(r => r.examId === examId && r.childId === childId);
            const completedResults = allResults.filter(r => r.status === 'completed');
            const attemptsUsed = completedResults.length;
            const attemptsLeft = exam.attempts - attemptsUsed;
            if (attemptsLeft > 0) {
                if (!confirm(`⚠️ سيتم بدء محاولة جديدة. المحاولات المتبقية: ${attemptsLeft - 1} بعد هذه.\nهل أنت متأكد؟`)) return;
                db.examResults = db.examResults.filter(r => !(r.examId === examId && r.childId === childId && r.status === 'in-progress'));
                const newResult = {
                    id: 'result_' + Date.now(), examId, childId,
                    startedAt: new Date().toISOString(), status: 'in-progress',
                    answers: {}, score: 0, totalPoints: exam.totalPoints,
                    attempts: attemptsUsed + 1
                };
                db.examResults.push(newResult);
                saveDB();
                window.closeExamResultModal();
                setTimeout(() => window.startExam(examId, childId), 300);
            } else {
                const existingRequest = allResults.find(r => r.retakeRequested);
                if (existingRequest) { showToast('⏳ لقد أرسلت طلب إعادة بالفعل. في انتظار الموافقة.', 'warning'); return; }
                if (!confirm('⚠️ لقد استهلكت جميع محاولاتك. هل تريد إرسال طلب إعادة الاختبار للأدمن؟')) return;
                const lastResult = completedResults.sort((a,b) => new Date(b.endedAt) - new Date(a.endedAt))[0];
                if (lastResult) {
                    lastResult.retakeRequested = true;
                    lastResult.retakeRequestedAt = new Date().toISOString();
                    saveDB();
                    showToast('✅ تم إرسال طلب إعادة الاختبار.', 'success');
                    window.closeExamResultModal();
                    render();
                }
            }
        };

        function viewAnalytics() {
            if (!session) { go('login'); return ''; }
            if (!isServantActive(session.username)) { setFlash('⛔ حسابك غير نشط.', 'error'); go('home'); return ''; }
            const children = myChildren();
            const allChildIds = children.map(c => c.id);
            const records = db.attendance.filter(a => allChildIds.includes(a.childId));
            const myExams = getServantExams();
            const myResults = db.examResults.filter(r => myExams.some(e => e.id === r.examId));
            const presentCount = records.filter(r => r.status === 'حاضر').length;
            const absentCount = records.filter(r => r.status === 'غائب').length;
            const totalRecords = records.length;
            const presentPercent = totalRecords > 0 ? Math.round((presentCount / totalRecords) * 100) : 0;
            const weeksMap = {};
            records.forEach(r => {
                if (!weeksMap[r.weekDate]) weeksMap[r.weekDate] = { present: 0, absent: 0 };
                if (r.status === 'حاضر') weeksMap[r.weekDate].present++;
                else weeksMap[r.weekDate].absent++;
            });
            const sortedWeeks = Object.keys(weeksMap).sort().slice(-8);
            const maxWeekVal = Math.max(1, ...sortedWeeks.map(w => weeksMap[w].present + weeksMap[w].absent));
            const classesMap = {};
            children.forEach(c => { if (!classesMap[c.classId]) classesMap[c.classId] = 0; classesMap[c.classId]++; });
            const childStats = children.map(c => {
                const cRec = records.filter(r => r.childId === c.id);
                const p = cRec.filter(r => r.status === 'حاضر').length;
                const t = cRec.length;
                return { child: c, present: p, total: t, percent: t > 0 ? Math.round((p / t) * 100) : 0 };
            }).sort((a, b) => b.percent - a.percent || b.present - a.present).slice(0, 5);
            return `
                <section>
                    <div class="glass" style="border-color:var(--sky-dark);margin-bottom:16px;">
                        <h2 style="font-size:1.3rem;margin:0;"><i class="fas fa-chart-line" style="color:var(--sky-dark);"></i> التحليلات والإحصائيات</h2>

                        <div class="stat-card"><div class="icon"><i class="fas fa-child"></i></div><div class="num">${children.length}</div><div class="label">عدد الأطفال</div></div>
                        <div class="stat-card" style="border-color:var(--ok);"><div class="icon" style="color:var(--ok);"><i class="fas fa-check-circle"></i></div><div class="num" style="color:var(--ok);">${presentCount}</div><div class="label">مرات الحضور</div></div>
                        <div class="stat-card" style="border-color:var(--bad);"><div class="icon" style="color:var(--bad);"><i class="fas fa-times-circle"></i></div><div class="num" style="color:var(--bad);">${absentCount}</div><div class="label">مرات الغياب</div></div>
