        // ============================================================
        // QUICK MARK / ADD / DELETE
        // ============================================================
        window.quickMark = async function(childId, status) {
            if (!session || !isServantActive(session.username)) { showToast('⚠️ لا يمكنك تسجيل الحضور.', 'warning'); return; }
            const today = todayDate();
            const idx = db.attendance.findIndex(a => a.childId === childId && a.weekDate === today);
            const record = { childId, weekDate: today, status, note: idx >= 0 ? db.attendance[idx].note : '' };
            if (idx >= 0) db.attendance[idx] = record; else db.attendance.push(record);
            await saveDB();
            const child = db.children.find(c => c.id === childId);
            showToast(`✅ ${status}: ${child ? child.name : ''}`, 'success');
            render();
        };
        window.submitAddChild = async function(ev) {
            ev.preventDefault();
            if (!session || !isServantActive(session.username)) { showToast('⚠️ لا يمكنك إضافة أطفال.', 'warning'); return false; }
            const f = ev.target;
            const name = f.childName.value.trim();
            const classId = f.classId.value;
            const msgBox = document.getElementById('formMsg');
            if (!name || !classId) { msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أدخل اسم الطفل واختر الصف.</div>`; return false; }
            const code = genCode();
            db.children.push({ id: crypto.randomUUID(), servantUsername: session.username, name, classId, code });
            await saveDB();
            showToast(`✅ تمت إضافة "${name}". كود: ${code}`, 'success');
            render();
            return false;
        };
        window.copyCode = function(code, btn) {
            const doCopy = () => {
                if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(code);
                else {
                    const ta = document.createElement('textarea');
                    ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); } catch (e) {}
                    document.body.removeChild(ta);
                    return Promise.resolve();
                }
            };
            doCopy().then(() => {
                const old = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> تم';
                setTimeout(() => btn.innerHTML = old, 1200);
                showToast('✅ تم نسخ الكود', 'success');
            });
        };
        window.deleteChild = async function(childId) {
            if (!session || !isServantActive(session.username)) { showToast('⚠️ لا يمكنك حذف الأطفال.', 'warning'); return; }
            const child = db.children.find(c => c.id === childId && c.servantUsername === session?.username);
            if (!child) return;
            if (!confirm(`❗ هل أنت متأكد من حذف "${child.name}"؟`)) return;
            db.children = db.children.filter(c => c.id !== childId);
            db.attendance = db.attendance.filter(a => a.childId !== childId);
            db.examResults = db.examResults.filter(r => r.childId !== childId);
            await saveDB();
            showToast(`🗑️ تم حذف "${child.name}"`, 'success');
            render();
        };

        // ============================================================
        // ATTENDANCE
        // ============================================================
        function viewAttendance() {
            if (!session) { go('login'); return ''; }
            const isActive = isServantActive(session.username);
            const isPending = isServantPending(session.username);
            if (isPending) { setFlash('⏳ حسابك في انتظار الموافقة.', 'warning'); go('home'); return ''; }
            if (!isActive) { setFlash('⛔ حسابك موقوف.', 'error'); go('home'); return ''; }
            let children = myChildren();
            const weekDate = routeParam || todayDate();
            children = filterChildren(children, childSearchQuery, childClassFilter);
            const rows = children.map(c => {
                const rec = db.attendance.find(a => a.childId === c.id && a.weekDate === weekDate);
                const status = rec ? rec.status : 'حاضر';
                const note = rec ? (rec.note || '') : '';
                return `
                    <tr>
                        <td>${esc(c.name)}</td>
                        <td>${esc(getClassById(c.classId)?.name || 'غير محدد')}</td>
                        <td>
                            <div class="status-group">
                                <label><input type="radio" name="status_${c.id}" value="حاضر" ${status === 'حاضر' ? 'checked' : ''}> حاضر</label>
                                <label><input type="radio" name="status_${c.id}" value="غائب" ${status === 'غائب' ? 'checked' : ''}> غائب</label>
                            </div>
                        </td>
                        <td><input type="text" data-note-for="${c.id}" value="${esc(note)}" placeholder="ملاحظة" style="width:100%;padding:6px 12px;border-radius:12px;border:1px solid var(--border-glass);background:var(--bg-glass);" /></td>
                    </tr>`;
            }).join('');
            return `
                <section>
                    <h2 style="font-size:1.3rem;"><i class="fas fa-clipboard-list" style="color:var(--sky-dark);"></i> تسجيل الحضور الأسبوعي</h2>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
                        <div class="glass" style="flex:0 0 auto;">
                            <form class="form-row" onsubmit="event.preventDefault();" style="align-items:flex-end;">
                                <label>الأسبوع
                                    <input type="date" value="${weekDate}" onchange="window.go('attendance', this.value)" />
                                </label>
                            </form>
                        </div>
                        <button class="btn btn-gold" onclick="window.scanAttendanceBarcode()" style="align-self:flex-end;">
                            <i class="fas fa-barcode"></i> حضور بالباركود
                        </button>
                    </div>
                    <div class="search-bar">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" placeholder="ابحث بالاسم أو الكود..." value="${esc(childSearchQuery)}" oninput="window.setChildSearch(this.value)" />
                    </div>
                    ${alertHtml()}
                    ${children.length === 0 ? `<p class="empty"><i class="fas fa-inbox"></i> ${childSearchQuery ? 'لا توجد نتائج' : 'لا يوجد أطفال'}</p>` : `
                    <div class="glass">
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>الاسم</th><th>الصف</th><th>الحالة</th><th>ملاحظة</th></tr></thead>
                                <tbody id="attRows">${rows}</tbody>
                            </table>
                        </div>
                        <div style="margin-top:12px;">
                            <button class="btn btn-primary" onclick="window.saveAttendance('${weekDate}')"><i class="fas fa-save"></i> حفظ التقرير</button>
                        </div>
                    </div>`}
                </section>`;
        }
        window.saveAttendance = async function(weekDate) {
            if (!session || !isServantActive(session.username)) { showToast('⚠️ لا يمكنك حفظ البيانات.', 'warning'); return; }
            const children = myChildren();
            children.forEach(c => {
                const radios = document.getElementsByName('status_' + c.id);
                let status = 'حاضر';
                radios.forEach(r => { if (r.checked) status = r.value; });
                const noteInput = document.querySelector(`[data-note-for="${c.id}"]`);
                const note = noteInput ? noteInput.value.trim() : '';
                const idx = db.attendance.findIndex(a => a.childId === c.id && a.weekDate === weekDate);
                const record = { childId: c.id, weekDate, status, note };
                if (idx >= 0) db.attendance[idx] = record; else db.attendance.push(record);
            });
            await saveDB();
            showToast(`✅ تم حفظ تقرير أسبوع ${weekDate}`, 'success');
            render();
        };

        // ============================================================
        // CHILD REPORT (with performance summary)
        // ============================================================
        function viewChildReport(childId) {
            if (!session) { go('login'); return ''; }
            const child = db.children.find(c => c.id === childId && c.servantUsername === session?.username);
            if (!child) { setFlash('الطفل غير موجود.', 'error'); go('dashboard'); return ''; }
            const records = db.attendance.filter(a => a.childId === child.id).sort((a, b) => b.weekDate.localeCompare(a.weekDate));
            const presentDates = records.filter(r => r.status === 'حاضر').map(r => r.weekDate);
            const absentDates = records.filter(r => r.status === 'غائب').map(r => r.weekDate);
            const barcodeSVG = generateBarcodeSVG(child.code, { width: 300, height: 80 });
            const rows = records.map(r => `
                <tr>
                    <td>${esc(r.weekDate)}</td>
                    <td><span class="badge ${r.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(r.status)}</span></td>
                    <td>${esc(r.note || '—')}</td>
                </tr>`).join('');
            const totalSessions = records.length;
            const attendanceRate = totalSessions > 0 ? Math.round((presentDates.length / totalSessions) * 100) : 0;
            const childExamResults = db.examResults.filter(r => r.childId === child.id && r.status === 'completed');
            const avgScore = childExamResults.length > 0 ? Math.round(childExamResults.reduce((sum, r) => {
                const ex = db.exams.find(e => e.id === r.examId);
                return sum + (ex ? (r.score / ex.totalPoints) * 100 : 0);
            }, 0) / childExamResults.length) : 0;
            return `
                <section>
                    <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="window.go('dashboard')"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <div class="glass">
                        <h2 style="font-size:1.3rem;"><i class="fas fa-user-graduate" style="color:var(--sky-dark);"></i> ${esc(child.name)}</h2>
                        <p style="font-size:0.9rem;"><i class="fas fa-layer-group"></i> الصف: ${esc(getClassById(child.classId)?.name || 'غير محدد')}</p>
                        <p style="font-size:0.9rem;"><i class="fas fa-key"></i> الكود: <code class="code-pill">${esc(child.code)}</code></p>
                    </div>
                    <div class="perf-card">
                        <h3><i class="fas fa-star"></i> ملخص أداء ${esc(child.name)}</h3>
                        <div class="perf-grid">
                            <div><div class="val">${attendanceRate}%</div><div class="lbl">نسبة الحضور</div></div>
                            <div><div class="val">${avgScore}%</div><div class="lbl">متوسط الاختبارات</div></div>
                            <div><div class="val">${childExamResults.length}</div><div class="lbl">اختبار مكتمل</div></div>
                        </div>
                    </div>
                    <div class="glass" style="margin-top:12px;text-align:center;">
                        <h3 style="font-size:1rem;margin-bottom:8px;"><i class="fas fa-barcode" style="color:var(--sky-dark);"></i> الباركود</h3>
                        <div style="background:#fff;border-radius:12px;padding:12px;display:inline-block;max-width:100%;">${barcodeSVG}</div>
                        <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
                            <button class="btn btn-primary btn-sm" onclick="window.downloadBarcode('${esc(child.code)}')"><i class="fas fa-download"></i> تحميل PNG</button>
                            <button class="btn btn-secondary btn-sm" onclick="window.copyCode('${esc(child.code)}',this)"><i class="fas fa-copy"></i> نسخ الكود</button>
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                        <button class="btn btn-sm btn-secondary" onclick="window.viewStudentExams('${child.id}')"><i class="fas fa-pencil-alt"></i> عرض الاختبارات</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--ok);font-size:1rem;"><i class="fas fa-check-circle"></i> الحضور (${presentDates.length})</h4>
                            <div style="font-size:0.8rem;">${presentDates.length ? presentDates.map(d => `<span class="badge badge-ok" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--bad);font-size:1rem;"><i class="fas fa-times-circle"></i> الغياب (${absentDates.length})</h4>
                            <div style="font-size:0.8rem;">${absentDates.length ? absentDates.map(d => `<span class="badge badge-bad" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                    </div>
                    <h3 style="font-size:1.1rem;margin-top:16px;"><i class="fas fa-history"></i> السجل التفصيلي</h3>
                    ${records.length === 0 ? `<p class="empty">لا يوجد سجلات</p>` : `
                    <div class="glass table-wrap">
                        <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
                    </div>`}
                </section>`;
        }

        // ============================================================
        // STUDENT LOOKUP
        // ============================================================
        function viewStudent() {
            return `
                <section class="panel glass">
                    <h2 style="font-size:1.3rem;"><i class="fas fa-search" style="color:var(--sky-dark);"></i> استعلام الطالب</h2>
                    <p style="color:var(--text-muted);font-size:0.9rem;">أدخل الكود الخاص بك أو امسح الباركود.</p>
                    <form class="form-row" onsubmit="return window.submitStudentLookup(event)">
                        <label style="flex:1;"><i class="fas fa-key"></i> الكود <input name="code" maxlength="10" style="text-transform:uppercase;" required placeholder="أدخل الكود" /></label>
                        <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i> استعلام</button>
                        <button type="button" class="barcode-btn" onclick="window.openBarcodeModal()"><i class="fas fa-barcode"></i> مسح الباركود</button>
                    </form>
                    <div id="studentResult"></div>
                </section>`;
        }
        window.submitStudentLookup = function(ev) {
            ev.preventDefault();
            const code = ev.target.code.value.trim().toUpperCase();
            const box = document.getElementById('studentResult');
            const child = db.children.find(c => c.code === code);
            if (!child) { box.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> الكود غير صحيح.</div>`; return false; }
            const records = db.attendance.filter(a => a.childId === child.id).sort((a, b) => b.weekDate.localeCompare(a.weekDate));
            const presentDates = records.filter(r => r.status === 'حاضر').map(r => r.weekDate);
            const absentDates = records.filter(r => r.status === 'غائب').map(r => r.weekDate);
            const exams = getExamsForClass(child.classId).filter(e => e.status === 'active' || e.status === 'draft');
            const examResults = getExamResultsForStudent(child.id);
            const rows = records.map(r => `
                <tr>
                    <td>${esc(r.weekDate)}</td>
                    <td><span class="badge ${r.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(r.status)}</span></td>
                    <td>${esc(r.note || '—')}</td>
                </tr>`).join('');
            const examsHtml = exams.length > 0 ? `
                <div style="margin-top:12px;">
                    <h4 style="font-size:0.95rem;"><i class="fas fa-pencil-alt"></i> الاختبارات المتاحة</h4>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
                        ${exams.map(exam => {
                            const er = examResults.filter(r => r.examId === exam.id);
                            const completedCount = er.filter(r => r.status === 'completed').length;
                            const attemptsLeft = exam.attempts - completedCount;
                            const lastCompleted = er.find(r => r.status === 'completed');
                            const isInProgress = er.some(r => r.status === 'in-progress');
                            const hasPending = er.some(r => r.retakeRequested);
                            return `
                                <div style="background:var(--bg-glass);border-radius:12px;padding:10px 14px;border:1px solid var(--border-glass);flex:1;min-width:160px;">
                                    <div style="font-weight:600;font-size:0.85rem;">${esc(exam.name)}</div>
                                    <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">
                                        ${lastCompleted ? '✅ تم' : isInProgress ? '⏳ جارٍ' : exam.status === 'active' ? '🟢 متاح' : '⏳ غير متاح'}
                                        | محاولات ${completedCount}/${exam.attempts}
                                    </div>
                                    ${isInProgress ? `<button class="btn btn-sm btn-gold" onclick="window.startExam('${exam.id}','${child.id}')" style="margin-top:4px;">استكمال</button>` : ''}
                                    ${exam.status === 'active' && attemptsLeft > 0 && !isInProgress ? `<button class="btn btn-sm btn-primary" onclick="window.startExam('${exam.id}','${child.id}')" style="margin-top:4px;">${completedCount > 0 ? 'محاولة جديدة' : 'بدء الاختبار'}</button>` : ''}
                                    ${lastCompleted ? `<button class="btn btn-sm btn-secondary" onclick="window.showExamResult('${exam.id}','${child.id}')" style="margin-top:4px;">النتيجة</button>` : ''}
                                    ${exam.status === 'active' && attemptsLeft <= 0 && !hasPending && !isInProgress ? `<button class="btn btn-sm btn-gold" onclick="window.handleRetakeAttempt('${exam.id}','${child.id}')" style="margin-top:4px;">طلب إعادة</button>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            ` : '';
            box.innerHTML = `
                <div class="glass" style="margin-top:12px;padding:16px;">
                    <h3 style="font-size:1.1rem;"><i class="fas fa-user-graduate" style="color:var(--sky-dark);"></i> ${esc(child.name)}</h3>
                    <p style="font-size:0.85rem;"><i class="fas fa-layer-group"></i> الصف: ${esc(getClassById(child.classId)?.name || 'غير محدد')}</p>
                    <p style="font-size:0.85rem;"><i class="fas fa-user"></i> الخادم: ${esc(getServantByUsername(child.servantUsername)?.name || 'غير معروف')}</p>
                </div>
                ${examsHtml}
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                    <div class="glass" style="text-align:center;padding:12px;">
                        <h4 style="color:var(--ok);font-size:0.9rem;"><i class="fas fa-check-circle"></i> الحضور (${presentDates.length})</h4>
                        <div style="font-size:0.8rem;">${presentDates.length ? presentDates.map(d => `<span class="badge badge-ok" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                    </div>
                    <div class="glass" style="text-align:center;padding:12px;">
                        <h4 style="color:var(--bad);font-size:0.9rem;"><i class="fas fa-times-circle"></i> الغياب (${absentDates.length})</h4>
                        <div style="font-size:0.8rem;">${absentDates.length ? absentDates.map(d => `<span class="badge badge-bad" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                    </div>
                </div>
                ${records.length === 0 ? `<p class="empty">لا يوجد سجلات</p>` : `
                <div class="glass table-wrap" style="margin-top:12px;">
                    <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
                </div>`}
            `;
            return false;
        };

        // ============================================================
        // CHAT VIEW
        // ============================================================
        function viewChat() {
            if (!session) { go('login'); return ''; }
            const isActive = isServantActive(session.username);
            const isPending = isServantPending(session.username);
            if (isPending) { setFlash('⏳ حسابك في انتظار الموافقة.', 'warning'); go('home'); return ''; }
            if (!isActive) { setFlash('⛔ حسابك موقوف.', 'error'); go('home'); return ''; }
            const user = getServantByUsername(session.username);
            const rooms = getChatRooms(user);
            const currentRoomId = routeParam || (rooms.length > 0 ? rooms[0].id : null);
            if (currentRoomId) markAsRead(currentRoomId, session.username);
            currentChat = currentRoomId;
            let chatListHtml = '';
            if (rooms.length === 0) { chatListHtml = `<div class="empty">لا توجد محادثات</div>`; }
            else {
                rooms.forEach(room => {
                    const isActiveRoom = room.id === currentRoomId;
                    let displayName = room.name || 'محادثة';
                    let displayIcon = 'fas fa-user';
                    let avatarClass = '';
                    if (room.type === 'admin-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = session.isAdmin ? 'fas fa-chalkboard-teacher' : 'fas fa-shield-alt';
                        avatarClass = session.isAdmin ? '' : 'admin-avatar';
                    } else if (room.type === 'servant-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                    } else if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                    }
                    const unread = room.unreadCount ? (room.unreadCount[session.username] || 0) : 0;
                    const roomType = room.type === 'admin-admin' ? 'أدمن-أدمن' : room.type === 'admin-servant' ? 'أدمن-خادم' : 'خادم-خادم';
                    chatListHtml += `
                        <div class="chat-item ${isActiveRoom ? 'active' : ''}" onclick="window.go('chat','${room.id}')">
                            <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                            <div class="chat-info">
                                <div class="chat-name">${esc(displayName)}</div>
                                <div class="chat-last-msg">${esc(room.lastMessage || 'لا توجد رسائل')}</div>
                            </div>
                            ${unread > 0 ? `<span class="chat-badge">${unread}</span>` : ''}
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                                <div class="chat-time">${new Date(room.lastMessageTime).toLocaleDateString('ar')}</div>
                                <span class="chat-type">${roomType}</span>
                            </div>
                        </div>
                    `;
                });
            }
            let chatAreaHtml = '';
            if (!currentRoomId) {
                chatAreaHtml = `<div class="chat-empty"><i class="fas fa-comments"></i><h3 style="font-size:1.1rem;">اختر محادثة</h3></div>`;
            } else {
                const room = db.chatRooms.find(r => r.id === currentRoomId);
                let displayName = 'المحادثة';
                let displayIcon = 'fas fa-user';
                let avatarClass = '';
                let roomType = '';
                if (room) {
                    if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                        roomType = 'أدمن-أدمن';
                    } else if (room.type === 'admin-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : (session.isAdmin ? 'خادم' : 'أدمن');
                        displayIcon = session.isAdmin ? 'fas fa-chalkboard-teacher' : 'fas fa-shield-alt';
                        roomType = 'أدمن-خادم';
                    } else {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                        roomType = 'خادم-خادم';
                    }
                }
                const messages = room ? getMessages(currentRoomId) : [];
                const messagesHtml = messages.map(msg => {
                    const isOwn = msg.from === session.username;
                    const sender = getServantByUsername(msg.from);
                    const senderName = sender ? sender.name : (msg.from === session.username ? 'أنت' : msg.from);
                    if (msg.type === 'poll' && msg.data) {
                        const poll = msg.data;
                        const totalVotes = poll.options.reduce((s, o) => s + o.votes, 0);
                        const hasVoted = poll.voters.includes(session.username);
                        return `
                            <div class="poll-message" style="align-self:${isOwn ? 'flex-end' : 'flex-start'};">
                                ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                                <div class="poll-question">📊 ${esc(poll.question)}</div>
                                ${poll.options.map((opt, idx) => {
                                    const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                                    return `
                                        <div class="poll-option ${hasVoted ? 'voted' : ''}" onclick="${!hasVoted ? `window.votePoll('${currentRoomId}','${poll.id}',${idx})` : ''}" style="${hasVoted ? 'cursor:default;' : 'cursor:pointer;'}">
                                            <span style="min-width:16px;">${String.fromCharCode(65 + idx)}.</span>
                                            <span style="flex:1;">${esc(opt.text)}</span>
                                            <div class="poll-bar"><div class="poll-fill" style="width:${percent}%;"></div></div>
                                            <span class="poll-percent">${percent}% (${opt.votes})</span>
                                        </div>
                                    `;
                                }).join('')}
                                <div style="font-size:0.55rem;color:var(--text-muted);margin-top:4px;text-align:left;">
                                    ${totalVotes} صوت ${hasVoted ? '✅' : ''}
                                </div>
                            </div>
                        `;
                    }
                    return `
                        <div class="message ${isOwn ? 'own' : 'other'}">
                            ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                            <div class="msg-text">${esc(msg.text)}</div>
                            <div class="msg-time">${new Date(msg.timestamp).toLocaleString('ar')}</div>
                        </div>
                    `;
                }).join('');
                const canCreatePoll = session.isAdmin;
                chatAreaHtml = `
                    <div class="chat-header">
                        <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                        <div class="chat-with">${esc(displayName)}</div>
                        <span class="chat-type-badge">${roomType}</span>
                        <div style="margin-right:auto;display:flex;gap:4px;">
                            ${canCreatePoll ? `<button class="btn btn-sm btn-secondary" onclick="window.openPollModal()"><i class="fas fa-poll"></i></button>` : ''}
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">${messagesHtml}</div>
                    <div class="chat-input" style="position:relative;">
                        <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid">${EMOJIS.map(e => `<span onclick="window.insertEmoji('${e}')">${e}</span>`).join('')}</div></div>
                        <div class="input-wrapper">
                            <button class="emoji-btn" onclick="window.toggleEmojiPicker()"><i class="far fa-smile"></i></button>
                            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') window.sendChatMessage()" />
                            ${canCreatePoll ? `<button class="poll-btn" onclick="window.openPollModal()"><i class="fas fa-poll"></i> استطلاع</button>` : ''}
                            <button class="send-btn" onclick="window.sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
            }
            return `
                <section>
                    <h2 style="font-size:1.3rem;"><i class="fas fa-comment-dots" style="color:var(--sky-dark);"></i> المحادثات</h2>
                    ${alertHtml()}
                    <div style="display:flex;gap:16px;height:65vh;min-height:420px;flex-wrap:wrap;">
                        <div style="width:260px;min-width:200px;flex:0 0 auto;overflow-y:auto;padding:4px;" class="glass">
                            <h4 style="padding:6px 10px;margin:0;font-size:0.8rem;color:var(--text-muted);"><i class="fas fa-users"></i> (${rooms.length})</h4>
                            ${chatListHtml}
                        </div>
                        <div style="flex:1;min-width:0;display:flex;flex-direction:column;" class="glass">${chatAreaHtml}</div>
                    </div>
                </section>`;
        }
        window.sendChatMessage = function() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            const roomId = routeParam || currentChat;
            if (!roomId) { showToast('⚠️ يرجى اختيار محادثة.', 'warning'); return; }
            const room = db.chatRooms.find(r => r.id === roomId);
            if (!room) { showToast('⚠️ الغرفة غير موجودة.', 'error'); return; }
            sendMessage(roomId, session.username, text, 'text', null);
            input.value = '';
            const ep = document.getElementById('emojiPicker'); if (ep) ep.classList.remove('open');
            setTimeout(() => { const c = document.getElementById('chatMessages'); if (c) c.scrollTop = c.scrollHeight; }, 100);
        };

        // ============================================================
        // HOME / LOGIN / REGISTER
        // ============================================================
        function viewHome() {
            const adminExists = hasAdmin();
            const unread = session ? getUnreadCount(session.username) : 0;
            return `
                ${alertHtml()}
                <section style="text-align:center;padding:30px 0;">
                    <div style="font-size:4.5rem;color:var(--sky-dark);animation:float 6s ease-in-out infinite;display:inline-block;"><i class="fas fa-cross"></i></div>
                    <h1 style="font-size:2.6rem;background:var(--sky-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">منصة مدارس الأحد</h1>
                    <p style="color:var(--text-muted);max-width:500px;margin:8px auto 20px;font-size:1.05rem;">
                        نظام متكامل لإدارة مدارس الأحد — حضور، اختبارات، تحليلات، باركود
                    </p>
                    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                        ${session
                            ? (isServantPending(session.username)
                                ? `<div class="alert alert-warning"><i class="fas fa-clock"></i> حسابك في انتظار موافقة الأدمن</div>`
                                : (isServantActive(session.username)
                                    ? `<button class="btn btn-primary" onclick="window.go('dashboard')"><i class="fas fa-chart-pie"></i> لوحة التحكم</button>
                                       <button class="btn btn-secondary" onclick="window.go('analytics')"><i class="fas fa-chart-line"></i> التحليلات</button>
                                       <button class="btn btn-gold" onclick="window.scanAttendanceBarcode()"><i class="fas fa-barcode"></i> حضور بالباركود</button>
                                       <button class="btn btn-secondary" onclick="window.go('chat')"><i class="fas fa-comment-dots"></i> المحادثات ${unread > 0 ? `<span class="badge" style="background:var(--bad);color:#fff;border-radius:50%;padding:0 6px;font-size:0.6rem;min-width:18px;text-align:center;line-height:18px;display:inline-block;">${unread}</span>` : ''}</button>`
                                    : `<div class="alert alert-error"><i class="fas fa-times-circle"></i> حسابك موقوف</div>`))
                            : `
                                ${!adminExists ? `<div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ⚠️ لا يوجد أدمن</div>` : ''}
                                <button class="btn btn-primary" onclick="window.go('login')"><i class="fas fa-sign-in-alt"></i> دخول</button>
                                ${adminExists ? `<button class="btn btn-gold" onclick="window.go('register')"><i class="fas fa-user-plus"></i> حساب جديد</button>` : ''}
                                <button class="btn btn-secondary" onclick="window.go('student')"><i class="fas fa-search"></i> استعلام</button>
                            `
                        }
                    </div>
                </section>
                <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:24px;">
                    <div class="glass" style="text-align:center;">
                        <span style="font-size:2.4rem;color:var(--sky-dark);display:block;margin-bottom:10px;"><i class="fas fa-pencil-alt"></i></span>
                        <h3 style="font-size:1.1rem;">الاختبارات</h3>
                        <p style="font-size:0.85rem;color:var(--text-muted);">إنشاء اختبارات متنوعة مع QR</p>
                    </div>
                    <div class="glass" style="text-align:center;">
                        <span style="font-size:2.4rem;color:var(--sky-dark);display:block;margin-bottom:10px;"><i class="fas fa-comment-dots"></i></span>
                        <h3 style="font-size:1.1rem;">محادثات</h3>
                        <p style="font-size:0.85rem;color:var(--text-muted);">تواصل مباشر مع الأدمن</p>
                    </div>
                    <div class="glass" style="text-align:center;">
                        <span style="font-size:2.4rem;color:var(--gold);display:block;margin-bottom:10px;"><i class="fas fa-chart-line"></i></span>
                        <h3 style="font-size:1.1rem;">تحليلات ذكية</h3>
                        <p style="font-size:0.85rem;color:var(--text-muted);">رسم بياني وإحصائيات</p>
                    </div>
                    <div class="glass" style="text-align:center;">
                        <span style="font-size:2.4rem;color:var(--sky-dark);display:block;margin-bottom:10px;"><i class="fas fa-barcode"></i></span>
                        <h3 style="font-size:1.1rem;">باركود الحضور</h3>
                        <p style="font-size:0.85rem;color:var(--text-muted);">امسح باركود الطالب لتسجيل الحضور</p>
                    </div>
                </section>`;
        }

        function viewRegister() {
            if (!hasAdmin()) {
                return `<section class="panel glass"><div class="alert alert-warning"><i class="fas fa-exclamation-triangle"></i> ⚠️ لا يوجد أدمن.</div></section>`;
            }
            return `
                <section class="panel glass">
                    <h2 style="font-size:1.3rem;"><i class="fas fa-user-plus" style="color:var(--sky-dark);"></i> تسجيل خادم جديد</h2>
                    <p style="color:var(--text-muted);font-size:0.9rem;">سيتم مراجعته من قبل الأدمن.</p>
                    <div id="formMsg"></div>
                    <form class="form" onsubmit="return window.submitRegister(event)">
                        <label><i class="fas fa-user"></i> الاسم <input name="name" required placeholder="أدخل اسمك" /></label>
                        <label><i class="fas fa-at"></i> اسم المستخدم <input name="username" required /></label>
                        <label><i class="fas fa-lock"></i> كلمة المرور <input type="password" name="password" required placeholder="6+" /></label>
                        <label><i class="fas fa-check-double"></i> تأكيد <input type="password" name="confirm" required /></label>
                        <button class="btn btn-gold" type="submit"><i class="fas fa-user-plus"></i> تسجيل</button>
                    </form>
                    <p style="margin-top:12px;color:var(--text-muted);font-size:0.85rem;">
                        لديك حساب؟ <a href="#" onclick="window.go('login');return false;">تسجيل الدخول</a>
                    </p>
                </section>`;
        }
        async function submitRegister(ev) {
            ev.preventDefault();
            const f = ev.target;
            const name = f.name.value.trim();
            const username = f.username.value.trim();
            const password = f.password.value;
            const confirm = f.confirm.value;
            const msgBox = document.getElementById('formMsg');
            if (!name || !username || !password) { msgBox.innerHTML = `<div class="alert alert-error">أكمل جميع الحقول.</div>`; return false; }
            if (password !== confirm) { msgBox.innerHTML = `<div class="alert alert-error">كلمتا المرور غير متطابقتين.</div>`; return false; }
            if (password.length < 6) { msgBox.innerHTML = `<div class="alert alert-error">كلمة المرور 6 أحرف على الأقل.</div>`; return false; }
            if (db.servants.some(s => s.username === username)) { msgBox.innerHTML = `<div class="alert alert-error">اسم المستخدم مستخدم.</div>`; return false; }
            const passwordHash = await sha256(password);
            db.servants.push({ name, username, passwordHash, isActive: false, isPending: true, assignedClass: null, pendingSince: todayDate() });
            await saveDB();
            showToast('✅ تم التسجيل! في انتظار الموافقة.', 'success');
            go('home');
            return false;
        }
        function viewLogin() {
            return `
                <section class="panel glass">
                    <h2 style="font-size:1.3rem;"><i class="fas fa-sign-in-alt" style="color:var(--sky-dark);"></i> دخول الخادم</h2>
                    ${alertHtml()}
                    <div id="formMsg"></div>
                    <form class="form" onsubmit="return window.submitLogin(event)">
                        <label><i class="fas fa-at"></i> اسم المستخدم <input name="username" required autofocus /></label>
                        <label><i class="fas fa-lock"></i> كلمة المرور <input type="password" name="password" required /></label>
                        <button class="btn btn-primary" type="submit"><i class="fas fa-sign-in-alt"></i> دخول</button>
                    </form>
                    <p style="margin-top:12px;color:var(--text-muted);font-size:0.85rem;">
                        ليس لديك حساب؟ <a href="#" onclick="window.go('register');return false;">سجل الآن</a>
                    </p>
                </section>`;
        }
        async function submitLogin(ev) {
            ev.preventDefault();
            const f = ev.target;
            const username = f.username.value.trim();
            const password = f.password.value;
            const msgBox = document.getElementById('formMsg');
            const servant = db.servants.find(s => s.username === username);
            const hash = await sha256(password);
            if (!servant || servant.passwordHash !== hash) { msgBox.innerHTML = `<div class="alert alert-error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>`; return false; }
            if (servant.isPending) { msgBox.innerHTML = `<div class="alert alert-warning">⏳ حسابك في انتظار الموافقة.</div>`; return false; }
            if (servant.isActive === false) { msgBox.innerHTML = `<div class="alert alert-error">⛔ موقوف.</div>`; return false; }
            session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
            saveSession(session.username, session.name, session.isAdmin);
            showToast('✅ تم تسجيل الدخول!', 'success');
            go('dashboard');
            return false;
        }
        function logout() {
            session = null;
            clearSession();
            go('home');
            const fab = document.getElementById('chatFab');
            if (fab) fab.style.display = 'none';
        }
        function alertHtml() {
            if (!flash) return '';
            const icon = flash.type === 'success' ? 'fa-check-circle' : flash.type === 'warning' ? 'fa-exclamation-triangle' : flash.type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle';
            const html = `<div class="alert alert-${flash.type || 'success'}"><i class="fas ${icon}"></i> ${esc(flash.msg)}</div>`;
            flash = null;
            return html;
        }

        // New pending requests checker (admin)
        function checkNewRequests() {
            if (!session) return;
            const current = db.servants.filter(s => s.isPending).length;
            if (session.isAdmin && current > lastPendingCount && lastPendingCount > 0) {
                const diff = current - lastPendingCount;
                showToast(`📩 لديك ${diff} طلب تسجيل جديد`, 'info');
            }
            lastPendingCount = current;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            renderSidebar();
            renderTopBar();
            const app = document.getElementById('app');
            if ((route === 'dashboard' || route === 'attendance' || route === 'childReport' || route === 'chat' || route === 'exams' || route === 'analytics') && !session) route = 'login';
            if (session) {
                const servant = db.servants.find(s => s.username === session.username);
                if (servant && servant.isPending) {
                    if (['dashboard','attendance','chat','exams','analytics'].includes(route)) { setFlash('⏳ حسابك في انتظار الموافقة.', 'warning'); route = 'home'; }
                } else if (servant && !servant.isActive && !servant.isPending) {
                    if (['dashboard','attendance','chat','exams','analytics'].includes(route)) { setFlash('⛔ موقوف.', 'error'); route = 'home'; }
                }
            }
            if (session && isServantActive(session.username) && !isServantPending(session.username)) {
                document.getElementById('chatFab').style.display = 'flex';
                updateChatBadge();
            } else {
                document.getElementById('chatFab').style.display = 'none';
            }
            switch (route) {
                case 'home': app.innerHTML = viewHome(); break;
                case 'register': app.innerHTML = viewRegister(); break;
                case 'login': app.innerHTML = viewLogin(); break;
                case 'dashboard': app.innerHTML = viewDashboard(); break;
                case 'analytics': app.innerHTML = viewAnalytics(); break;
                case 'attendance': app.innerHTML = viewAttendance(); break;
                case 'childReport': app.innerHTML = viewChildReport(routeParam); break;
                case 'student': app.innerHTML = viewStudent(); break;
                case 'chat': app.innerHTML = viewChat(); setTimeout(() => { const c = document.getElementById('chatMessages'); if (c) c.scrollTop = c.scrollHeight; }, 300); break;
                case 'exams': app.innerHTML = viewExams(); break;
                default: app.innerHTML = viewHome();
            }
            setTimeout(checkNewRequests, 400);
        }

        // INIT
        (async function init() {
            await loadDB();
            applyTheme(currentTheme);
            const savedSession = loadSession();
            if (savedSession) {
                const servant = db.servants.find(s => s.username === savedSession.username);
                if (servant && servant.isActive && !servant.isPending) {
                    session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
                    if (route === 'home' || route === 'login') route = 'dashboard';
                } else if (servant && servant.isPending) {
                    session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
                } else { clearSession(); }
            }
            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => Notification.requestPermission(), 3000);
            }
            render();
            watchDB();
        })();

        // EXPOSE
        Object.assign(window, {
            go, toggleTheme, toggleSidebar, logout,
            submitRegister, submitLogin, submitAddChild, submitStudentLookup,
            quickMark, deleteChild, copyCode, saveAttendance,
            sendChatMessage, openChat, openPollModal, closePollModal, addPollOption, submitPoll, votePoll,
            toggleEmojiPicker, insertEmoji,
            openPasswordModal, closePasswordModal, submitChangePassword,
            openExamModal, closeExamModal, addQuestion, updateQuestionUI, addOption, removeOption, submitExam,
            startExam, submitExamAnswers, closeTakeExamModal, closeExamResultModal,
            viewExamDetails, viewStudentExams, showExamResult, handleRetakeAttempt, requestExamRetake, approveExamRetake,
            deleteExam, showToast, esc, genCode, genExamCode,
            getExamsForClass, getExamResultsForStudent, normalizeText, isAnswerCorrect,
            generateBarcodeSVG, downloadBarcode, showBarcodeView, closeBarcodeViewModal,
            generateQRCodeSVG,
            openBarcodeModal, closeBarcodeModal, scanAttendanceBarcode,
            setChildSearch, setChildClassFilter, setExamSearch, setExamStatusFilter
        });
    </script>
</body>
                                                                                                              </html>
