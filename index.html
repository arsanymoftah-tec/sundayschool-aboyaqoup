<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مدارس الأحد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241b3a;
    --plum:#3b2a6b;
    --plum-dark:#291d4a;
    --gold:#c9a34e;
    --gold-dark:#a9803a;
    --paper:#f7f4fb;
    --card:#ffffff;
    --line:#e4ddf2;
    --muted:#77708f;
    --ok:#1f8a53;
    --bad:#c23a51;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Cairo',sans-serif; line-height:1.7;
  }
  h1,h2,h3{ font-family:'Amiri',serif; font-weight:700; margin:0 0 .4em; }
  a{color:var(--plum);}
  .container{max-width:960px;margin:0 auto;padding:0 20px;}

  header.top{
    background:linear-gradient(135deg,var(--plum),var(--plum-dark));
    color:#fff; padding:16px 0; border-bottom:4px solid var(--gold);
  }
  header.top .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{font-family:'Amiri',serif;font-size:1.35rem;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;}
  .brand .mark{color:var(--gold);font-size:1.5rem;}
  nav a, nav button.linklike{
    color:#f1ecfb; text-decoration:none; margin-inline-start:18px; background:none; border:none;
    font-family:'Cairo',sans-serif; font-size:1rem; cursor:pointer; opacity:.9;
  }
  nav a:hover, nav button.linklike:hover{opacity:1;text-decoration:underline;}
  nav .who{opacity:.8; margin-inline-start:18px;}

  main{padding:36px 0 60px; min-height:60vh;}

  .hero{text-align:center;padding:30px 0 10px;}
  .hero .mark-big{font-size:2.4rem;color:var(--gold);}
  .hero h1{font-size:2rem;margin-top:.2em;}
  .hero p{color:var(--muted);max-width:560px;margin:10px auto 26px;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:34px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .card h3{font-size:1.15rem;color:var(--plum);}
  .card p{color:var(--muted);margin:0;}

  .btn{display:inline-block;padding:10px 22px;border-radius:8px;border:2px solid var(--plum);
    cursor:pointer;font-family:'Cairo',sans-serif;font-size:1rem;background:transparent;color:var(--plum);}
  .btn-primary{background:var(--plum);color:#fff;}
  .btn-primary:hover{background:var(--plum-dark);border-color:var(--plum-dark);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#2b2109;}
  .btn-gold:hover{background:var(--gold-dark);border-color:var(--gold-dark);}
  .btn-sm{padding:5px 14px;font-size:.85rem;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .panel{max-width:440px;margin:0 auto;}
  .panel.wide{max-width:900px;}
  .form{display:flex;flex-direction:column;gap:14px;}
  .form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:end;}
  label{display:flex;flex-direction:column;gap:6px;font-size:.95rem;color:var(--muted);}
  input,select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}

  .alert{padding:12px 16px;border-radius:8px;margin-bottom:18px;}
  .alert-success{background:#e6f5ec;color:var(--ok);border:1px solid #b6e3c8;}
  .alert-error{background:#fbe8ec;color:var(--bad);border:1px solid #f2c1cc;}

  table{width:100%;border-collapse:collapse;}
  th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;}
  .table-wrap{overflow-x:auto;}

  code.code-pill{background:#efe8fb;color:var(--plum);padding:3px 10px;border-radius:6px;font-weight:bold;letter-spacing:2px;}
  .copy-btn{margin-inline-start:6px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.8rem;}

  .status-group{display:flex;gap:14px;}
  .status-group label{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:1rem;}

  .badge{padding:3px 12px;border-radius:12px;font-size:.85rem;}
  .badge-ok{background:#e6f5ec;color:var(--ok);}
  .badge-bad{background:#fbe8ec;color:var(--bad);}

  .empty{color:var(--muted);text-align:center;padding:24px 0;}
  .back{display:inline-block;margin-bottom:16px;}

  footer.site{text-align:center;padding:22px 0;color:var(--muted);border-top:1px solid var(--line);background:var(--card);font-size:.92rem;}
  footer.site strong{color:var(--plum);}

  .loading{text-align:center;color:var(--muted);padding:60px 0;}
</style>
</head>
<body>
  <header class="top">
    <div class="container row">
      <a href="#" class="brand" onclick="go('home');return false;"><span class="mark">✝</span> منصة مدارس الأحد</a>
      <nav id="nav"></nav>
    </div>
  </header>
  <main class="container" id="app">
    <div class="loading">جارِ تحميل المنصة…</div>
  </main>
  <footer class="site">
    <div class="container">منصة مدارس الأحد - Developed by: <strong>Keroles Ayman</strong></div>
  </footer>

<script type="module">
/* ============================================================
   إعدادات Firebase — لازم تستبدلها ببيانات مشروعك من Firebase Console
   (Project settings → Your apps → SDK setup and configuration)
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuGob9_AWGsDiAaJgB6XWWye-eEhMBVOo",
  authDomain: "sunday-school-platform-8a08a.firebaseapp.com",
  projectId: "sunday-school-platform-8a08a",
  storageBucket: "sunday-school-platform-8a08a.firebasestorage.app",
  messagingSenderId: "137098154880",
  appId: "1:137098154880:web:c0731bcedfe384aba72765"
};

const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);
const dataDocRef = doc(firestore, "sunday-school", "data");

/* ============ الحالة والتخزين ============ */
const CLASSES = ['حضانة','تمهيدي','أولى ابتدائي','ثانية ابتدائي','ثالثة ابتدائي',
  'رابعة ابتدائي','خامسة ابتدائي','سادسة ابتدائي','أولى إعدادي','ثانية إعدادي',
  'ثالثة إعدادي','أولى ثانوي','ثانية ثانوي','ثالثة ثانوي'];

let db = { servants: [], children: [], attendance: [] };
let session = null;      // { username, name }
let route = 'home';
let routeParam = null;
let flash = null;

// البيانات كلها متخزنة في مستند واحد على Firestore (سحابة جوجل)، فأي خادم أو
// طالب يفتح نفس رابط المنصة من أي جهاز (يحتاج إنترنت) هيشوف نفس البيانات فورًا.
async function loadDB(){
  try{
    const snap = await getDoc(dataDocRef);
    if(snap.exists()){ db = snap.data().payload; }
  }catch(e){
    console.error('تعذر تحميل البيانات', e);
    alert('تعذر الاتصال بقاعدة البيانات. تأكد من ضبط إعدادات Firebase في أعلى الملف ومن اتصالك بالإنترنت.');
  }
}
async function saveDB(){
  try{
    await setDoc(dataDocRef, { payload: db });
  }catch(e){
    console.error('تعذر حفظ البيانات', e);
    alert('حدث خطأ أثناء حفظ البيانات، تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
  }
}

// تحديث فوري تلقائي: لو خادم أو طالب تاني عدّل البيانات من جهاز آخر، الصفحة
// المفتوحة عندك تتحدّث وحدها بدون ما تعمل Refresh.
function watchDB(){
  onSnapshot(dataDocRef, (snap)=>{
    if(snap.exists()){
      db = snap.data().payload;
      render();
    }
  });
}

/* ============ أدوات مساعدة ============ */
function esc(s){
  return (s ?? '').toString()
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code;
  do{
    code = Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  }while(db.children.some(c=>c.code===code));
  return code;
}
function defaultWeekDate(){
  const d = new Date();
  const day = d.getDay(); // 0=Sun ... 5=Fri
  let diff = 5 - day;
  if(diff < 0) diff += 7;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function setFlash(msg,type){ flash = {msg,type}; }

function go(r, param=null){ route = r; routeParam = param; render(); }

/* ============ التنقل العلوي ============ */
function renderNav(){
  const nav = document.getElementById('nav');
  if(session){
    nav.innerHTML = `
      <span class="who">أهلاً، ${esc(session.name)}</span>
      <a href="#" onclick="go('dashboard');return false;">لوحة التحكم</a>
      <a href="#" onclick="go('attendance');return false;">تسجيل الحضور</a>
      <button class="linklike" onclick="logout()">خروج</button>`;
  } else {
    nav.innerHTML = `
      <a href="#" onclick="go('student');return false;">استعلام الطالب</a>
      <a href="#" onclick="go('login');return false;">دخول الخادم</a>
      <a href="#" onclick="go('register');return false;">حساب جديد</a>`;
  }
}
function logout(){ session = null; go('home'); }

/* ============ الصفحات ============ */
function alertHtml(){
  if(!flash) return '';
  const html = `<div class="alert alert-${flash.type||'success'}">${esc(flash.msg)}</div>`;
  flash = null;
  return html;
}

function viewHome(){
  return `
    ${alertHtml()}
    <section class="hero">
      <div class="mark-big">✝</div>
      <h1>منصة متابعة خدمة مدارس الأحد</h1>
      <p>سجّل حضور وغياب أطفال فصلك أسبوعيًا بسهولة، وامنح كل طفل كودًا خاصًا يستعلم به عن تقريره بنفسه.</p>
      <div class="actions">
        ${session
          ? `<button class="btn btn-primary" onclick="go('dashboard')">الذهاب للوحة التحكم</button>`
          : `<button class="btn btn-primary" onclick="go('login')">دخول الخادم</button>
             <button class="btn btn-gold" onclick="go('student')">استعلام الطالب عن تقريره</button>`}
      </div>
    </section>
    <section class="cards">
      <div class="card"><h3>للخادم</h3><p>يضيف أطفال فصله، ويسجل الحضور والغياب أسبوعيًا، ويتابع تقرير كل طفل على حدة.</p></div>
      <div class="card"><h3>للطالب</h3><p>باستخدام كوده الخاص فقط، يطّلع الطالب على تقرير حضوره دون أي صلاحية تعديل.</p></div>
      <div class="card"><h3>فصول منفصلة</h3><p>كل خادم يرى أطفاله فقط ضمن فصله، بمعزل تام عن باقي الخدام.</p></div>
    </section>`;
}

function viewRegister(){
  return `
    <section class="panel">
      <h2>إنشاء حساب خادم جديد</h2>
      <div id="formMsg"></div>
      <form class="card form" onsubmit="return submitRegister(event)">
        <label>الاسم<input name="name" required></label>
        <label>اسم المستخدم<input name="username" required></label>
        <label>كلمة المرور<input type="password" name="password" required></label>
        <label>تأكيد كلمة المرور<input type="password" name="confirm" required></label>
        <button class="btn btn-primary" type="submit">إنشاء الحساب</button>
      </form>
      <p style="margin-top:12px">لديك حساب بالفعل؟ <a href="#" onclick="go('login');return false;">تسجيل الدخول</a></p>
    </section>`;
}

async function submitRegister(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.name.value.trim();
  const username = f.username.value.trim();
  const password = f.password.value;
  const confirm = f.confirm.value;
  const msgBox = document.getElementById('formMsg');

  if(!name || !username || !password){ msgBox.innerHTML = `<div class="alert alert-error">أكمل جميع الحقول.</div>`; return false; }
  if(password !== confirm){ msgBox.innerHTML = `<div class="alert alert-error">كلمتا المرور غير متطابقتين.</div>`; return false; }
  if(password.length < 6){ msgBox.innerHTML = `<div class="alert alert-error">كلمة المرور 6 أحرف على الأقل.</div>`; return false; }
  if(db.servants.some(s=>s.username===username)){ msgBox.innerHTML = `<div class="alert alert-error">اسم المستخدم مستخدم بالفعل.</div>`; return false; }

  const passwordHash = await sha256(password);
  db.servants.push({name, username, passwordHash});
  await saveDB();
  setFlash('تم إنشاء الحساب بنجاح، سجّل الدخول الآن.');
  go('login');
  return false;
}

function viewLogin(){
  return `
    <section class="panel">
      <h2>دخول الخادم</h2>
      ${alertHtml()}
      <div id="formMsg"></div>
      <form class="card form" onsubmit="return submitLogin(event)">
        <label>اسم المستخدم<input name="username" required autofocus></label>
        <label>كلمة المرور<input type="password" name="password" required></label>
        <button class="btn btn-primary" type="submit">دخول</button>
      </form>
      <p style="margin-top:12px">ليس لديك حساب؟ <a href="#" onclick="go('register');return false;">أنشئ حسابًا جديدًا</a></p>
    </section>`;
}

async function submitLogin(ev){
  ev.preventDefault();
  const f = ev.target;
  const username = f.username.value.trim();
  const password = f.password.value;
  const msgBox = document.getElementById('formMsg');

  const servant = db.servants.find(s=>s.username===username);
  const hash = await sha256(password);
  if(!servant || servant.passwordHash !== hash){
    msgBox.innerHTML = `<div class="alert alert-error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;
    return false;
  }
  session = {username: servant.username, name: servant.name};
  go('dashboard');
  return false;
}

function myChildren(){
  return db.children.filter(c=>c.servantUsername===session.username);
}

function viewDashboard(){
  const children = myChildren();
  const today = todayDate();
  const rows = children.map(c=>{
    const todayRec = db.attendance.find(a=>a.childId===c.id && a.weekDate===today);
    const todayBadge = todayRec
      ? `<span class="badge badge-${todayRec.status==='حاضر'?'ok':'bad'}">اليوم: ${esc(todayRec.status)}</span>`
      : `<span style="color:var(--muted);font-size:.85rem">لم يُسجَّل اليوم</span>`;
    return `
    <tr>
      <td>${esc(c.name)}</td>
      <td>${esc(c.className)}</td>
      <td>
        <code class="code-pill">${esc(c.code)}</code>
        <button class="copy-btn" onclick="copyCode('${c.code}',this)">نسخ</button>
      </td>
      <td>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">
          <button class="btn btn-sm" style="border-color:var(--ok);color:var(--ok)" onclick="quickMark('${c.id}','حاضر')">✓ حضور اليوم</button>
          <button class="btn btn-sm" style="border-color:var(--bad);color:var(--bad)" onclick="quickMark('${c.id}','غائب')">✗ غياب اليوم</button>
        </div>
        <div>${todayBadge}</div>
      </td>
      <td>
        <button class="btn btn-sm" onclick="go('childReport','${c.id}')">عرض التقرير</button>
        <button class="btn btn-sm" style="border-color:var(--bad);color:var(--bad)" onclick="deleteChild('${c.id}')">حذف</button>
      </td>
    </tr>`;
  }).join('');

  return `
    <section>
      <h2>إضافة طفل جديد</h2>
      <div id="formMsg"></div>
      <form class="card form-row" onsubmit="return submitAddChild(event)">
        <label>اسم الطفل<input name="childName" required></label>
        <label>الفصل
          <select name="classId" required>
            <option value="">اختر الفصل</option>
            ${CLASSES.map((c,i)=>`<option value="${i}">${esc(c)}</option>`).join('')}
          </select>
        </label>
        <button class="btn btn-primary" type="submit">إضافة</button>
      </form>

      <h2 style="margin-top:30px">أطفال فصولي (${children.length})</h2>
      <p style="color:var(--muted)">سجّل حضور أو غياب أي طفل بتاريخ اليوم (${today}) مباشرة من هنا. كل تسجيل يُضاف بتاريخه ضمن سجل الطفل ولا يمسح ما قبله.</p>
      ${alertHtml()}
      ${children.length===0 ? `<p class="empty">لا يوجد أطفال مضافون بعد.</p>` : `
      <div class="card table-wrap">
        <table>
          <thead><tr><th>الاسم</th><th>الفصل</th><th>كود الاستعلام</th><th>حضور / غياب اليوم</th><th>إجراءات</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`}
    </section>`;
}

function todayDate(){
  return new Date().toISOString().slice(0,10);
}

async function quickMark(childId, status){
  const today = todayDate();
  const idx = db.attendance.findIndex(a=>a.childId===childId && a.weekDate===today);
  const record = {childId, weekDate: today, status, note: idx>=0 ? db.attendance[idx].note : null};
  if(idx>=0) db.attendance[idx] = record; else db.attendance.push(record);
  await saveDB();
  const child = db.children.find(c=>c.id===childId);
  setFlash(`تم تسجيل "${status}" لـ "${child ? child.name : ''}" بتاريخ ${today}.`);
  go('dashboard');
}

async function submitAddChild(ev){
  ev.preventDefault();
  const f = ev.target;
  const name = f.childName.value.trim();
  const classId = f.classId.value;
  const msgBox = document.getElementById('formMsg');
  if(!name || classId===''){ msgBox.innerHTML = `<div class="alert alert-error">أدخل اسم الطفل واختر الفصل.</div>`; return false; }

  const code = genCode();
  db.children.push({
    id: crypto.randomUUID(),
    servantUsername: session.username,
    name, className: CLASSES[+classId],
    code
  });
  await saveDB();
  setFlash(`تمت إضافة "${name}" بنجاح. كود الاستعلام: ${code}`);
  go('dashboard');
  return false;
}

function copyCode(code, btn){
  navigator.clipboard.writeText(code).then(()=>{
    const old = btn.textContent;
    btn.textContent = 'تم النسخ ✓';
    setTimeout(()=>btn.textContent = old, 1400);
  });
}

async function deleteChild(childId){
  const child = db.children.find(c=>c.id===childId && c.servantUsername===session.username);
  if(!child) return;
  if(!confirm(`هل أنت متأكد من حذف "${child.name}"؟ سيتم حذف كل سجلات حضوره أيضًا ولا يمكن التراجع.`)) return;

  db.children = db.children.filter(c=>c.id!==childId);
  db.attendance = db.attendance.filter(a=>a.childId!==childId);
  await saveDB();
  setFlash(`تم حذف "${child.name}" بنجاح.`);
  go('dashboard');
}

function viewAttendance(){
  const children = myChildren();
  const weekDate = routeParam || defaultWeekDate();

  const rows = children.map(c=>{
    const rec = db.attendance.find(a=>a.childId===c.id && a.weekDate===weekDate);
    const status = rec ? rec.status : 'حاضر';
    const note = rec ? (rec.note||'') : '';
    return `
      <tr>
        <td>${esc(c.name)}</td>
        <td>${esc(c.className)}</td>
        <td>
          <div class="status-group">
            <label><input type="radio" name="status_${c.id}" value="حاضر" ${status==='حاضر'?'checked':''}> حاضر</label>
            <label><input type="radio" name="status_${c.id}" value="غائب" ${status==='غائب'?'checked':''}> غائب</label>
          </div>
        </td>
        <td><input type="text" data-note-for="${c.id}" value="${esc(note)}" placeholder="اختياري"></td>
      </tr>`;
  }).join('');

  return `
    <section>
      <h2>تسجيل تقرير الحضور الأسبوعي</h2>
      <form class="card form-row" style="max-width:260px" onsubmit="event.preventDefault();">
        <label>الأسبوع
          <input type="date" value="${weekDate}" onchange="go('attendance', this.value)">
        </label>
      </form>
      ${alertHtml()}
      ${children.length===0 ? `<p class="empty">لا يوجد أطفال بعد. أضِف أطفالًا من لوحة التحكم أولًا.</p>` : `
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>الاسم</th><th>الفصل</th><th>الحالة</th><th>ملاحظة</th></tr></thead>
            <tbody id="attRows">${rows}</tbody>
          </table>
        </div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" onclick="saveAttendance('${weekDate}')">حفظ تقرير هذا الأسبوع</button>
        </div>
      </div>`}
    </section>`;
}

async function saveAttendance(weekDate){
  const children = myChildren();
  children.forEach(c=>{
    const radios = document.getElementsByName('status_'+c.id);
    let status = 'حاضر';
    radios.forEach(r=>{ if(r.checked) status = r.value; });
    const noteInput = document.querySelector(`[data-note-for="${c.id}"]`);
    const note = noteInput ? noteInput.value.trim() : '';

    const idx = db.attendance.findIndex(a=>a.childId===c.id && a.weekDate===weekDate);
    const record = {childId:c.id, weekDate, status, note};
    if(idx>=0) db.attendance[idx] = record; else db.attendance.push(record);
  });
  await saveDB();
  setFlash(`تم حفظ تقرير أسبوع ${weekDate} بنجاح.`);
  go('attendance', weekDate);
}

function viewChildReport(childId){
  const child = db.children.find(c=>c.id===childId && c.servantUsername===session.username);
  if(!child){
    setFlash('هذا الطفل غير موجود ضمن أطفالك.','error');
    go('dashboard');
    return '';
  }
  const records = db.attendance.filter(a=>a.childId===childId).sort((a,b)=>b.weekDate.localeCompare(a.weekDate));
  const presentDates = records.filter(r=>r.status==='حاضر').map(r=>r.weekDate);
  const absentDates = records.filter(r=>r.status==='غائب').map(r=>r.weekDate);

  const rows = records.map(r=>`
    <tr>
      <td>${esc(r.weekDate)}</td>
      <td><span class="badge badge-${r.status==='حاضر'?'ok':'bad'}">${esc(r.status)}</span></td>
      <td>${esc(r.note || '—')}</td>
    </tr>`).join('');

  return `
    <section>
      <a class="back" href="#" onclick="go('dashboard');return false;">&rarr; رجوع للوحة التحكم</a>
      <div class="card">
        <h2>${esc(child.name)}</h2>
        <p>الفصل: ${esc(child.className)}</p>
        <p>كود الاستعلام: <code class="code-pill">${esc(child.code)}</code></p>
      </div>
      ${attendanceSummaryHtml(presentDates, absentDates)}

      <p style="color:var(--muted);margin-top:20px">هذه الصفحة للعرض فقط. لتسجيل أو تعديل الحضور استخدم صفحة
        <a href="#" onclick="go('attendance');return false;">تسجيل الحضور</a>.</p>

      <h3 style="margin-top:12px">سجل الحضور والغياب بالتفصيل</h3>
      ${records.length===0 ? `<p class="empty">لا يوجد تقرير مسجل لهذا الطفل بعد.</p>` : `
      <div class="card table-wrap">
        <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`}
    </section>`;
}

// يعرض عدد أيام الحضور والغياب مع تواريخ كل حالة
function attendanceSummaryHtml(presentDates, absentDates){
  const presentList = presentDates.length
    ? presentDates.map(d=>`<span class="badge badge-ok" style="margin:2px">${esc(d)}</span>`).join(' ')
    : '<span style="color:var(--muted)">لا يوجد</span>';
  const absentList = absentDates.length
    ? absentDates.map(d=>`<span class="badge badge-bad" style="margin:2px">${esc(d)}</span>`).join(' ')
    : '<span style="color:var(--muted)">لا يوجد</span>';

  return `
    <div class="cards" style="grid-template-columns:1fr 1fr;margin-top:16px">
      <div class="card">
        <h3 style="color:var(--ok)">أيام الحضور (${presentDates.length})</h3>
        <div>${presentList}</div>
      </div>
      <div class="card">
        <h3 style="color:var(--bad)">أيام الغياب (${absentDates.length})</h3>
        <div>${absentList}</div>
      </div>
    </div>`;
}

function viewStudent(){
  return `
    <section class="panel">
      <h2>استعلام عن تقرير الحضور</h2>
      <p style="color:var(--muted)">أدخل الكود الخاص بك الذي أعطاك إياه الخادم لعرض تقريرك فقط.</p>
      <form class="card form-row" onsubmit="return submitStudentLookup(event)">
        <label>الكود<input name="code" maxlength="10" style="text-transform:uppercase" required></label>
        <button class="btn btn-primary" type="submit">استعلام</button>
      </form>
      <div id="studentResult"></div>
    </section>`;
}

function submitStudentLookup(ev){
  ev.preventDefault();
  const code = ev.target.code.value.trim().toUpperCase();
  const box = document.getElementById('studentResult');
  const child = db.children.find(c=>c.code===code);
  if(!child){
    box.innerHTML = `<div class="alert alert-error">الكود غير صحيح، تأكد منه مع الخادم.</div>`;
    return false;
  }
  const records = db.attendance.filter(a=>a.childId===child.id).sort((a,b)=>b.weekDate.localeCompare(a.weekDate));
  const presentDates = records.filter(r=>r.status==='حاضر').map(r=>r.weekDate);
  const absentDates = records.filter(r=>r.status==='غائب').map(r=>r.weekDate);
  const rows = records.map(r=>`
    <tr>
      <td>${esc(r.weekDate)}</td>
      <td><span class="badge badge-${r.status==='حاضر'?'ok':'bad'}">${esc(r.status)}</span></td>
      <td>${esc(r.note || '—')}</td>
    </tr>`).join('');

  box.innerHTML = `
    <div class="card" style="margin-top:16px">
      <h3>${esc(child.name)}</h3>
      <p>الفصل: ${esc(child.className)}</p>
    </div>
    ${attendanceSummaryHtml(presentDates, absentDates)}
    ${records.length===0 ? `<p class="empty">لا يوجد تقرير مسجل بعد.</p>` : `
    <div class="card table-wrap" style="margin-top:14px">
      <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`}`;
  return false;
}

/* ============ عرض الصفحات ============ */
function render(){
  renderNav();
  const app = document.getElementById('app');
  if((route==='dashboard'||route==='attendance'||route==='childReport') && !session){
    route = 'login';
  }
  switch(route){
    case 'home': app.innerHTML = viewHome(); break;
    case 'register': app.innerHTML = viewRegister(); break;
    case 'login': app.innerHTML = viewLogin(); break;
    case 'dashboard': app.innerHTML = viewDashboard(); break;
    case 'attendance': app.innerHTML = viewAttendance(); break;
    case 'childReport': app.innerHTML = viewChildReport(routeParam); break;
    case 'student': app.innerHTML = viewStudent(); break;
    default: app.innerHTML = viewHome();
  }
}

/* ============ بدء التشغيل ============ */
(async function init(){
  await loadDB();
  render();
  watchDB();
})();

/* ============ إتاحة الدوال لـ onclick داخل HTML (لازمة لأن السكريبت أصبح module) ============ */
Object.assign(window, {
  go, logout, copyCode, deleteChild, quickMark,
  submitRegister, submitLogin, submitAddChild, saveAttendance, submitStudentLookup
});
</script>
</body>
</html>
