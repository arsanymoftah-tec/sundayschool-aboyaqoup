        window.submitExam = async function(ev) {
            ev.preventDefault();
            if (!session) return false;

            const editId = document.getElementById('editExamId').value;
            const name = document.getElementById('examName').value.trim();
            const description = document.getElementById('examDescription').value.trim();
            const duration = parseInt(document.getElementById('examDuration').value);
            const attempts = parseInt(document.getElementById('examAttempts').value);
            const classId = document.getElementById('examClass').value;
            const status = document.getElementById('examStatus').value;

            if (!name || !classId) {
                showToast('⚠️ أكمل جميع الحقول المطلوبة.', 'warning');
                return false;
            }

            const questionCards = document.querySelectorAll('#questionsContainer .question-card');
            const questions = [];
            let valid = true;

            questionCards.forEach((card, idx) => {
                const text = card.querySelector('.q-text').value.trim();
                const type = card.querySelector('.q-type').value;
                const points = parseInt(card.querySelector('.q-points').value) || 1;
                let options = [];
                let correct = '';
                let modelAnswer = '';

                if (type === 'multiple' || type === 'single' || type === 'truefalse') {
                    const optionInputs = card.querySelectorAll('.q-option');
                    optionInputs.forEach(inp => {
                        const val = inp.value.trim();
                        if (val) options.push(val);
                    });
                    // قراءة الإجابة الصحيحة من الراديو أو من الخيارات المحددة
                    const radio = card.querySelector('.q-correct-radio');
                    if (radio && radio.value) {
                        correct = radio.value.trim();
                    } else {
                        // محاولة قراءة من الخيارات المحددة يدوياً
                        const selected = [];
                        optionInputs.forEach(inp => {
                            if (inp.style.borderColor === 'var(--ok)' || inp.style.borderColor === 'rgb(46, 125, 50)') {
                                selected.push(inp.value.trim());
                            }
                        });
                        if (selected.length > 0) correct = selected.join(',');
                    }
                } else if (type === 'essay' || type === 'complete') {
                    modelAnswer = card.querySelector('.q-model-answer').value.trim();
                }

                if (!text) {
                    showToast(`⚠️ السؤال ${idx + 1} لا يحتوي على نص.`, 'warning');
                    valid = false;
                    return;
                }

                if ((type === 'multiple' || type === 'single') && options.length < 2) {
                    showToast(`⚠️ السؤال ${idx + 1} يحتاج إلى خيارين على الأقل.`, 'warning');
                    valid = false;
                    return;
                }

                if ((type === 'single' || type === 'truefalse') && !correct) {
                    showToast(`⚠️ السؤال ${idx + 1} يحتاج إلى إجابة صحيحة.`, 'warning');
                    valid = false;
                    return;
                }

                questions.push({
                    id: 'q_' + Date.now() + '_' + idx,
                    text,
                    type,
                    points,
                    options,
                    correct,
                    modelAnswer
                });
            });

            if (!valid || questions.length === 0) {
                if (questions.length === 0) showToast('⚠️ أضف سؤالاً واحداً على الأقل.', 'warning');
                return false;
            }

            const totalPoints = questions.reduce((sum, q) => sum + q.points, 0);

            if (editId) {
                // تعديل اختبار موجود
                const exam = db.exams.find(e => e.id === editId);
                if (exam) {
                    exam.name = name;
                    exam.description = description;
                    exam.duration = duration;
                    exam.attempts = attempts;
                    exam.classId = classId;
                    exam.status = status;
                    exam.questions = questions;
                    exam.totalPoints = totalPoints;
                    exam.updatedAt = new Date().toISOString();
                }
                await saveDB();
                window.closeExamModal();
                showToast(`✅ تم تعديل الاختبار "${name}" بنجاح!`, 'success');
            } else {
                const examCode = genExamCode();
                const exam = {
                    id: 'exam_' + Date.now(),
                    code: examCode,
                    name,
                    description,
                    duration,
                    attempts,
                    classId,
                    status,
                    servantUsername: session.username,
                    questions,
                    createdAt: new Date().toISOString(),
                    totalPoints,
                    startTime: null,
                    endTime: null
                };
                db.exams.push(exam);
                await saveDB();
                window.closeExamModal();
                showToast(`✅ تم إنشاء الاختبار "${name}" بنجاح! كود الاختبار: ${examCode}`, 'success');
            }
            render();
            return false;
        };

        window.deleteExam = async function(examId) {
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) return;
            if (!confirm(`⚠️ هل أنت متأكد من حذف الاختبار "${exam.name}" وجميع نتائجه؟`)) return;

            db.exams = db.exams.filter(e => e.id !== examId);
            db.examResults = db.examResults.filter(r => r.examId !== examId);
            await saveDB();
            showToast(`🗑️ تم حذف الاختبار "${exam.name}"`, 'success');
            render();
        };

        window.startExam = function(examId, childId) {
            const exam = db.exams.find(e => e.id === examId);
            if (!exam) {
                showToast('❌ الاختبار غير موجود.', 'error');
                return;
            }

            if (exam.status === 'closed') {
                showToast('⚠️ هذا الاختبار مغلق.', 'warning');
                return;
            }

            const results = db.examResults.filter(r => r.examId === examId && r.childId === childId);
            if (results.length >= exam.attempts) {
                showToast('⚠️ لقد استهلكت جميع محاولاتك.', 'warning');
                return;
            }

            const pendingResult = results.find(r => r.status === 'in-progress');
            if (pendingResult) {
                renderExamQuestions(exam, childId, pendingResult);
                return;
            }

            const result = {
                id: 'result_' + Date.now(),
                examId: examId,
                childId: childId,
                startedAt: new Date().toISOString(),
                status: 'in-progress',
                answers: {},
                score: 0,
                totalPoints: exam.totalPoints,
                attempts: results.length + 1
            };

            db.examResults.push(result);
            saveDB();
            renderExamQuestions(exam, childId, result);
        };

        function renderExamQuestions(exam, childId, result) {
            const modal = document.getElementById('takeExamModal');
            document.getElementById('takeExamTitle').textContent = `📝 ${exam.name}`;

            const startTime = new Date(result.startedAt);
            const endTime = new Date(startTime.getTime() + exam.duration * 60000);
            const now = new Date();
            let timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));

            if (examTimerInterval) clearInterval(examTimerInterval);

            const timerDisplay = document.getElementById('takeExamTimer');
            examTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(examTimerInterval);
                    timerDisplay.textContent = '⏰ انتهى الوقت!';
                    submitExamAnswers(exam.id, childId, true);
                    return;
                }
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerDisplay.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                timerDisplay.style.color = timeLeft < 60 ? 'var(--bad)' : 'var(--ok)';
            }, 1000);

            const container = document.getElementById('takeExamContent');
            let html = `
                <div style="margin-bottom:12px;">
                    <p style="color:var(--text-muted);font-size:0.85rem;">${esc(exam.description || '')}</p>
                    <p style="color:var(--text-muted);font-size:0.8rem;">الدرجة الكلية: ${exam.totalPoints} | عدد الأسئلة: ${exam.questions.length}</p>
                    <p style="color:var(--text-muted);font-size:0.8rem;">المحاولة رقم ${result.attempts} من ${exam.attempts}</p>
                </div>
                <form id="examForm" onsubmit="event.preventDefault();">
            `;

            exam.questions.forEach((q, idx) => {
                const savedAnswer = result.answers[q.id] || '';
                const isEssay = q.type === 'essay' || q.type === 'complete';

                html += `
                    <div class="question-card">
                        <div class="question-text">
                            ${idx + 1}. ${esc(q.text)} 
                            <span style="font-size:0.7rem;color:var(--text-muted);">(${q.points} درجة)</span>
                            <span style="font-size:0.6rem;color:var(--text-muted);margin-right:6px;">[${q.type === 'truefalse' ? 'صح/خطأ' : q.type === 'single' ? 'اختيار واحد' : q.type === 'multiple' ? 'اختيار من متعدد' : q.type === 'essay' ? 'مقالي' : 'أكمل'}]</span>
                        </div>
                        <div class="question-options">
                `;

                if (q.type === 'truefalse') {
                    html += `
                        <label><input type="radio" name="q_${q.id}" value="صح" ${savedAnswer === 'صح' ? 'checked' : ''} /> صح</label>
                        <label><input type="radio" name="q_${q.id}" value="خطأ" ${savedAnswer === 'خطأ' ? 'checked' : ''} /> خطأ</label>
                    `;
                } else if (q.type === 'single') {
                    q.options.forEach(opt => {
                        html += `
                            <label><input type="radio" name="q_${q.id}" value="${esc(opt)}" ${savedAnswer === opt ? 'checked' : ''} /> ${esc(opt)}</label>
                        `;
                    });
                } else if (q.type === 'multiple') {
                    const savedAnswers = savedAnswer ? savedAnswer.split(',') : [];
                    q.options.forEach(opt => {
                        const checked = savedAnswers.includes(opt) ? 'checked' : '';
                        html += `
                            <label><input type="checkbox" name="q_${q.id}" value="${esc(opt)}" ${checked} /> ${esc(opt)}</label>
                        `;
                    });
                } else if (isEssay) {
                    html += `
                        <textarea name="q_${q.id}" style="width:100%;min-height:60px;" placeholder="اكتب إجابتك هنا...">${esc(savedAnswer)}</textarea>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            html += `
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button type="button" class="btn btn-primary" onclick="window.submitExamAnswers('${exam.id}','${childId}',false)"><i class="fas fa-check"></i> تسليم الاختبار</button>
                        <button type="button" class="btn btn-secondary" onclick="window.closeTakeExamModal()"><i class="fas fa-times"></i> إلغاء</button>
                    </div>
                </form>
            `;

            container.innerHTML = html;
            modal.classList.add('active');
        }

        window.submitExamAnswers = async function(examId, childId, autoSubmit = false) {
            if (examTimerInterval) clearInterval(examTimerInterval);

            const exam = db.exams.find(e => e.id === examId);
            if (!exam) {
                showToast('❌ الاختبار غير موجود.', 'error');
                return;
            }

            const result = db.examResults.find(r => r.examId === examId && r.childId === childId && r.status === 'in-progress');
            if (!result) {
                showToast('❌ لا توجد محاولة نشطة.', 'error');
                return;
            }

            const answers = {};
            let totalScore = 0;

            if (!autoSubmit) {
                const form = document.getElementById('examForm');
                if (!form) { autoSubmit = true; }
                if (form) {
                    const inputs = form.querySelectorAll('input, textarea');
                    inputs.forEach(input => {
                        if (input.type === 'radio' && input.checked) {
                            answers[input.name.replace('q_', '')] = input.value;
                        } else if (input.type === 'checkbox' && input.checked) {
                            const key = input.name.replace('q_', '');
                            if (!answers[key]) answers[key] = [];
                            answers[key].push(input.value);
                        } else if (input.type === 'text' || input.type === 'textarea') {
                            const key = input.name.replace('q_', '');
                            if (input.value.trim()) {
                                answers[key] = input.value.trim();
                            }
                        }
                    });

                    Object.keys(answers).forEach(key => {
                        if (Array.isArray(answers[key])) {
                            answers[key] = answers[key].join(',');
                        }
                    });
                }
            } else {
                Object.assign(answers, result.answers);
            }

            exam.questions.forEach(q => {
                const userAnswer = answers[q.id] || '';
                let isCorrect = false;

                if (q.type === 'truefalse') {
                    isCorrect = userAnswer.trim() === q.correct.trim();
                } else if (q.type === 'single') {
                    isCorrect = userAnswer.trim() === q.correct.trim();
                } else if (q.type === 'multiple') {
                    const userAnswers = userAnswer.split(',').map(a => a.trim()).filter(a => a);
                    const correctAnswers = q.correct.split(',').map(a => a.trim()).filter(a => a);
                    isCorrect = userAnswers.length === correctAnswers.length &&
                        userAnswers.every(a => correctAnswers.includes(a));
                } else if (q.type === 'essay' || q.type === 'complete') {
                    isCorrect = isAnswerCorrect(userAnswer, q.modelAnswer);
                }

                if (isCorrect) {
                    totalScore += q.points;
                }
            });

            result.status = 'completed';
            result.endedAt = new Date().toISOString();
            result.answers = answers;
            result.score = totalScore;
            result.isCorrect = totalScore >= exam.totalPoints * 0.5;

            await saveDB();
            window.closeTakeExamModal();
            showExamResult(examId, childId);
        };

        window.closeTakeExamModal = function() {

            document.getElementById('takeExamModal').classList.remove('active');
        };

        window.closeExamResultModal = function() {

        function showExamResult(examId, childId) {
            const exam = db.exams.find(e => e.id === examId);
            const result = db.examResults.find(r => r.examId === examId && r.childId === childId);
            if (!exam || !result) return;

            const child = db.children.find(c => c.id === childId);
            const container = document.getElementById('examResultContent');

            let html = `
                <div style="margin-bottom:16px;">
                    <h4 style="font-size:1.1rem;">${esc(exam.name)}</h4>
                    <p style="color:var(--text-muted);font-size:0.85rem;">الطالب: ${child ? esc(child.name) : 'غير معروف'}</p>
                    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;">
                        <span class="badge ${result.score >= exam.totalPoints * 0.5 ? 'badge-ok' : 'badge-bad'}">
                            ${result.score >= exam.totalPoints * 0.5 ? '✅ ناجح' : '❌ غير ناجح'}
                        </span>
                        <span class="badge badge-info">الدرجة: ${result.score} / ${exam.totalPoints}</span>
                        <span class="badge badge-info">المحاولة: ${result.attempts}</span>
                        <span class="badge badge-info">النسبة: ${Math.round((result.score / exam.totalPoints) * 100)}%</span>
                    </div>
                </div>
                <div style="max-height:400px;overflow-y:auto;">
            `;

            exam.questions.forEach((q, idx) => {
                const userAnswer = result.answers[q.id] || '';
                let isCorrect = false;

                if (q.type === 'truefalse') {
                    isCorrect = userAnswer.trim() === q.correct.trim();
                } else if (q.type === 'single') {
                    isCorrect = userAnswer.trim() === q.correct.trim();
                } else if (q.type === 'multiple') {
                    const userAnswers = userAnswer.split(',').map(a => a.trim()).filter(a => a);
                    const correctAnswers = q.correct.split(',').map(a => a.trim()).filter(a => a);
                    isCorrect = userAnswers.length === correctAnswers.length &&
                        userAnswers.every(a => correctAnswers.includes(a));
                } else if (q.type === 'essay' || q.type === 'complete') {
                    isCorrect = isAnswerCorrect(userAnswer, q.modelAnswer);
                }

                html += `
                    <div class="question-card" style="border-right:4px solid ${isCorrect ? 'var(--correct)' : 'var(--wrong)'};">
                        <div class="question-text">
                            ${idx + 1}. ${esc(q.text)}
                            <span style="font-size:0.7rem;color:${isCorrect ? 'var(--correct)' : 'var(--wrong)'};">
                                ${isCorrect ? '✅ صحيح' : '❌ خطأ'} (${q.points} درجة)
                            </span>
                        </div>
                        <div style="font-size:0.85rem;margin-top:4px;">
                            <div><strong>إجابتك:</strong> <span class="${isCorrect ? 'exam-result-correct' : 'exam-result-wrong'}">${esc(userAnswer) || 'لم يجب'}</span></div>
                            ${!isCorrect ? `<div><strong>الإجابة الصحيحة:</strong> <span class="exam-result-correct">${esc(q.correct || q.modelAnswer || '')}</span></div>` : ''}
                            ${q.type === 'essay' || q.type === 'complete' ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px;"><strong>الإجابة النموذجية:</strong> ${esc(q.modelAnswer || '')}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <button class="btn btn-secondary btn-sm" onclick="window.closeExamResultModal()"><i class="fas fa-times"></i> إغلاق</button>
                    ${session && session.isAdmin ? `<button class="btn btn-primary btn-sm" onclick="window.approveExamRetake('${examId}','${childId}')"><i class="fas fa-undo"></i> الموافقة على إعادة الاختبار</button>` : ''}
                    ${session && !session.isAdmin ? `<button class="btn btn-gold btn-sm" onclick="window.requestExamRetake('${examId}','${childId}')"><i class="fas fa-undo"></i> طلب إعادة الاختبار</button>` : ''}
                </div>
            `;

            container.innerHTML = html;
            document.getElementById('examResultModal').classList.add('active');
            document.getElementById('examResultModal').querySelector('.modal-header h3').textContent = '📊 نتيجة الاختبار';
        }

        window.requestExamRetake = function(examId, childId) {
            const result = db.examResults.find(r => r.examId === examId && r.childId === childId);
            if (!result) return;

            if (result.retakeRequested) {
                showToast('⚠️ لقد طلبت إعادة الاختبار بالفعل.', 'warning');
                return;
            }

            result.retakeRequested = true;
            result.retakeRequestedAt = new Date().toISOString();
            saveDB();
            showToast('✅ تم إرسال طلب إعادة الاختبار. في انتظار الموافقة.', 'success');
            render();
        };

        window.approveExamRetake = function(examId, childId) {
            if (!session || !session.isAdmin) {
                showToast('⛔ غير مصرح لك.', 'error');
                return;
            }

            const result = db.examResults.find(r => r.examId === examId && r.childId === childId);
            if (!result) return;

            db.examResults = db.examResults.filter(r => !(r.examId === examId && r.childId === childId));
            saveDB();
            showToast('✅ تمت الموافقة على إعادة الاختبار.', 'success');
            render();
        };

        window.viewStudentExams = function(childId) {
            const child = db.children.find(c => c.id === childId);
            if (!child) return;

            const exams = getExamsForClass(child.classId).filter(e => e.status === 'active' || e.status === 'draft');
            const results = getExamResultsForStudent(childId);

            // Apply score filter
            let filteredResults = results;
            if (examResultsScoreFilter) {
                if (examResultsScoreFilter === 'pass') {
                    filteredResults = results.filter(r => {
                        const exam = db.exams.find(e => e.id === r.examId);
                        return exam && r.score >= exam.totalPoints * 0.5;
                    });
                } else if (examResultsScoreFilter === 'fail') {
                    filteredResults = results.filter(r => {
                        const exam = db.exams.find(e => e.id === r.examId);
                        return exam && r.score < exam.totalPoints * 0.5;
                    });
                } else if (examResultsScoreFilter === 'completed') {
                    filteredResults = results.filter(r => r.status === 'completed');
                } else if (examResultsScoreFilter === 'in-progress') {
                    filteredResults = results.filter(r => r.status === 'in-progress');
                }
            }

            const container = document.getElementById('examResultContent');

            if (exams.length === 0) {
                container.innerHTML = `<p class="empty">لا توجد اختبارات متاحة لصفك حالياً.</p>`;
                document.getElementById('examResultModal').classList.add('active');
                document.getElementById('examResultModal').querySelector('.modal-header h3').textContent = '📚 الاختبارات المتاحة';
                return;
            }

            let html = `
                <div class="score-filter">
                    <span style="font-size:0.8rem;color:var(--text-muted);"><i class="fas fa-filter"></i> فلترة النتائج:</span>
                    <select onchange="window.setExamResultsScoreFilter(this.value)">
                        <option value="">الكل</option>
                        <option value="pass" ${examResultsScoreFilter === 'pass' ? 'selected' : ''}>✅ ناجح</option>
                        <option value="fail" ${examResultsScoreFilter === 'fail' ? 'selected' : ''}>❌ غير ناجح</option>
                        <option value="completed" ${examResultsScoreFilter === 'completed' ? 'selected' : ''}>✅ مكتمل</option>
                        <option value="in-progress" ${examResultsScoreFilter === 'in-progress' ? 'selected' : ''}>⏳ قيد التقدم</option>
                    </select>

                <div style="display:grid;gap:12px;">
                    ${exams.map(exam => {
                        const result = results.find(r => r.examId === exam.id);
                        const isCompleted = result && result.status === 'completed';
                        const isInProgress = result && result.status === 'in-progress';
                        const isActive = exam.status === 'active';

                        if (examResultsScoreFilter && !filteredResults.some(r => r.examId === exam.id)) {
                            return '';
                        }

                        return `
                            <div class="exam-card">
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                    <div>
                                        <div class="exam-title">
                                            <i class="fas fa-pencil-alt" style="color:var(--sky-dark);"></i>
                                            ${esc(exam.name)}
                                            <span class="badge ${exam.status === 'active' ? 'badge-ok' : exam.status === 'draft' ? 'badge-pending' : 'badge-bad'}">
                                                ${exam.status === 'active' ? '✅ نشط' : exam.status === 'draft' ? '⏳ مسودة' : '❌ مغلق'}

                                        </div>
                                        <p style="font-size:0.8rem;color:var(--text-muted);margin:4px 0 0;">${esc(exam.description || '')}</p>

                                            <span>🏆 ${exam.totalPoints} درجة</span>
                                            <span>🔄 ${exam.attempts} محاولات</span>
                                        </div>
                                    </div>
                                    <div class="exam-actions">
                                        ${isCompleted ? `
                                            <button class="btn btn-sm btn-secondary" onclick="window.showExamResult('${exam.id}','${childId}')"><i class="fas fa-eye"></i> النتيجة</button>
                                        ` : ''}
                                        ${isInProgress ? `
                                            <button class="btn btn-sm btn-gold" onclick="window.startExam('${exam.id}','${childId}')"><i class="fas fa-play"></i> استكمال</button>
                                        ` : ''}
                                        ${isActive && !isCompleted && !isInProgress ? `
                                            <button class="btn btn-sm btn-primary" onclick="window.startExam('${exam.id}','${childId}')"><i class="fas fa-play"></i> بدء الاختبار</button>
                                        ` : ''}
                                        ${exam.status === 'draft' && !isCompleted && !isInProgress ? `
                                            <span class="badge badge-pending">⏳ غير متاح بعد</span>
                                        ` : ''}
                                        ${exam.status === 'closed' && !isCompleted ? `
                                            <span class="badge badge-bad">❌ مغلق</span>
                                        ` : ''}
                                    </div>
                                </div>
                                ${result && result.retakeRequested ? `<div style="font-size:0.7rem;color:var(--pending);margin-top:4px;">⏳ في انتظار موافقة إعادة الاختبار</div>` : ''}

            container.innerHTML = html;

        async function submitRegister(ev) {
            ev.preventDefault();
            const f = ev.target;
            const name = f.name.value.trim();
            const username = f.username.value.trim();
            const password = f.password.value;
            const confirm = f.confirm.value;
            const msgBox = document.getElementById('formMsg');

            if (!name || !username || !password) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أكمل جميع الحقول.</div>`;
                return false;
            }
            if (password !== confirm) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> كلمتا المرور غير متطابقتين.</div>`;
                return false;
            }
            if (password.length < 6) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> كلمة المرور 6 أحرف على الأقل.</div>`;
                return false;
            }
            if (db.servants.some(s => s.username === username)) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> اسم المستخدم مستخدم بالفعل.</div>`;
                return false;
            }

            const passwordHash = await sha256(password);
            db.servants.push({
                name, username, passwordHash,
                isActive: false,
                isPending: true,
                assignedClass: null,
                pendingSince: todayDate()
            });
            await saveDB();
            showToast('✅ تم تسجيل حسابك! في انتظار موافقة الأدمن.', 'success');
            go('home');
            return false;
        }

        async function submitLogin(ev) {
            ev.preventDefault();
            const f = ev.target;
            const username = f.username.value.trim();
            const password = f.password.value;
            const msgBox = document.getElementById('formMsg');

            const servant = db.servants.find(s => s.username === username);
            const hash = await sha256(password);
            if (!servant || servant.passwordHash !== hash) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;
                return false;

            if (servant.isPending) {
                msgBox.innerHTML = `<div class="alert alert-warning"><i class="fas fa-clock"></i> ⏳ حسابك في انتظار موافقة الأدمن.</div>`;
                return false;
            }

            if (servant.isActive === false) {
                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-times-circle"></i> ⛔ هذا الحساب موقوف.</div>`;
                return false;
            }

            session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
            saveSession(session.username, session.name, session.isAdmin);
            showToast('✅ تم تسجيل الدخول بنجاح!', 'success');
            go('dashboard');
            return false;
        }

                <div style="margin-bottom:16px;">

                            ${q.modelAnswer ? `<span style="font-size:0.7rem;color:var(--text-muted);margin-right:6px;">✎ ${esc(q.modelAnswer)}</span>` : ''}

        // ---- QUICK MARK ----
        window.quickMark = async function(childId, status) {
            if (!session || !isServantActive(session.username)) {
                showToast('⚠️ لا يمكنك تسجيل الحضور.', 'warning');
                return;
            }

            const today = todayDate();
            const idx = db.attendance.findIndex(a => a.childId === childId && a.weekDate === today);
            const record = { childId, weekDate: today, status, note: idx >= 0 ? db.attendance[idx].note : '' };
            if (idx >= 0) db.attendance[idx] = record;
            else db.attendance.push(record);
            await saveDB();
            const child = db.children.find(c => c.id === childId);
            showToast(`✅ تم تسجيل "${status}" لـ "${child ? child.name : ''}"`, 'success');
            render();
        };

        // ---- ADD CHILD ----
        window.submitAddChild = async function(ev) {
            ev.preventDefault();
            if (!session || !isServantActive(session.username)) {
                showToast('⚠️ لا يمكنك إضافة أطفال.', 'warning');
                return false;
            }

            const f = ev.target;
            const name = f.childName.value.trim();

                msgBox.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أدخل اسم الطفل واختر الصف.</div>`;

            const code = genCode();
            db.children.push({
                id: crypto.randomUUID(),
                servantUsername: session.username,
                name,
                classId,
                code
            });
            await saveDB();
            showToast(`✅ تمت إضافة "${name}" بنجاح. كود: ${code}`, 'success');
            render();
            return false;
        };

        window.copyCode = function(code, btn) {

                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => btn.innerHTML = old, 1200);
            });
        };

        window.deleteChild = async function(childId) {
            if (!session || !isServantActive(session.username)) {
                showToast('⚠️ لا يمكنك حذف الأطفال.', 'warning');
                return;
            }

            const child = db.children.find(c => c.id === childId && c.servantUsername === session?.username);

            showToast(`🗑️ تم حذف "${child.name}"`, 'success');

                return;

            const children = myChildren();

            const child = db.children.find(c => c.id === childId && c.servantUsername === session?.username);
            if (!child) { setFlash('الطفل غير موجود.', 'error'); go('dashboard'); return ''; }

            const records = db.attendance.filter(a => a.childId === child.id).sort((a, b) => b.weekDate.localeCompare(a.weekDate));
            const presentDates = records.filter(r => r.status === 'حاضر').map(r => r.weekDate);
            const absentDates = records.filter(r => r.status === 'غائب').map(r => r.weekDate);

            const rows = records.map(r => `
                <tr>
                    <td>${esc(r.weekDate)}</td>
                    <td><span class="badge ${r.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(r.status)}</span></td>
                    <td>${esc(r.note || '—')}</td>
                </tr>`).join('');

            return `
                <section>
                    <button class="btn btn-secondary btn-sm" style="margin-bottom:12px;" onclick="window.go('dashboard')"><i class="fas fa-arrow-right"></i> رجوع</button>
                    <div class="glass">
                        <h2 style="font-size:1.3rem;"><i class="fas fa-user-graduate" style="color:var(--sky-dark);"></i> ${esc(child.name)}</h2>
                        <p style="font-size:0.9rem;"><i class="fas fa-layer-group"></i> الصف: ${esc(getClassById(child.classId)?.name || 'غير محدد')}</p>
                        <p style="font-size:0.9rem;"><i class="fas fa-key"></i> الكود: <code class="code-pill">${esc(child.code)}</code></p>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                        <button class="btn btn-sm btn-secondary" onclick="window.viewStudentExams('${child.id}')"><i class="fas fa-pencil-alt"></i> عرض الاختبارات</button>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--ok);font-size:1rem;"><i class="fas fa-check-circle"></i> الحضور (${presentDates.length})</h4>
                            <div style="font-size:0.8rem;">${presentDates.length ? presentDates.map(d => `<span class="badge badge-ok" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                        <div class="glass" style="text-align:center;padding:12px;">
                            <h4 style="color:var(--bad);font-size:1rem;"><i class="fas fa-times-circle"></i> الغياب (${absentDates.length})</h4>
                            <div style="font-size:0.8rem;">${absentDates.length ? absentDates.map(d => `<span class="badge badge-bad" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                        </div>
                    </div>
                    <h3 style="font-size:1.1rem;margin-top:16px;"><i class="fas fa-history"></i> السجل التفصيلي</h3>
                    ${records.length === 0 ? `<p class="empty">لا يوجد سجلات</p>` : `
                    <div class="glass table-wrap">
                        <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
                    </div>`}
                </section>`;
        }

        // ---- STUDENT LOOKUP ----
        function viewStudent() {
            return `
                <section class="panel glass">
                    <h2 style="font-size:1.3rem;"><i class="fas fa-search" style="color:var(--sky-dark);"></i> استعلام الطالب</h2>
                    <p style="color:var(--text-muted);font-size:0.9rem;">أدخل الكود الخاص بك أو امسح الباركود لعرض تقريرك واختباراتك.</p>
                    <form class="form-row" onsubmit="return window.submitStudentLookup(event)">
                        <label style="flex:1;"><i class="fas fa-key"></i> الكود <input name="code" maxlength="10" style="text-transform:uppercase;" required placeholder="أدخل الكود" /></label>
                        <button class="btn btn-primary" type="submit"><i class="fas fa-search"></i> استعلام</button>
                        <button type="button" class="barcode-btn" onclick="window.openBarcodeModal()">
                            <i class="fas fa-barcode"></i> مسح الباركود
                        </button>
                    </form>
                    <div id="studentResult"></div>
                </section>`;
        }

        window.submitStudentLookup = function(ev) {
            ev.preventDefault();
            const code = ev.target.code.value.trim().toUpperCase();
            const box = document.getElementById('studentResult');
            const child = db.children.find(c => c.code === code);
            if (!child) {
                box.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> الكود غير صحيح.</div>`;
                return false;
            }

            const records = db.attendance.filter(a => a.childId === child.id).sort((a, b) => b.weekDate.localeCompare(a.weekDate));
            const presentDates = records.filter(r => r.status === 'حاضر').map(r => r.weekDate);
            const absentDates = records.filter(r => r.status === 'غائب').map(r => r.weekDate);
            const exams = getExamsForClass(child.classId).filter(e => e.status === 'active' || e.status === 'draft');
            const examResults = getExamResultsForStudent(child.id);

            const rows = records.map(r => `
                <tr>
                    <td>${esc(r.weekDate)}</td>
                    <td><span class="badge ${r.status === 'حاضر' ? 'badge-ok' : 'badge-bad'}">${esc(r.status)}</span></td>
                    <td>${esc(r.note || '—')}</td>
                </tr>`).join('');

            const examsHtml = exams.length > 0 ? `
                <div style="margin-top:12px;">
                    <h4 style="font-size:0.95rem;"><i class="fas fa-pencil-alt"></i> الاختبارات المتاحة</h4>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;">
                        ${exams.map(exam => {
                            const result = examResults.find(r => r.examId === exam.id);
                            const isCompleted = result && result.status === 'completed';
                            return `
                                <div style="background:var(--bg-glass);border-radius:12px;padding:10px 14px;border:1px solid var(--border-glass);flex:1;min-width:150px;">
                                    <div style="font-weight:600;font-size:0.85rem;">${esc(exam.name)}</div>
                                    <div style="font-size:0.7rem;color:var(--text-muted);">
                                        ${isCompleted ? '✅ تم الاختبار' : (exam.status === 'active' ? '🟢 متاح' : '⏳ غير متاح')}
                                    </div>
                                    ${exam.status === 'active' && !isCompleted ? `<button class="btn btn-sm btn-primary" onclick="window.startExam('${exam.id}','${child.id}')" style="margin-top:4px;">بدء الاختبار</button>` : ''}
                                    ${isCompleted ? `<button class="btn btn-sm btn-secondary" onclick="window.showExamResult('${exam.id}','${child.id}')" style="margin-top:4px;">عرض النتيجة</button>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            ` : '';

            box.innerHTML = `
                <div class="glass" style="margin-top:12px;padding:16px;">
                    <h3 style="font-size:1.1rem;"><i class="fas fa-user-graduate" style="color:var(--sky-dark);"></i> ${esc(child.name)}</h3>
                    <p style="font-size:0.85rem;"><i class="fas fa-layer-group"></i> الصف: ${esc(getClassById(child.classId)?.name || 'غير محدد')}</p>
                    <p style="font-size:0.85rem;"><i class="fas fa-user"></i> الخادم المسؤول: ${esc(getServantByUsername(child.servantUsername)?.name || 'غير معروف')}</p>
                </div>
                ${examsHtml}
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
                    <div class="glass" style="text-align:center;padding:12px;">
                        <h4 style="color:var(--ok);font-size:0.9rem;"><i class="fas fa-check-circle"></i> الحضور (${presentDates.length})</h4>
                        <div style="font-size:0.8rem;">${presentDates.length ? presentDates.map(d => `<span class="badge badge-ok" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                    </div>
                    <div class="glass" style="text-align:center;padding:12px;">
                        <h4 style="color:var(--bad);font-size:0.9rem;"><i class="fas fa-times-circle"></i> الغياب (${absentDates.length})</h4>
                        <div style="font-size:0.8rem;">${absentDates.length ? absentDates.map(d => `<span class="badge badge-bad" style="margin:2px;">${esc(d)}</span>`).join(' ') : 'لا يوجد'}</div>
                    </div>
                </div>
                ${records.length === 0 ? `<p class="empty">لا يوجد سجلات حضور</p>` : `
                <div class="glass table-wrap" style="margin-top:12px;">
                    <table><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>${rows}</tbody></table>
                </div>`}
            `;
            return false;
        };

        // ---- CHAT ----
        function viewChat() {
            if (!session) { go('login'); return ''; }

            const isActive = isServantActive(session.username);
            const isPending = isServantPending(session.username);

            if (isPending) { setFlash('⏳ حسابك في انتظار الموافقة.', 'warning'); go('home'); return ''; }
            if (!isActive) { setFlash('⛔ حسابك موقوف.', 'error'); go('home'); return ''; }

            const user = getServantByUsername(session.username);
            const rooms = getChatRooms(user);
            const currentRoomId = routeParam || (rooms.length > 0 ? rooms[0].id : null);

            if (currentRoomId) markAsRead(currentRoomId, session.username);

            currentChat = currentRoomId;

            let chatListHtml = '';
            if (rooms.length === 0) {
                chatListHtml = `
                    <div class="empty">
                        <i class="fas fa-inbox" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>
                        لا توجد محادثات
                    </div>
                `;
            } else {
                rooms.forEach(room => {
                    const isActiveRoom = room.id === currentRoomId;
                    let displayName = room.name || 'محادثة';
                    let displayIcon = 'fas fa-user';
                    let avatarClass = '';

                    if (room.type === 'admin-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = session.isAdmin ? 'fas fa-chalkboard-teacher' : 'fas fa-shield-alt';
                        avatarClass = session.isAdmin ? '' : 'admin-avatar';
                    } else if (room.type === 'servant-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                        displayIcon = 'fas fa-user';
                    } else if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                    }

                    const unread = room.unreadCount ? (room.unreadCount[session.username] || 0) : 0;
                    const roomType = room.type === 'admin-admin' ? 'أدمن-أدمن' :
                        room.type === 'admin-servant' ? 'أدمن-خادم' : 'خادم-خادم';

                    chatListHtml += `
                        <div class="chat-item ${isActiveRoom ? 'active' : ''}" onclick="window.go('chat','${room.id}')">
                            <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                            <div class="chat-info">
                                <div class="chat-name">${esc(displayName)}</div>
                                <div class="chat-last-msg">${esc(room.lastMessage || 'لا توجد رسائل')}</div>
                            </div>
                            ${unread > 0 ? `<span class="chat-badge">${unread}</span>` : ''}
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
                                <div class="chat-time">${new Date(room.lastMessageTime).toLocaleDateString('ar')}</div>
                                <span class="chat-type">${roomType}</span>
                            </div>
                        </div>
                    `;
                });
            }

            let chatAreaHtml = '';
            if (!currentRoomId) {
                chatAreaHtml = `
                    <div class="chat-empty">
                        <i class="fas fa-comments"></i>
                        <h3 style="font-size:1.1rem;">اختر محادثة</h3>
                        <p style="color:var(--text-muted);font-size:0.85rem;">اختر محادثة من القائمة الجانبية للبدء</p>
                    </div>
                `;
            } else {
                const room = db.chatRooms.find(r => r.id === currentRoomId);
                let displayName = 'المحادثة';
                let displayIcon = 'fas fa-user';
                let avatarClass = '';
                let roomType = '';

                if (room) {
                    if (room.type === 'admin-admin') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'أدمن';
                        displayIcon = 'fas fa-shield-alt';
                        avatarClass = 'admin-avatar';
                        roomType = 'أدمن-أدمن';
                    } else if (room.type === 'admin-servant') {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : (session.isAdmin ? 'خادم' : 'أدمن');
                        displayIcon = session.isAdmin ? 'fas fa-chalkboard-teacher' : 'fas fa-shield-alt';
                        roomType = 'أدمن-خادم';
                    } else {
                        const other = room.participants.find(p => p !== session.username);
                        const otherUser = getServantByUsername(other);
                        displayName = otherUser ? otherUser.name : 'خادم';
                        displayIcon = 'fas fa-user';
                        roomType = 'خادم-خادم';
                    }
                }

                const messages = room ? getMessages(currentRoomId) : [];

                const messagesHtml = messages.map(msg => {
                    const isOwn = msg.from === session.username;
                    const sender = getServantByUsername(msg.from);
                    const senderName = sender ? sender.name : (msg.from === session.username ? 'أنت' : msg.from);

                    if (msg.type === 'poll' && msg.data) {
                        const poll = msg.data;
                        const totalVotes = poll.options.reduce((sum, o) => sum + o.votes, 0);
                        const hasVoted = poll.voters.includes(session.username);

                        return `
                            <div class="poll-message" style="align-self:${isOwn ? 'flex-end' : 'flex-start'};">
                                ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                                <div class="poll-question">📊 ${esc(poll.question)}</div>
                                ${poll.options.map((opt, idx) => {
                                    const percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
                                    const voted = hasVoted;
                                    return `
                                        <div class="poll-option ${voted ? 'voted' : ''}" onclick="${!voted ? `window.votePoll('${currentRoomId}','${poll.id}',${idx})` : ''}" style="${voted ? 'cursor:default;' : 'cursor:pointer;'}">
                                            <span style="min-width:16px;">${String.fromCharCode(65 + idx)}.</span>
                                            <span style="flex:1;">${esc(opt.text)}</span>
                                            <div class="poll-bar"><div class="poll-fill" style="width:${percent}%;"></div></div>
                                            <span class="poll-percent">${percent}% (${opt.votes})</span>
                                            ${voted ? '<i class="fas fa-check-circle" style="color:var(--ok);font-size:0.7rem;"></i>' : ''}
                                        </div>
                                    `;
                                }).join('')}
                                <div style="font-size:0.55rem;color:var(--text-muted);margin-top:4px;text-align:left;">
                                    ${totalVotes} صوت ${hasVoted ? '✅ تم التصويت' : ''}
                                    <span style="margin-right:6px;">${new Date(msg.timestamp).toLocaleString('ar')}</span>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="message ${isOwn ? 'own' : 'other'}">
                            ${!isOwn ? `<div class="msg-sender">${esc(senderName)}</div>` : ''}
                            <div class="msg-text">${esc(msg.text)}</div>
                            <div class="msg-time">${new Date(msg.timestamp).toLocaleString('ar')}</div>
                        </div>
                    `;
                }).join('');

                const canCreatePoll = session.isAdmin;

                chatAreaHtml = `
                    <div class="chat-header">
                        <div class="avatar ${avatarClass}"><i class="${displayIcon}"></i></div>
                        <div class="chat-with">${esc(displayName)}</div>
                        <span class="chat-type-badge">${roomType}</span>
                        <div style="margin-right:auto;display:flex;gap:4px;">
                            ${canCreatePoll ? `<button class="btn btn-sm btn-secondary" onclick="window.openPollModal()" title="استطلاع رأي"><i class="fas fa-poll"></i></button>` : ''}
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        ${messagesHtml}
                    </div>
                    <div class="chat-input" style="position:relative;">
                        <div class="emoji-picker" id="emojiPicker">
                            <div class="emoji-grid">
                                ${EMOJIS.map(e => `<span onclick="window.insertEmoji('${e}')">${e}</span>`).join('')}
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <button class="emoji-btn" onclick="window.toggleEmojiPicker()" title="إيموجي"><i class="far fa-smile"></i></button>
                            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') window.sendChatMessage()" />
                            ${canCreatePoll ? `<button class="poll-btn" onclick="window.openPollModal()" title="استطلاع رأي"><i class="fas fa-poll"></i> استطلاع</button>` : ''}
                            <button class="send-btn" onclick="window.sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;
            }

            return `
                <section>
                    <h2 style="font-size:1.3rem;"><i class="fas fa-comment-dots" style="color:var(--sky-dark);"></i> المحادثات</h2>
                    ${alertHtml()}
                    <div style="display:flex;gap:16px;height:60vh;min-height:400px;flex-wrap:wrap;">
                        <div style="width:260px;min-width:200px;flex:0 0 auto;overflow-y:auto;padding:4px;" class="glass">
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;margin-bottom:6px;">
                                <h4 style="font-size:0.8rem;color:var(--text-muted);margin:0;"><i class="fas fa-users"></i> المحادثات (${rooms.length})</h4>
                            </div>
                            ${chatListHtml}
                        </div>
                        <div style="flex:1;min-width:0;display:flex;flex-direction:column;" class="glass">
                            ${chatAreaHtml}
                        </div>
                    </div>
                </section>
            `;
        }

        window.sendChatMessage = function() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;

            const text = input.value.trim();
            const roomId = routeParam || currentChat;
            if (!roomId) {
                showToast('⚠️ يرجى اختيار محادثة.', 'warning');
                return;
            }

            const room = db.chatRooms.find(r => r.id === roomId);
            if (!room) {
                showToast('⚠️ الغرفة غير موجودة.', 'error');
                return;
            }

            sendMessage(roomId, session.username, text, 'text', null);
            input.value = '';
            document.getElementById('emojiPicker').classList.remove('open');

            setTimeout(() => {
                const container = document.getElementById('chatMessages');
                if (container) container.scrollTop = container.scrollHeight;
            }, 100);
        };

        // ============================================================
        // RENDER ENGINE
        // ============================================================
        function render() {
            renderNav();
            const app = document.getElementById('app');

            if ((route === 'dashboard' || route === 'attendance' || route === 'childReport' || route === 'chat' || route === 'exams') && !session) {
                route = 'login';
            }

            if (session) {
                const servant = db.servants.find(s => s.username === session.username);
                if (servant && servant.isPending) {
                    if (route === 'dashboard' || route === 'attendance' || route === 'chat' || route === 'exams') {
                        setFlash('⏳ حسابك في انتظار الموافقة.', 'warning');
                        route = 'home';
                    }
                } else if (servant && !servant.isActive && !servant.isPending) {
                    if (route === 'dashboard' || route === 'attendance' || route === 'chat' || route === 'exams') {
                        setFlash('⛔ حسابك موقوف.', 'error');
                        route = 'home';
                    }
                }
            }

            if (session && isServantActive(session.username) && !isServantPending(session.username)) {
                document.getElementById('chatFab').style.display = 'flex';
                updateChatBadge();
            } else {
                document.getElementById('chatFab').style.display = 'none';
            }

            switch (route) {
                case 'home': app.innerHTML = viewHome(); break;
                case 'register': app.innerHTML = viewRegister(); break;
                case 'login': app.innerHTML = viewLogin(); break;
                case 'dashboard': app.innerHTML = viewDashboard(); break;
                case 'attendance': app.innerHTML = viewAttendance(); break;
                case 'childReport': app.innerHTML = viewChildReport(routeParam); break;
                case 'student': app.innerHTML = viewStudent(); break;
                case 'chat': app.innerHTML = viewChat();
                    setTimeout(() => {
                        const container = document.getElementById('chatMessages');
                        if (container) container.scrollTop = container.scrollHeight;
                    }, 300);
                    break;
                case 'exams': app.innerHTML = viewExams(); break;
                default: app.innerHTML = viewHome();
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        (async function init() {
            await loadDB();
            applyTheme(currentTheme);

            const savedSession = loadSession();
            if (savedSession) {
                const servant = db.servants.find(s => s.username === savedSession.username);
                if (servant && servant.isActive && !servant.isPending) {
                    session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
                    if (route === 'home' || route === 'login') route = 'dashboard';
                } else if (servant && servant.isPending) {
                    session = { username: servant.username, name: servant.name, isAdmin: servant.isAdmin || false };
                } else {
                    clearSession();
                }
            }

            if ('Notification' in window && Notification.permission === 'default') {
                setTimeout(() => Notification.requestPermission(), 3000);
            }

            render();
            watchDB();

            if (routeParam && route === 'chat') {
                setTimeout(() => {
                    const container = document.getElementById('chatMessages');
                    if (container) container.scrollTop = container.scrollHeight;
                }, 500);
            }
        })();

        // ============================================================
        // EXPOSE
        // ============================================================
        window.go = go;
        window.toggleTheme = toggleTheme;
        window.logout = logout;
        window.submitRegister = submitRegister;
        window.submitLogin = submitLogin;
        window.submitAddChild = submitAddChild;
        window.submitStudentLookup = submitStudentLookup;
        window.quickMark = quickMark;
        window.deleteChild = deleteChild;
        window.copyCode = copyCode;
        window.saveAttendance = saveAttendance;
        window.sendChatMessage = sendChatMessage;
        window.openChat = openChat;
        window.openPollModal = openPollModal;
        window.closePollModal = closePollModal;
        window.addPollOption = addPollOption;
        window.submitPoll = submitPoll;
        window.votePoll = votePoll;
        window.toggleEmojiPicker = toggleEmojiPicker;
        window.insertEmoji = insertEmoji;
        window.openPasswordModal = openPasswordModal;
        window.closePasswordModal = closePasswordModal;
        window.submitChangePassword = submitChangePassword;
        window.openExamModal = openExamModal;
        window.closeExamModal = closeExamModal;
        window.addQuestion = addQuestion;
